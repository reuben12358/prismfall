# LOOM palette (builder 3): the Loomhouse Gym (130-133) as a canopy gym on tileset 40 "Prismfall Wilds":
# wooden decks over a black drop (the forest floor far below; layout scripts scatter treetops on it).
# Glyphs match gym_rock.yaml so gen_gym1.py's puzzle grids keep their coordinates.
tileset: 40
ground: {base: 1616}
classes:
  floor:  {kind: tile, tile: 3804, layer: 0}       # vertical-board deck
  plank:  {kind: tile, tile: 3807, layer: 0}       # cross-board walkway
  void:   {kind: ground}                           # black drop (solid)
  rock:   {kind: tile, tile: 3804, layer: 0}       # deck under a silk wall (the curtain is added as an explicit tile)
  wall:   {kind: ground}
glyphs:
  '.': floor
  '_': plank
  'v': void
  'o': rock
  '#': wall
tiles:
  sign: {layer: 1, tile: 22939}          # wooden signpost (material_art), MAPGEN 2g
  sign_top: {layer: 2, tile: 22931}
