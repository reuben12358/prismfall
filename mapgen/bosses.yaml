# Story bosses used by map events. build.py writes them into maps_out/Plugins/Prismfall Maps/003_StoryBosses.rb as
# Prismfall::Bosses.register(:ID, {...}) calls (guarded: only when the Prismfall Bosses plugin is installed).
# Events start them with the DSL command {boss: {id: ID, species: X, level: N, field: F}}: Prismfall::Bosses.wild_battle(:ID),
# falling back to a plain WildBattle (same species/level/field, cannotRun) when the plugin is absent.
# Each entry's `ruby` is the body of the definition Hash (keys per design/BOSSES.md section 2).
GLASS_MATRIARCH:
  map: 548
  # Re-levelled by the trainer workstream for SPINE Rev 14: fought after Gym 2 now (cap 23), 2 bars as the Ch3 script asks
  # (Hard 3), and at the first break it "re-strings the nest": the Bleed borrows the SILKWOOD for 3 rounds
  # (Electroweb x1.5 and never misses, Bug x1.5, String Shot -3 Speed). Its set is built for that window.
  ruby: |
    :species    => :GALVANTULA,
    :level      => { :CASUAL => 18, :STANDARD => 20, :HARD => 22, :default => 20 },
    :nickname   => "Glass Matriarch",
    :moves      => { :CASUAL => [:ELECTROWEB, :BUGBITE, :STRINGSHOT, :ABSORB],
                     :STANDARD => [:ELECTROWEB, :BUGBITE, :STRINGSHOT, :SCREECH],
                     :HARD => [:ELECTROWEB, :BUGBUZZ, :STICKYWEB, :THUNDERWAVE],
                     :default => [:ELECTROWEB, :BUGBITE, :STRINGSHOT, :SCREECH] },
    :bars       => { :CASUAL => 2, :STANDARD => 2, :HARD => 3, :default => 2 },
    :stat_mults => { :HP => 1.1, :DEFENSE => 1.15, :SPECIAL_DEFENSE => 1.15 },
    :field      => :BLEED,
    :intro      => "The Glass Matriarch rises from its nest, every crystal hair ringing!",
    :breaks     => {
      1 => { :message => "{1} re-strings the nest! Crystal silk floods the Bleed!", :stats => { :DEFENSE => 1 },
             :proc => proc { |battle, battler, state|
               next false if !defined?(FieldEffects) || FieldEffects.current(battle) != :BLEED
               st = FieldEffects.raw_state(battle)
               next false if !st
               old = st[:borrowed].dup
               st[:borrowed] = [:SILKWOOD]
               st[:borrow_timer] = 3
               FieldEffects.invalidate_cache(battle)
               battle.pbDisplay(FieldEffects.format("The Bleed convulses... echoes of the {1} tear through the battlefield!",
                                                    FieldEffects.name_of(:SILKWOOD)))
               FieldEffects.notify_overlay_change(battle, :BLEED, old, [:SILKWOOD])
               true
             } },
      2 => { :message => "{1} pulls the Bleed into its nest!", :cure_status => true, :stats => { :SPEED => 1 } }
    },
    :on_defeat  => { :message => "{1} folds its legs. The ringing of the nest softens.", :result => :calmed }
OVERCHARGED:
  map: 952
  # Map builder 15 (story/24_SCRIPT_CH5.md, the Plate Vault): the vault's guard Electivire, swollen with the Shatter's
  # discharge.  2 bars, the segment after Gym 4 (cap 27 -> 31); at the bar break the cracked Plate screams and the field
  # flips :NEON_GRID -> :BLEED, the game's first scripted any -> Bleed.  Numbers are a first pass for the BOSSES.md owner.
  ruby: |
    :species    => :ELECTIVIRE,
    :level      => { :CASUAL => 28, :STANDARD => 30, :HARD => 32, :default => 30 },
    :nickname   => "Overcharged",
    :moves      => { :CASUAL => [:THUNDERPUNCH, :LOWKICK, :QUICKATTACK, :LEER],
                     :STANDARD => [:THUNDERPUNCH, :LOWKICK, :FIREPUNCH, :CHARGE],
                     :HARD => [:WILDCHARGE, :LOWKICK, :FIREPUNCH, :CHARGE],
                     :default => [:THUNDERPUNCH, :LOWKICK, :FIREPUNCH, :CHARGE] },
    :bars       => { :CASUAL => 2, :STANDARD => 2, :HARD => 2, :default => 2 },
    :stat_mults => { :HP => 1.15, :ATTACK => 1.1 },
    :field      => :NEON_GRID,
    :intro      => "The vault's Electivire unfolds, crackling white, its eyes empty!",
    :breaks     => {
      1 => { :message => "{1} drinks from the cracked Plate!", :stats => { :ATTACK => 1 },
             :proc => proc { |battle, battler, state|
               if battle.respond_to?(:pbShowCommands)
                 c = (battle.pbShowCommands(_INTL("The cracked Plate is spitting light on the dais, an arm's length away. Rook: Don't touch it with your HANDS!"),
                                            [_INTL("Hold the line."), _INTL("Grab the cracked Plate and run.")], false) rescue 0)
                 if c == 1
                   pfm_set(:live_wire, true) rescue nil
                   battle.decision = 3
                   next true
                 end
               end
               next false if !battle.respond_to?(:change_field)
               battle.change_field(:BLEED, "The cracked Plate screams. The vault stops being sure what it's made of!")
             } }
    },
    :on_defeat  => { :message => "{1} crashes down beside the cradle, and the light goes out of it.", :result => :calmed }
