        \    else\n      pbSEPlay(\"GUI sel buzzer\", 75, 100)\n    end\n  when 4\n    $game_variables[330] = 0\n    pbSEPlay(\"Anim/Bubble1\", 75, 100)\n\
        \  when 5\n    $game_variables[331] = 0\n    pbSEPlay(\"Anim/Bubble1\", 75, 100)\n  else\n    break\n  end\nend"}
