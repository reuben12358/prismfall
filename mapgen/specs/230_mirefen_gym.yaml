    - {script: "loop do\n  s = $game_variables[330].to_i\n  b = $game_variables[331].to_i\n  cmds = [\n    _INTL(\"Fill 3-Flask (now {1}/3)\", s),\n   \
        \ _INTL(\"Fill 5-Flask (now {1}/5)\", b),\n    _INTL(\"Pour 3 -> 5\"),\n    _INTL(\"Pour 5 -> 3\"),\n    _INTL(\"Tip out 3-Flask\"),\n    _INTL(\"\
        Tip out 5-Flask\"),\n    _INTL(\"Step away\")\n  ]\n  ch = pbMessage(_INTL(\"Ward Tap Bench — [3-Flask: {1}/3 | 5-Flask: {2}/5]\", s, b), cmds,\
        \ cmds.length)\n  case ch\n  when 0\n    $game_variables[330] = 3\n    pbSEPlay(\"Anim/Water1\", 80, 105)\n  when 1\n    $game_variables[331] =\
        \ 5\n    pbSEPlay(\"Anim/Water1\", 80, 95)\n  when 2\n    amt = [s, 5 - b].min\n    if amt > 0\n      $game_variables[330] = s - amt\n      $game_variables[331]\
        \ = b + amt\n      pbSEPlay(\"Anim/Water2\", 80, 100)\n    else\n      pbSEPlay(\"GUI sel buzzer\", 75, 100)\n    end\n  when 3\n    amt = [b, 3\
