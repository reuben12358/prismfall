events:
- type: warp
  name: To Windfall Row
  at: [0, 37]
  link: R2_ORCHARD
  arrive: [1, 37, right]
- type: warp
  name: To Windfall Row b
  at: [0, 36]
  to: {map: 521, x: 60, y: 22, dir: left}
- type: warp
  name: To Windfall Row c
  at: [0, 38]
  to: {map: 521, x: 60, y: 23, dir: left}
- type: event
  name: Atmosphere
  at: [0, 0]
  pages:
  - trigger: parallel
    commands:
    - {comment: 'fog: prismfall_glass (see REQUESTS.md item 3)'}
    - raw:
      - 204
      - [1, prismfall_glass, 0, 70, 1, 200, 2, 1]
    - selfswitch: [A, true]
  - cond: {self: A}
- type: event
  name: Orchard arrival
  at: [1, 38]
  pages:
  - cond: {switch: CH1_K1_DONE}
    trigger: autorun
    commands:
    - {script: pfm_juno_part}
    - (Rows of apple trees turned to clear glass. Glass apples chime in the wind. The air at the gate shimmers like heat.)
    - '\pf[JUNO,sad]Juno: There. That was the Pruetts''. It went last winter, in one night.'
    - '\pf[JUNO,neutral]Juno: It''s pretty, isn''t it? I hate that it''s pretty.'
    - {se: Voltorb Flip tile}
    - (A squeak from inside. A Skwovet is clinging to a glass branch.)
    - '\pf[JUNO,panic]Juno: Biscuit! Biscuit, come OUT!'
    - move:
        who: Juno
        route: [right, wait 4]
    - '\pf[JUNO,panic,shock]Juno: Ow— no. No. My skin''s burning. I can''t.'
    - move:
        who: Juno
        route: [left]
    - '\pf[JUNO,sad]Juno: That''s the Veil. Nobody can cross one. You just... can''t. Your body won''t.'
    - (You step forward.)
    - move:
        who: -1
        route: [right, right, right]
    - {wait: 40}
    - '\pf[JUNO,shocked,shock]Juno: ...How are you DOING that?'
    - choices: [I don't know., It doesn't hurt., '...']
      cancel: 3
      branches:
      - []
      - []
      - []
    - '\pf[JUNO,shocked]Juno: Doesn''t it— aren''t you— your HAIR isn''t even standing up!'
    - {script: '$game_self_switches[[522, 0, ''VEIL'']] = true'}
    - selfswitch: [A, true]
  - cond: {self: A}
- type: event
  name: Bleed Veil 1
  at: [4, 35]
  pages:
  - cond: {switch: CH1_K1_DONE}
    trigger: touch
    through: true
    commands:
    - if: $game_self_switches[[522, 0, 'BISCUIT']] && $game_self_switches[[522, 0, 'SWARM']] && !$game_switches[105]
      then: &id001
      - {script: 'ev = $game_map.events.values.find { |e| e.name == ''Professor Larch'' }

          $game_self_switches[[522, ev.id, ''A'']] = true if ev

          $game_map.need_refresh = true'}
      - {wait: 20}
      - (Professor Larch is standing next to Juno with a notebook. She has clearly run the whole way.)
      - '\pf[LARCH,neutral]Larch: So. You walked through a Bleed Veil.'
      - '\pf[LARCH,neutral]Larch: Into a Bleed zone. On your first day. To fetch a Skwovet.'
      - choices: [It was stuck.]
        cancel: 1
        branches:
        - []
      - '\pf[LARCH,angry,anger]Larch: IT LIVES IN A TREE. IT IS ALWAYS STUCK. THAT IS ITS ENTIRE ARRANGEMENT WITH TREES.'
      - '\pf[JUNO,happy]Juno: Technically Skwovet are scansorial, so—'
      - '\pf[LARCH,angry]Larch: Juno.'
      - '\pf[JUNO,panic,sweat]Juno: Shutting up!'
      - '\pf[LARCH,crying]Larch: Your mother wrote me one instruction. One! "Keep them out of trouble, Imelda." It has been NINE HOURS.'
      - '\pf[LARCH,crying]Larch: I''m not crying. It''s the tea. The tea is very strong.'
      - {wait: 30}
      - (Larch looks at the sleeping swarm in the glass trees, then at you.)
      - '\pf[LARCH,neutral]Larch: ...They calmed down. When you went near them.'
      - '\pf[LARCH,neutral]Larch: Well. That''s that, then.'
      - (Larch writes something in the notebook.)
      - '\pf[LARCH,neutral]Larch: Listen to me, both of you. Never take a tinted person past a Veil. Never. It isn''t pain that stops them. It''s the body
        knowing.'
      - '\pf[LARCH,neutral]Larch: And you. This is Lecture One. I''m numbering them. I have a feeling.'
      - if: GameData::Item.exists?(:FIELDNOTES)
        then:
        - {script: 'pbReceiveItem(:FIELDNOTES)'}
        else: ['\me[Key item get]You received the FIELD NOTES!\nProfessor Larch''s field encyclopedia. It fills in as you meet new fields.']
      - switch: [CH1_ORCHARD_DONE, true]
      - {script: 'pf_bond_add(:JUNO, 1)'}
      - {script: 'pfm_juno_join(:errand)'}
      - 'QUEST: "Biscuit" - bring Biscuit home to Wenna at Hale''s Bramble.'
      else:
      - if: $game_self_switches[[522, 0, 'VEIL']] && !$game_self_switches[[522, 0, 'VEILMSG']]
        then:
        - (The shimmer slides over you like warm water. Nothing else happens.)
        - {script: '$game_self_switches[[522, 0, ''VEILMSG'']] = true'}
        else: []
  - cond: {switch: CH1_ORCHARD_DONE}
    through: true
- type: event
  name: Bleed Veil 2
  at: [4, 36]
  pages:
  - cond: {switch: CH1_K1_DONE}
    trigger: touch
    through: true
    commands:
    - if: $game_self_switches[[522, 0, 'BISCUIT']] && $game_self_switches[[522, 0, 'SWARM']] && !$game_switches[105]
      then: *id001
      else:
      - if: $game_self_switches[[522, 0, 'VEIL']] && !$game_self_switches[[522, 0, 'VEILMSG']]
        then:
        - (The shimmer slides over you like warm water. Nothing else happens.)
        - {script: '$game_self_switches[[522, 0, ''VEILMSG'']] = true'}
        else: []
  - cond: {switch: CH1_ORCHARD_DONE}
    through: true
- type: event
  name: Bleed Veil 3
  at: [4, 37]
  pages:
  - cond: {switch: CH1_K1_DONE}
    trigger: touch
    through: true
    commands:
    - if: $game_self_switches[[522, 0, 'BISCUIT']] && $game_self_switches[[522, 0, 'SWARM']] && !$game_switches[105]
      then: *id001
      else:
      - if: $game_self_switches[[522, 0, 'VEIL']] && !$game_self_switches[[522, 0, 'VEILMSG']]
        then:
        - (The shimmer slides over you like warm water. Nothing else happens.)
        - {script: '$game_self_switches[[522, 0, ''VEILMSG'']] = true'}
        else: []
  - cond: {switch: CH1_ORCHARD_DONE}
    through: true
- type: event
  name: Juno
  at: [2, 35]
  pages:
  - cond: {switch: CH1_K1_DONE}
    graphic: {sprite: trainer_RIVAL2, dir: right}
    commands:
    - if: $game_self_switches[[522, 0, 'VEIL']] && $game_player.x >= 4
      then:
      - '\pf[JUNO,neutral]Juno: Can you pull me through? Just for a second? I only want to grab him.'
      - choices: [No. Stay there., Take her hand.]
        cancel: 1
        branches:
        - ['\pf[JUNO,sad]Juno: ...Right. Yes. The Professor did say never. Sorry. Go on, I''ll shout directions.']
        - - {script: Prismfall.checkpoint(false)}
          - '\pf[JUNO,happy]Juno: On three. One, two—'
          - {se: Ice 1}
          - (Glass rings. Juno goes clear from the fingertips up.)
          - {wait: 60}
          - '\pf[JUNO,shocked]Juno: \PN, I can''t feel my—'
          - {script: 'Prismfall.game_over(:GO_ORCHARD)'}
      else: ['\pf[JUNO,sad]Juno: Biscuit''s in there somewhere. Past the farmhand. Please be careful.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: trainer_RIVAL2, dir: right}
    commands: ['\pf[JUNO,happy]Juno: You walked through the Bleed like it was fog. Nobody does that. NOBODY.']
  - cond:
      var: [STORY_CHAPTER, 2]
- type: event
  name: Professor Larch
  at: [2, 38]
  pages:
  - cond: {switch: CH1_K1_DONE}
    commands: []
  - cond: {self: A}
    graphic: {sprite: trainer_PROFESSOR, dir: right}
    commands: ['\pf[LARCH,neutral]Larch: Lecture One stands. Out. Now. Home.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: trainer_PROFESSOR, dir: right}
    commands: ['\pf[LARCH,neutral]Larch: Field safety, rule one, underlined three times. I''ll be at the station writing it four times.']
- type: event
  name: Glass farmhand
  at: [27, 13]
  pages:
  - graphic: {sprite: NPC 03, dir: down}
    move: fixed
    commands:
    - A man made of glass, mid-step, a glass basket on his arm. His mouth is open. He was calling someone.
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: NPC 03, dir: down}
    move: fixed
    commands: ['Inside the glass, very faintly, his eyes are moving.']
- type: event
  name: Glass apple
  at: [38, 24]
  pages:
  - graphic: {sprite: Object ball, dir: down}
    commands:
    - if: GameData::Item.exists?(:GLASSAPPLE)
      then:
      - {script: 'pbReceiveItem(:GLASSAPPLE)'}
      else:
      - You found a GLASS APPLE.\nIt rings when you flick it. Don't bite it.
      - {script: $player.money += 500}
      - '(You sell it to yourself for ₽500. [item data missing: GLASSAPPLE])'
    - selfswitch: [A, true]
  - cond: {self: A}
- type: event
  name: Glassed Wurmple
  at: [24, 18]
  pages:
  - cond: {switch: CH1_K1_DONE}
    graphic: {sprite: Followers/WURMPLE, dir: down}
    move: fixed
    commands:
    - It hisses. Its body grinds like a jar of marbles.
    - {script: 'setBattleRule("field", :BLEED)

        setBattleRule("canLose")

        WildBattle.start(:WURMPLE, 6)'}
    - 'FIELD NOTES: THE BLEED - unstable. Borrows effects from other fields. Do not trust the ground.'
    - The Wurmple stops grinding. It looks at you. Then it curls up against your shoe and goes to sleep.
    - The rest of the swarm settles in the branches, one by one.
    - {script: '$game_self_switches[[522, 0, ''SWARM'']] = true'}
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: Followers/WURMPLE, dir: down}
    move: fixed
    through: true
    commands: ['It''s asleep. Its crystal hums, very quietly, in time with your breathing.']
- type: event
  name: Wild Carbink
  at: [38, 6]
  pages:
  - graphic: {sprite: Followers/CARBINK, dir: left}
    commands:
    - if: pfm_gym_won?(:LEADER_TAMSIN)
      then:
      - It is licking a glass tree. It seems very happy about the whole situation.
      - {script: 'setBattleRule("field", :BLEED)

          WildBattle.start(:CARBINK, 20)'}
      - selfswitch: [A, true]
      else: ['It licks a glass tree, sees you, and phases into the glass.']
  - cond: {self: A}
- type: event
  name: Lost Skwovet
  at: [11, 13]
  pages:
  - cond: {switch: CH1_K1_DONE}
    graphic: {sprite: Followers/SKWOVET, dir: down}
    move: random
    commands:
    - Biscuit has stuffed his cheeks with glass apple seeds. He rattles when he moves.
    - He climbs onto your head. This is apparently how this works.
    - {script: '$game_self_switches[[522, 0, ''BISCUIT'']] = true'}
    - selfswitch: [A, true]
  - cond: {self: A}
- type: sign
  at: [30, 8]
  post: false
  name: Pruett house
  text: The Pruett house. The door is glass, and so is the key in it. A child's coat hangs on the peg inside, perfectly clear.
