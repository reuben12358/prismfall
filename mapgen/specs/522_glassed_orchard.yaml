events:
  - {type: warp, name: To Route 2, at: [5, 25], link: R2_ORCHARD, arrive: [5, 24, up]}
  - &veil
    type: event
    name: Bleed Veil
    at: [4, 20]
    pages:
      - cond: {var: [STORY, 5]}
        trigger: touch
        commands:
          - "The air ahead shimmers like heat over glass. The Bleed Veil."
          - "Juno: Wait - my skin's burning. I can't... how are you doing that?"
          - "Juno: Can you pull me through? Just for a second?"
          - choices: ["No. Wait here.", "Take her hand"]
            cancel: 1
            branches:
              - ["Juno: ...Right. Right. Larch said never. I'll wait. Be careful!"]
              - - {script: "Prismfall.checkpoint(false)"}
                - "You take Juno's hand and step through. Her fingers go cold. Then hard. Then they chime."
                - {script: "Prismfall.game_over(:GO_BLEED_TIDE)"}
          - {selfswitch: [A, true]}
      - cond: {self: A}
  - {<<: *veil, name: Bleed Veil 2, at: [5, 20]}
  - {<<: *veil, name: Bleed Veil 3, at: [6, 20]}
  - {<<: *veil, name: Bleed Veil 4, at: [7, 20]}
  - type: event
    name: Juno
    at: [3, 22]
    pages:
      - cond: {var: [STORY, 5]}
        graphic: {sprite: trainer_RIVAL2, dir: up}
        commands: ["Juno: I'll be right here. Right at the edge. Shout if anything glows at you."]
      - cond: {var: [STORY, 6]}
        graphic: {sprite: trainer_RIVAL2, dir: up}
        commands: ["Juno: You walked through the Bleed like it was fog. Nobody does that. NOBODY."]
  - type: event
    name: Glassed Wurmple
    at: [16, 10]
    pages:
      - cond: {var: [STORY, 5]}
        graphic: {sprite: Pokemon 03, dir: down}
        commands:
          - "A Wurmple swarm leader thrashes in the glass grass, its skin half-crystal, ringing like a bell."
          - "You step closer. It stops. It... calms."
          - "The glassy ringing fades to a hum, then to nothing."
          - {story: 6}
          - {selfswitch: [A, true]}
      - cond: {self: A}
  - type: event
    name: Glass farmhand
    at: [15, 7]
    pages:
      - graphic: {sprite: NPC 03, dir: down}
        commands: ["A farmhand, fixed mid-step. Glass to the shoulders. His hat is still straw."]
  - type: event
    name: Lost Skwovet
    at: [22, 7]
    pages:
      - commands:
          - "A satchel, crusted with glass... something inside squeaks. It's the Hales' lost Skwovet!"
          - "You tuck it under your arm. The Hales will be glad."
          - {selfswitch: [A, true]}
      - cond: {self: A}
  - type: event
    name: Wild Carbink
    at: [16, 15]
    pages:
      - graphic: {sprite: Object rock}
        commands:
          - "A crystal cluster... it moves!"
          - {script: "WildBattle.start(:CARBINK, 8)"}
          - {selfswitch: [A, true]}
      - cond: {self: A}
  - type: event
    name: Professor Larch
    at: [7, 22]
    pages:
      - cond: {var: [STORY, 6]}
        graphic: {sprite: trainer_PROFESSOR, dir: up}
        commands:
          - "Professor Larch writes something in her notebook. Very quietly:"
          - "Professor Larch: Well. That's that, then."
          - "A new Field Notes entry was recorded: the Bleed."
