    commands:
    - {script: "defs = [[\"J\",1,[\"J_L\",\"J_R\"]],[\"A1\",0,[\"A1_L\",\"A1_R\"]],[\"A2\",3,[\"A2_L\",\"A2_R\"]],[\"A3\",1,[\"A3_L\",\"A3_R\"]],[\"A4\",2,[\"A4_L\"\
        ,\"A4_R\"]],[\"B1\",2,[\"B1_L\",\"B1_R\"]],[\"B2\",0,[\"B2_L\",\"B2_R\"]],[\"B3\",3,[\"B3_L\",\"B3_R\"]],[\"B4\",1,[\"B4_L\",\"B4_R\"]]]\nvals = {}\ndefs.each\
        \ { |pid, s0, evs| vals[pid] = (s0 + pfp_state_of(evs[0])) % 4 }\nh292 = vals.values.count(3)\n$game_variables[347] = h292\n$game_variables[345] = $game_variables[346].to_i\
        \ + h292\nstage = [1 + $game_variables[345], 5].min\ncmds = [_INTL(\"Check beds & Arena stage\"), _INTL(\"Ask for a hint\"), _INTL(\"Reset Figure-Eight beds\"\
        )]\ncmds.push(_INTL(\"Skip room (Puzzle Skip)\")) if $game_switches[301]\ncmds.push(_INTL(\"Never mind\"))\nch = pbMessage(_INTL(\"Bram: She's my cousin.\
        \ She used to make me be the bee in games. I'm still the bee. | Hedges here: {1}, Total: {2} (Arena Stage {3}/5)\", h292, $game_variables[345], stage), cmds,\
        \ cmds.length)\ncase ch\nwhen 0\n  pbMessage(_INTL(\"Bram: J={1} | Ring A: A1={2}, A2={3}, A3={4}, A4={5} | Ring B: B1={6}, B2={7}, B3={8}, B4={9}.\", vals[\"\
        J\"], vals[\"A1\"], vals[\"A2\"], vals[\"A3\"], vals[\"A4\"], vals[\"B1\"], vals[\"B2\"], vals[\"B3\"], vals[\"B4\"]))\n  pbMessage(_INTL(\"Bram: Crossings\
        \ needed: A2, A3, J, B2, B3 = Stage 2. Leave hedges if you want fewer waterings, or prune clean to keep Juno's arena calm!\"))\nwhen 1\n  tier = $game_variables[349].to_i\n\
        \  if tier == 0\n    pbMessage(_INTL(\"Bram (Hint 1/3): Junction J feeds FOUR neighbours (A1, A4, B1, B4). Decide J's waterings first, then balance Ring A\
        \ and Ring B!\"))\n    $game_variables[349] = 1\n  elsif tier == 1\n    pbMessage(_INTL(\"Bram (Hint 2/3): You can solve this in 7 waterings (leaving 2 hedges\
        \ on A4 & B1) — OR spend just ONE extra watering (8 total) for ZERO hedges!\"))\n    $game_variables[349] = 2\n  else\n    pbMessage(_INTL(\"Bram (Hint 3/3):\
        \ From a fresh reset — FAST (7w, 2 hedges): A1 x2, A3 x1, B1 x1, B3 x1, B4 x2. CLEAN (8w, 0 hedges): J x2, A1 x2, A3 x1, B3 x2, B4 x1!\"))\n  end\nwhen 2\n\
        \  on_plot = defs.any? { |_, _, evs| evs.any? { |en| (e = pfp_ev(en)) && e.x == $game_player.x && e.y == $game_player.y } }\n  if on_plot\n    pbMessage(_INTL(\"\
        Bram: Step onto dry stone before I prune the beds!\"))\n  elsif pbConfirmMessage(_INTL(\"Bram: Reset all nine Figure-Eight beds back to their starting growth?\"\
        ))\n    defs.each { |_, _, evs| evs.each { |en| pfp_state(en, 0) } }\n    $game_variables[347] = 2\n    $game_variables[345] = $game_variables[346].to_i +\
        \ 2\n    $game_switches[346] = false\n    $game_map.need_refresh = true\n    pbSEPlay(\"Anim/Water2\", 80, 100)\n    pbMessage(_INTL(\"Bram: Pruned back to\
        \ start! J=1; A=[0,3,1,2]; B=[2,0,3,1].\"))\n  end\nwhen 3\n  if $game_switches[301]\n    clean = {\"J\"=>2,\"A1\"=>0,\"A2\"=>2,\"A3\"=>2,\"A4\"=>1,\"B1\"\
        =>0,\"B2\"=>2,\"B3\"=>2,\"B4\"=>2}\n    defs.each do |pid, s0, evs|\n      k = (clean[pid] - s0) % 4\n      evs.each { |en| pfp_state(en, k) }\n    end\n\
        \    $game_variables[347] = 0\n    $game_variables[345] = $game_variables[346].to_i\n    $game_switches[346] = true\n    $game_map.need_refresh = true\n \
        \   pbSEPlay(\"Anim/HealBell\", 90, 100)\n    pbMessage(_INTL(\"Bram: Puzzle Skip active! All five Figure-Eight bridges are woven cleanly with zero hedges.\"\
        ))\n  end\nend"}
