        M3\", 1, [\"M3_C\"]],\n  [\"M4\", 3, [\"M4_C\"]],\n  [\"M5\", 1, [\"M5_C\"]]\n]\ntargets = [\"M5\", \"M4\"]\non_plot = plots.any? do |pid, _, evs|\n  targets.include?(pid)\
        \ && evs.any? { |en| (e = pfp_ev(en)) && e.x == $game_player.x && e.y == $game_player.y }\nend\nif on_plot\n  pbMessage(_INTL(\"Step off the vine bridge onto\
        \ dry stone before watering!\"))\nelse\n  cur_st = nil\n  plots.each do |pid, s0, evs|\n    cur_st = (s0 + pfp_state_of(evs[0])) % 4 if pid == \"M5\"\n  end\n\
        \  msg = _INTL(\"Bride Bower M5 — Stage {1} ({2}). Neighbours: M4. Water it?\", cur_st, st_names[cur_st])\n  if pbConfirmMessage(msg)\n    pbSEPlay(\"Anim/Water1\"\
        , 80, 105)\n    cur = {}\n    plots.each do |pid, s0, evs|\n      k = pfp_state_of(evs[0])\n      if targets.include?(pid)\n        k = (k + 1) % 4\n    \
        \    evs.each { |en| pfp_state(en, k) }\n      end\n      cur[pid] = (s0 + k) % 4\n    end\n  ok = (cur[\"M1\"] == 2 && cur[\"M2\"] == 3 && cur[\"M3\"] ==\
