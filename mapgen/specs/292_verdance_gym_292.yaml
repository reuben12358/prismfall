        \ — Bridge! The Bride Bower's alternating arch blooms in perfect cadence! The heirloom coffer clicks open!\"))\n  else\n    pbMessage(_INTL(\"{1} grew to\
        \ {2}! (Bower beds: {3})\", \"Bride Bower M5\", st_names[cur[\"M5\"]], [\"M1\",\"M2\",\"M3\",\"M4\",\"M5\"].map { |k| cur[k] }.join(\"-\")))\n  end\n  end\n\
        end"}
