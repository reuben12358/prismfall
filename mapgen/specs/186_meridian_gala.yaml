- type: event
  name: Voss
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - '\pf[VOSS,happy]Voss: \PN. You came. I hoped you would. How are you finding the place? Honestly. Everyone tells me "wonderful" and I can never tell
      if they mean it.'
    - choices: [It's wonderful., It's very bright., '...']
      branches:
      - ['\pf[VOSS,happy]Voss: You mean it. Good. I can tell, with you. I don''t know why.']
      - ['\pf[VOSS,neutral]Voss: It is. Too bright, my mother used to say. She grew up downstairs. She said up here we''ve forgotten what the dark is for.']
      - ['\pf[VOSS,neutral]Voss: The quiet ones always see the most. Keep doing that.']
      cancel: 3
    - '\pf[VOSS,neutral]Voss: How''s the badge case holding up? We had complaints about the hinges on that batch.'
    - choices: [It's fine., It sings.]
      branches:
      - ['\pf[VOSS,happy]Voss: Good. Good. Tell me if it ever does anything odd.']
      - ['\pf[VOSS,neutral]Voss: ...Does it.', 'Voss: The brass does that, in the cold. Isenmar, wasn''t it? Lovely country. Terrible for brass.']
      cancel: 1
    - '\pf[VOSS,neutral]Voss: I have to go and make a speech. I hate making speeches. I''m very good at it, which is worse.'
