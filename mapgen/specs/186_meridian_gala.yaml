- type: event
  name: Replica
  pages:
  - commands: ['A golden Plate behind glass, turning. "THE ZAP PLATE (REPLICA)."']
    trigger: action
    move: fixed
    graphic: {sprite: '', dir: down, tile: 25945}
  - commands:
    - 'REPLICA: A golden Plate behind glass, turning. "THE ZAP PLATE (REPLICA). The original is kept safe by Meridian Concord."'
    - '\pf[LARCH,neutral]Larch: That''s a copy.'
    - 'Larch: The real one isn''t in Rook''s gym. You saw the cradle. It''s here. Under our feet. In their vault.'
    - 'Larch: It''s been there seven years. Every lamp in this city drinks straight off it.'
    - (Behind you, Rook, who has come over with two glasses of something blue, stops. He looks at the replica for a long moment. He doesn't say anything.
      He puts the glasses down on the plinth and walks away.)
    - '\pf[JUNO,sad]Juno: ...Did he know?'
    - '\pf[LARCH,sad]Larch: He knew. Since he was fourteen. That''s why he never stops talking.'
    - (A chime. The quartet stops. Voss steps onto a low dais by the window with the whole lit city behind him, his chipped mug still in his hand. Rook
      stands beside him, smiling for the cameras. Valen stands at the back.)
    - '\pf[VOSS,neutral]Voss: Ten years ago this spring we switched on the first Lattice in Lumen, and the Lowlight saw electric light for the first time
      in its history.'
    - 'Voss: I was a linesman once. I climbed those pylons in the rain. I know exactly what one lamp costs.'
    - '\pf[VOSS,happy]Voss: They''ll tell you light is a gift. Light is work. Every lamp in this city was lit by someone who was told to be grateful for
      the dark.'
    - 'Voss: So I won''t ask you to be grateful tonight. I''ll ask you to look down, just once, at the city you built, and be proud of it.'
    - (Applause. It's real. Juno is clapping. You're clapping. Beside you Larch isn't, and then, after a moment, she is.)
    - '\pf[VOSS,neutral]Voss: To ten years of light. And to the next hundred.'
    - (The lights flicker. Once. Twice. The quartet stops mid-bar.)
    - 'Guest: Is that part of it?'
    - tone: [-40, -40, -40, 120, 20]
    - (The lights go grey. A low hum. The same grey as the stage lights in the Lantern Theatre, in Saltmere.)
    - '\pf[JUNO,shocked]Juno: \PN. That''s the same — that''s the same—'
    - {se: Anim/Explosion1}
    - (The service-lift doors on the east wall bend outward and burst.)
    - (Grey cowls pour out of the shaft. Carved bark masks with sad faces. Hollow Ring banners unroll down the glass. At the front, a woman with weaver's
      shears on her belt.)
    - '\pf[THISTLE,neutral]Thistle: Nobody move. Nobody is going to be hurt. We''re not here for you.'
    - 'Thistle: We''re here for what''s under your feet.'
    - (Screaming. Guests run for the main lift. Directorate guards draw. Voss steps in front of Rook and Calla without thinking about it. Valen doesn't
      move at all.)
    - '\pf[THISTLE,angry]Thistle: You. Briarwick. The one he looked at—'
    - '\pf[JUNO,angry]Juno: (stepping up beside you, shaking, blossoms everywhere) We''re not letting you.'
    - '\pf[THISTLE,sad]Thistle: Girl. You don''t know what you''re standing in front of.'
    - {script: 'setBattleRule("field", :NEON_GRID)'}
    - if: pfm_lumen_tag([:RIVAL_JUNO, "Juno", 13], [:HOLLOW_THISTLE, "Thistle", 1], [:HOLLOW_GRUNT_M, "Pallbearer", 5])
      then:
      - '\pf[THISTLE,shocked]Thistle: ...Twice. Twice, now.'
      - '\pf[THISTLE,neutral]Thistle: It doesn''t matter. We were never the ones who mattered tonight. He''s already down there.'
      - (Directorate guards seize her. She doesn't fight them. As they take her past you she says, very low:)
      - '\pf[THISTLE,sad]Thistle: Ask what''s in the vault. Ask why it''s warm.'
      - '\pf[JUNO,panic]Juno: "He"? Who''s "he"? \PN—'
      - (The service-lift shaft stands open, its cable still swinging. Far below, a grey light.)
      - '\pf[JUNO,neutral]Juno: Go. GO. I''ll hold the lift. I''ll hold — I''ll hold everyone. I''m very good at holding people.'
      - var: [CH5_STEP, 8]
