      - '\pf[JUNO,happy]Juno: Forty eggs! In a hatbox! Don''t knock the hatbox!'
      - '\pf[JUNO,happy]Juno: Go on, I''ll be loud. Quietly. I learned that in Saltmere.'
      - script: $game_self_switches[[131, 0, 'JUNO']] = true
