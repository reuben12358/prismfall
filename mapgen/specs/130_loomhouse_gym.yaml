events:
- type: exit
  at:
  - 8
  - 12
  link: BW_GYM
  se: Door exit
- type: npc
  name: Gym guide
  at:
  - 10
  - 8
  sprite: NPC 01
  dir: left
  commands:
  - 'Gym Guide: Challenger! This is the Loomhouse. Bug-types, and the Silkwood field. Fire and Flying do well. Grass does
    not. I say this to everyone and half of them bring a Bulbasaur.'
  - 'Gym Guide: The puzzle: three looms, three colors of plank. Pull a shuttle and one color extends while another retracts.
    Old Mother Loom built it to teach patience. Tamsin added the safety nets. And the apology cards.'
  - 'The pattern card reads: "Red lifts the warp and the weft. Gold lifts the weft and the woof. Green lifts the woof and
    the warp."'
- type: sign
  at:
  - 4
  - 9
  name: Apology card
  text: 'A card pinned by the trapdoor: "If you have fallen, I''m so sorry. Stairs are to your left. — T.L."'
- type: sign
  at:
  - 12
  - 6
  name: Portrait
  text: 'A fierce old woman at a loom. Brass plate: "Mother Loom, Warden AF 247–299. ''Twist it or lose it.''"'
- type: event
  name: Tamsin
  at:
  - 7
  - 4
  pages:
  - graphic:
      sprite: trainer_LASS
      dir: down
    commands:
    - '\pf[TAMSIN,panic]Tamsin: Sorry — the gym''s a bit tangled today — sorry —'
    - choices:
      - It's fine.
      - Stop apologizing.
      cancel: 1
      branches:
      - - '\pf[TAMSIN,panic,sweat]Tamsin: Sorry for saying sorry so much. That''s annoying. Sorry.'
      - - '\pf[TAMSIN,shocked,shock]Tamsin: Right! Yes! Sorr—'
        - '\pf[TAMSIN,panic]Tamsin: I nearly did it again. I''m so sorry.'
    - '\pf[TAMSIN,sad]Tamsin: ...'
    - '\pf[TAMSIN,deadpan]Tamsin: I''m going to go and stand in the web now.'
    - move:
        who: 0
        route:
        - up
        - up
        - up
        - up
        - up
    - selfswitch:
      - A
      - true
  - cond:
      self: A
- type: event
  name: First loom
  at:
  - 3
  - 5
  pages:
  - commands:
    - if: pfm_quest?(:locked_ledger) && !pfm_has?(:LEDGERKEY)
      then:
      - A small brass key is tied into the very first warp thread.
      - script: pfm_item(:LEDGERKEY, 1, "Ledger Key")
      else:
      - Mother Loom's first loom. The warp is still strung, and the pattern stops mid-row, as if she meant to come back to
        it.
