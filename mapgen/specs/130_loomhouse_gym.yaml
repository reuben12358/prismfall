events:
- type: exit
  at:
  - 8
  - 14
  link: GYM1_SPINDLE
  se: Door exit
- type: event
  name: Tamsin
  at:
  - 7
  - 5
  pages:
  - graphic:
      sprite: trainer_LASS
      dir: down
    commands:
    - if: $game_self_switches[[133, 0, 'TRIED']]
      then:
      - '\pf[TAMSIN,neutral]Tamsin: Again? Good. I mean— sorry. I mean good.'
      else:
      - (Tamsin stands at the great loom at the hall's end. She has stopped fidgeting.)
      - '\pf[TAMSIN,neutral]Tamsin: My grandmother wove this room. Every plank, every web. She held this village together
        for fifty years with thread and shouting.'
      - '\pf[TAMSIN,sad]Tamsin: I''ve had it since spring. I can''t shout.'
      - '\pf[TAMSIN,angry]Tamsin: But I can weave. Granny Loom wove this room. Don''t you dare tear it.'
    - script: $game_self_switches[[133, 0, 'TRIED']] = true
    - if: Prismfall.gym_battle(1)
      then:
      - '\pf[TAMSIN,shocked]Tamsin: ...It held, and you still came through it.'
      - '\pf[TAMSIN,happy]Tamsin: That''s allowed. Granny said the room''s meant to lose to the right person. I didn''t think
        I''d ever meet one.'
      - script: Prismfall.award_badge(1)
      - '(You open the Badge Case and set the badge in. A faint hum: one clear note.)'
      - '\pf[JUNO,happy,question]Juno: Ooh. Is it supposed to do that?'
      - '\pf[TAMSIN,neutral]Tamsin: I don''t think they do that. ...Do they do that?'
      - script: pbReceiveItem(:TM89)
      - '\pf[TAMSIN,neutral]Tamsin: That''s the Accord''s word that you may use Cut, and that Pokémon up to level nineteen
        will heed you.'
      - '\pf[TAMSIN,sad]Tamsin: \PN... could you come up to the loft? There''s something I should say to someone, and you''ve
        an honest sort of silence.'
      - tone:
        - -255
        - -255
        - -255
        - 0
        - 12
      - wait: 14
      - tone:
        - -30
        - -20
        - -10
        - 30
        - 12
      - '(The loft above the Spindle: a ledger open on a table, a contract with a gold sunburst seal. Tamsin won''t sit.)'
      - '\pf[TAMSIN,sad]Tamsin: That masked woman at the pylon. She was right. I signed it.'
      - '\pf[TAMSIN,sad]Tamsin: Briarwick''s bankrupt. It has been for three years. Gran hid it. I found the accounts the
        week I buried her.'
      - '\pf[TAMSIN,sad]Tamsin: Meridian offered four hundred thousand for "stewardship rights". One pylon. Free light. I
        signed it by myself, at night, so nobody would have to know how bad it was.'
      - '\pf[TAMSIN,crying]Tamsin: And now the Glasswood''s walking up the survey line like it was invited. Fourteen moths
        this week. I count them. I count them every morning.'
      - '\pf[TAMSIN,sad]Tamsin: The guild meets tonight. Tell me what to do. Please. I''ve run out of thread.'
      - if: pf_choice(:ch2_tamsin)
        then:
        - (You've already given her your answer.)
        else:
        - choices:
          - Tell them the truth. I'll stand next to you.
          - They deserve to know. If you won't say it, I will.
          - It's your secret. I won't tell.
          cancel: 0
          branches:
          - - script: pf_choose(:ch2_tamsin, :help_confess)
            - '\pf[TAMSIN,shocked]Tamsin: Next to me. Not in front?'
            - '\pf[TAMSIN,neutral]Tamsin: ...A thread holds because it''s twisted with others. I''ve had that on the SIGN.'
            - '(That night, at the guild meeting, Tamsin speaks. Her voice cracks twice. Hett stands up first: "Then we sign
              it WITH you, girl, and then we tear it up together." The contract is renegotiated: a smaller pylon, off the
              grove.)'
          - - script: pf_choose(:ch2_tamsin, :expose)
            - '\pf[TAMSIN,panic]Tamsin: No— wait— not like—'
            - (At the guild meeting you lay the contract on the table. Uproar. The looms stop. Tamsin stands very still, then
              tears the contract in half herself, in front of them.)
            - '\pf[TAMSIN,sad]Tamsin: I''m sorry. I''m so sorry. That''s the last time I''ll say it tonight.'
          - - script: pf_choose(:ch2_tamsin, :keep_secret)
            - '\pf[TAMSIN,sad]Tamsin: ...Thank you. I think. I''ll fix it quietly. I''ll find the money somewhere.'
            - (No meeting. Within the week, the pylon is finished.)
      - '\pf[TAMSIN,neutral]Tamsin: Whatever''s making the wood ring, it''s in Cocoonfall Hollow, at the Glasswood''s heart.
        I can''t cross the Veil. Nobody can.'
      - '\pf[JUNO,neutral,dots]Juno: (from the stairs) ...They can.'
      - '\pf[TAMSIN,shocked,shock]Tamsin: What?'
      - '\pf[TAMSIN,neutral]Tamsin: Then take this. It was Gran''s shuttle. It''s only wood. But she never dropped a thread
        while she held it.'
      - if: GameData::Item.exists?(:MOTHERLOOMSSHUTTLE)
        then:
        - script: pbReceiveItem(:MOTHERLOOMSSHUTTLE)
        else:
        - \me[Key item get]You received MOTHER LOOM'S SHUTTLE!\nWorn smooth by fifty years of one hand.
      - 'QUEST: "The Ringing Wood" - Cut through the Deepwood to Cocoonfall Hollow.'
      - tone:
        - 0
        - 0
        - 0
        - 0
        - 20
      - selfswitch:
        - A
        - true
  - cond:
      self: A
    graphic:
      sprite: trainer_LASS
      dir: down
    commands:
    - '\pf[TAMSIN,neutral]Tamsin: The Cutter in town owes me a favour. Tell him I sent you. And— thank you. Not sorry. Thank
      you.'
- type: event
  name: Reveal helper
  at:
  - 0
  - 0
  pages:
  - trigger: parallel
    commands:
    - if: $game_self_switches[[131, 0, 'JUNO']]
      then:
      - script: "%w[Juno].each do |n|\n  ev = $game_map.events.values.find { |e| e.name == n }\n  $game_self_switches[[$game_map.map_id,\
          \ ev.id, 'A']] = true if ev\nend\n$game_map.need_refresh = true"
      else: []
    - selfswitch:
      - A
      - true
  - cond:
      self: A
- type: event
  name: Juno
  at:
  - 10
  - 9
  pages:
  - commands: []
  - cond:
      self: A
    graphic:
      sprite: trainer_RIVAL2
      dir: left
    commands:
    - '\pf[JUNO,happy]Juno: I''m being SO quiet. Look at me. Quiet.'
