      dir: up
    commands:
    - if: $game_self_switches[[131, 0, 'JUNO']]
      then:
      - '\pf[JUNO,happy]Juno: Go on! I''m being loud! In my head!'
      else:
      - (Juno is at the hall's entrance, eating a honey-silk bun.)
      - '\pf[JUNO,happy]Juno: I made it! Go on! I''ll be loud!'
      - script: $game_self_switches[[131, 0, 'JUNO']] = true
