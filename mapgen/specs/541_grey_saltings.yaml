- type: event
  name: The Saltings
  at: [33, 99]
  pages:
  - trigger: touch
    commands:
    - Salt pans run to the horizon between white stacks and the smoke of the boiling-house. Behind them stands a chalk cliff with a mine mouth in it.
    - '\pf[JUNO,neutral]Juno: This is where Saltmere''s salt comes from. "Grey" is the salt before it''s washed.'
    - '\pf[JUNO,neutral]Juno: ...And the weather. It''s mostly the weather.'
