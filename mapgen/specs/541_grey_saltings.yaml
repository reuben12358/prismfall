  at: [24, 46]
  sight: 4
  dir: right
  sprite: trainer_SAILOR
  trainer: [SAILOR, Morrow]
  intro: Salt barge went down in the mud in '88. Still there. Still salty.
  after: You're heavier than you look. In battle, I mean.
- type: trainer
  at: [40, 59]
  sight: 4
  dir: left
  sprite: trainer_TUBER_F
  trainer: [TUBER_F, Pip]
  intro: My floaty is a Wailmer! No it's not. It's a floaty.
  after: Waaah! My floaty popped!
- type: trainer
  at: [36, 30]
  sight: 4
  dir: down
  sprite: trainer_CAMPER
  trainer: [CAMPER, Ned]
  intro: Sand in my tent! Sand in my boots! Sand in my battle!
  after: Sand in my tent AND I lost. Great day.
