- type: event
  name: Ring Boss
  at: [45, 101]
  pages:
  - graphic: {sprite: NPC 21, dir: down}
    trigger: action
    commands:
    - if: pfm?(:crab_ring)
      then: ['Ring Boss: Champion of the mudflat! The bucket''s yours. The glory''s mine.']
      else:
      - 'Ring Boss: Crabrawler ring! Three bouts, no biting, best of three, winner gets the bucket!'
      - choices: [Step into the ring., Not now.]
        cancel: 2
        branches:
        - - {script: 'WildBattle.start(:CRABRAWLER, 15)'}
          - {script: 'WildBattle.start(:CRABRAWLER, 15)'}
          - {script: 'WildBattle.start(:CRABRAWLER, 16)'}
          - 'Ring Boss: Champion! Here''s the bucket.'
          - (It contains a KING'S ROCK.)
          - {script: 'pbReceiveItem(:KINGSROCK)'}
          - {script: 'pfm_set(:crab_ring)'}
        - ['Ring Boss: The ring is always open. The ring never closes. The tide closes it, twice a day.']
