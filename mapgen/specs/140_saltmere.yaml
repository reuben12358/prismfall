- type: event
  name: Arrival (East Gate)
  pages:
  - trigger: autorun
    cond: {}
    commands:
    - if: '!pfm?(:sm_arrived) && $game_player.x >= 80'
      then:
      - {se: Horse}
      - (Lamplit promenades along a white salt lake, striped awnings, salt-caramel smoke. A long green barge flying Elowen's briar crown rows across the
        lake toward the harbour mouth.)
      - {se: Applause}
      - 'The Breakwater: BOOOOOOOOOOOO.'
      - (The green barge turns, slowly, and rows away.)
      - '\pf[JUNO,deadpan]Juno: That''s the Queen''s tax-barge. They do that every week. It''s tradition. The barge comes, everyone boos, the barge goes.'
      - '\pf[JUNO,neutral]Juno: Mum says it''s the only time in history a tax has been defeated by noise.'
      - '\pf[JUNO,happy]Juno: I''m taking the tarts to the Lantern Theatre! Find me on the green after. Don''t go into the gym without me! I need to be
        AUDIENCE!'
      - {script: 'pfm_set(:sm_arrived)'}
      - selfswitch: [A, true]
      else:
      - selfswitch: [A, true]
