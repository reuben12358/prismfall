- type: event
  name: Juno J1
  pages:
  - commands: []
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: trainer_RIVAL2, dir: down}
    trigger: action
    commands:
    - if: pfm?(:sm_arrived)
      then:
      - (Juno is on the promenade green beside the planters, practising a victory pose with an empty tart basket.)
      - '\pf[JUNO,happy]Juno: There you are! Tarts delivered! Forty! I ate one. Thirty-nine!'
      - '\pf[JUNO,neutral]Juno: Before you go in there... fight me?'
      - '\pf[JUNO,happy]Juno: Not a FIGHT fight. A spar. I want to know if I''m any good before you go off and get good without me.'
      - '\pf[JUNO,neutral]Juno: And I want to know if YOU are. I''m going to be in the audience. I''d like to know what I''m cheering for.'
      - choices: [Let's go., 'Are you sure?']
        cancel: 0
        branches:
        - - &id001
            if: 'Prismfall.rival_battle(:RIVAL_JUNO, "Juno", 1, can_lose: true)'
            then: ['\pf[JUNO,happy]Juno: You''re good. You''re REALLY good. That''s so annoying. I''m so happy.']
            else: ['\pf[JUNO,surprised,shock]Juno: I WON? ...Did you let me win? Don''t tell me. I''m keeping it.']
          - '\pf[JUNO,happy]Juno: Here, for your partner. They''re from the farm.'
          - &id002 {script: 'pbReceiveItem(:ORANBERRY, 2)'}
          - '\pf[JUNO,happy]Juno: Go on, then. The Playhouse is in the Old Town. I''ll be in the cheap seats. I''ll be LOUD.'
          - &id003
            switch: [CH3_J1_DONE, true]
        - - '\pf[JUNO,deadpan]Juno: My partner''s weak to yours and I chose it on purpose. I''ve never been less sure of anything. Let''s go!'
          - *id001
          - '\pf[JUNO,happy]Juno: Here, for your partner. They''re from the farm.'
          - *id002
          - '\pf[JUNO,happy]Juno: Go on, then. The Playhouse is in the Old Town. I''ll be in the cheap seats. I''ll be LOUD.'
          - *id003
      else: ['\pf[JUNO,happy]Juno: Tarts first! Then the green! Then the GYM!']
  - cond: {switch: CH3_J1_DONE}
    commands: []
  at: [37, 53]
- type: event
  name: Royal notice
  pages:
  - commands: []
  - cond: {switch: CH3_PAGEANT_DONE}
    trigger: action
    commands:
    - if: pfm?(:ch2_closed)
      then: []
      else:
      - (Next morning. A herald in Elowen green is pasting a notice to the charter stone. A small crowd watches without booing, which in Saltmere is a kind
        of booing.)
      - 'NOTICE: "HER MAJESTY QUEEN MAELIS notes with grief the Hollow outrage in HER free port of Saltmere, where the Crown''s protection was refused.
        The Crown''s protection remains available. -- By Order, Briar Keep."'
      - (Dorian walks up, reads it, and tears it down in one long rip.)
      - '\pf[DORIAN,angry,anger]Dorian: "HER" free port.'
      - '\pf[DORIAN,neutral]Dorian: Somebody fetch the paste. We''ll put the charter back up where it belongs.'
      - '\pf[DORIAN,smug]Dorian: And tell the breakwater to warm up. It''s booing day on a Thursday this week.'
      - '\pf[JUNO,neutral]Juno: Uncle Rowan wants silk-moth eggs from Briarwick. Forty. I was going to send for them.'
      - '\pf[JUNO,neutral]Juno: I''m not sending for them. I''m not letting you walk into the Gossamer by yourself after last night.'
      - '\pf[JUNO,happy]Juno: Also I''ve never seen a gym puzzle from the INSIDE.'
      - {script: 'pfm_quest(:eighteen_roads, "Eighteen Roads", "Earn the second badge in Briarwick, up the Weavers'' Road.")'}
      - var: [STORY_CHAPTER, 3]
      - {script: 'pfm_set(:ch2_closed)'}
      - selfswitch: [A, true]
  - cond: {self: A}
    trigger: action
    commands: ['The charter is back up on the stone. Someone has pasted it on twice, for emphasis.']
  at: [47, 41]
- type: event
  name: Kestrel
  pages:
  - commands: []
  - cond: {switch: CH3_PAGEANT_DONE}
    graphic: {sprite: trainer_RIVAL1, dir: left}
    trigger: action
    commands:
    - (The crowd is thinning. Against the wall by the stage door, a boy in a too-big black coat is breathing very fast.)
    - '\pf[KESTREL,surprised]Kestrel: You were in there. You heard him.'
    - '\pf[KESTREL,angry,anger]Kestrel: Did you hear his VOICE?'
    - choices: [I heard him., 'Kestrel? What are you doing here?', '...']
      cancel: 2
      branches:
      - []
      - ['\pf[KESTREL,angry]Kestrel: Following a rumor. Shut up. That''s not the point.']
      - []
    - '\pf[KESTREL,neutral]Kestrel: Under the doubling. Under the second voice. The way he said "grieve". Like it had two syllables.'
    - '\pf[KESTREL,surprised]Kestrel: That''s -- the way she talks -- no.'
    - '\pf[KESTREL,angry]Kestrel: No.'
    - (Kestrel runs, shoving through the crowd, north toward the North Gate.)
    - '\pf[JUNO,sad]Juno: ...Who talks like that?'
    - var: [KESTREL_STAGE, 1]
    - selfswitch: [A, true]
  - cond: {self: A}
    commands: []
