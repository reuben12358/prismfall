- type: event
  name: Juno J1
  at: [37, 53]
  pages:
  - cond: {switch: CH2_MATRIARCH_DONE}
    graphic: {sprite: trainer_RIVAL2, dir: down}
    commands:
    - 'Juno: There you are! I came down by cart with Dad''s seed-sacks. Spar with me? Just for fun!'
    - if: 'Prismfall.rival_battle(:RIVAL_JUNO, "Juno", 1, can_lose: true)'
      then: ['Juno: Ha! You''re getting scary-good.']
      else: ['Juno: I won? I WON! ...Sorry. Again tomorrow?']
    - {heal: true}
    - You sit on the breakwater with Juno, sharing a paper bag of salt-caramel.
    - 'Juno: Can I ask? At the orchard. The Veil. How did you do that?'
    - choices: [Tell her about the NULL scan, Deflect, Say nothing]
      cancel: 0
      branches:
      - - {script: 'pf_choose(:ch3_juno_talk, :told)'}
        - 'Juno: NULL? ...Okay. That stays between us. Pinkie swear. I mean it.'
      - - {script: 'pf_choose(:ch3_juno_talk, :deflect)'}
        - 'Juno: Fine, keep your secrets. More caramel for me.'
      - - {script: 'pf_choose(:ch3_juno_talk, :silent)'}
        - 'Juno: ...That''s okay. You don''t have to.'
    - switch: [CH3_J1_DONE, true]
  - cond: {switch: CH3_J1_DONE}
    graphic: {sprite: trainer_RIVAL2, dir: down}
    commands: ['Juno: Same breakwater, same caramel, next time. Deal?']
- type: event
  name: Royal notice
  at: [47, 41]
  pages:
  - cond: {switch: CH3_PAGEANT_DONE}
    commands: ['A royal notice: Queen Maelis "notes with grief" the Hollow outrage in her free port, "where the Crown''s protection was refused."', 'Someone
        - Dorian, by the velvet thread - has torn it half down.']
- type: event
  name: Kestrel
  at: [36, 27]
  pages:
  - cond: {switch: CH3_PAGEANT_DONE}
    graphic: {sprite: trainer_RIVAL1, dir: left}
    commands:
    - Kestrel is outside the Hall, white-faced.
    - 'Kestrel: That voice. The way she talks... no. NO.'
    - He runs.
    - selfswitch: [A, true]
  - cond: {self: A}
- type: npc
  name: Eevee breeder
  at: [58, 38]
  sprite: NPC 25
  dir: down
  text: 'Breeder: Dorian''s troupe raised an Eevee for forty auditions. Never cast. Win your badge and maybe it finds its stage.'
- type: event
  name: Gate Warden
  pages:
  - graphic: {sprite: trainer_GENTLEMAN, dir: down}
    commands: ['Gate Warden: The North Gate is shut while the Pageant runs. Accord orders: nobody leaves with a full purse or an empty seat.', 'Gate Warden:
        Come back when the curtain''s down. The Saltings road isn''t going anywhere. It never does.']
  - cond: {switch: CH3_PAGEANT_DONE}
    graphic: {sprite: trainer_GENTLEMAN, dir: left}
    commands: ['Gate Warden: The gate''s open. After last night... mind the Grey Saltings. And mind who you talk to.']
  at: [46, 9]
- type: event
  name: Arrival (East Gate)
  pages:
  - trigger: autorun
    cond: {}
    commands:
    - if: '!pfm?(:sm_arrived) && $game_player.x >= 80'
      then:
      - {se: Horse}
      - (Lamplit promenades along a white salt lake, striped awnings, salt-caramel smoke. A long green barge flying Elowen's briar crown rows across the
        lake toward the harbour mouth.)
      - {se: Applause}
      - 'The Breakwater: BOOOOOOOOOOOO.'
      - (The green barge turns, slowly, and rows away.)
      - '\pf[JUNO,deadpan]Juno: That''s the Queen''s tax-barge. They do that every week. It''s tradition. The barge comes, everyone boos, the barge goes.'
      - '\pf[JUNO,neutral]Juno: Mum says it''s the only time in history a tax has been defeated by noise.'
      - '\pf[JUNO,happy]Juno: I''m taking the tarts to the Lantern Theatre! Find me on the green after. Don''t go into the gym without me! I need to be
        AUDIENCE!'
      - {script: 'pfm_set(:sm_arrived)'}
      - selfswitch: [A, true]
      else:
      - selfswitch: [A, true]
  - cond: {self: A}
    commands: []
  at: [85, 46]
