    trigger: action
    move: random
    graphic: {sprite: NPC 27, dir: down}
  - commands: ['Busker: I''ve played this corner twenty years. Not one strange thing has happened to me. I find it very hard to write songs.']
    trigger: action
    move: random
    graphic: {sprite: NPC 27, dir: down}
    cond: {self: A}
