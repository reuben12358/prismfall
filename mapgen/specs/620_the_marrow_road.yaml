    trigger: action
    move: fixed
    commands:
    - {script: 'pbMessage(_INTL("Sahar stares up at the colossal carved skull-mouth uncovered by last night''s dune-shift. She has gone very pale."))

        pbMessage(_INTL("Sahar: ...I know this door. AF 281. I was thirty-nine."))

        pbMessage(_INTL("Sahar: My team took four months and a Claydol to open it. Nine of us. I made rubbings, wrote a report, and sent it to the Sovereign."))

        pbMessage(_INTL("Sahar: Valen came himself. He walked through it with a lamp, alone. When he came out he said, ''Seal it, Sahar. For the realm.''"))

        pbMessage(_INTL("Sahar: So we sealed it. I burned the rubbings and told my team we''d found a collapsed granary. Two of them still don''t speak to me."))

        pbMessage(_INTL("Sahar: I buried the truth once because I was told to. The sand has dug it up. I''d rather not argue with sand twice."))

        pbMessage(_INTL("Sahar: Walk the bones in there, the way I told you. The floor''s older than the rules about floors. Come on."))

        $game_variables[126] = 6 if $game_variables[126].to_i < 6

        $game_map.need_refresh = true'}
  - cond:
