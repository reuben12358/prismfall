  - through: true
    commands: []
  - cond: {switch: 116}
    trigger: touch
    through: true
    commands:
    - {script: "pbMessage(_INTL(\"Sahar stares at the three-hundred-year-old inner seal-stone now lying flat on the bone floor.\"))\npbMessage(_INTL(\"Sahar: It took\
        \ a team of nine and a Claydol four months to shift that seal in AF 281. ...You leaned on it.\"))\nc_joke = pbMessage(_INTL(\"How do you answer Sahar?\"),\
        \ [_INTL(\"It was loose.\"), _INTL(\"I was tired.\"), _INTL(\"...\")], 3)\nif c_joke == 0\n  pbMessage(_INTL(\"Sahar: It was NOT loose. Things are not 'loose'\
        \ around you. Things give up.\"))\nelsif c_joke == 1\n  pbMessage(_INTL(\"Sahar: You were tired, and a three-hundred-year-old seal fell over. I'll put 'The\
        \ challenger was tired' in the report.\"))\nelse\n  pbMessage(_INTL(\"Sahar: Don't do the silence at me. I'm an archaeologist. I've been stared at by better\
        \ skulls than you.\"))\nend\npbMessage(_INTL(\"(A familiar voice calls down from the brow of the colossal fossil skull above you!)\"))\npbMessage(_INTL(\"\
        Kestrel: Told you. Things give up around them. Rivers. Plates. Me. Twice.\"))\npbMessage(_INTL(\"Sahar: ...Twice?\"))\npbMessage(_INTL(\"Kestrel: Don't. (He\
        \ drops down onto the sand, thinner, his black coat dusty to the knee.)\"))\npbMessage(_INTL(\"Kestrel: I saw the murals over your shoulder — the king and\
        \ the chain. The Hollow cell came through Duneholt asking about old doors, and everywhere I go there's YOU in front of me!\"))\npbMessage(_INTL(\"Kestrel:\
        \ Fight me. I need to know if I'm getting closer.\"))\nsetBattleRule(\"field\", :DESERT)\nwon = (Prismfall.rival_battle(:RIVAL_KESTREL, \"Kestrel\", 3) rescue\
        \ false)\nif won\n  pbMessage(_INTL(\"Kestrel: ...No. Not closer.\"))\n  pbMessage(_INTL(\"(He sits on a fossil rib and draws black lace stitched with a silver\
        \ ghost-lantern from under his coat — his mother Morwen's Warden veil.)\"))\n  pbMessage(_INTL(\"Kestrel: Everyone keeps telling me to let it go. Nobody saw\
        \ a body. And now every inn from here to Ebbmouth says the Mourner's Morwen Vane — made to disappear, and come back.\"))\n  c_rumor = pbMessage(_INTL(\"What\
        \ do you tell Kestrel?\"), [_INTL(\"Then go and find out.\"), _INTL(\"It might not be her, Kestrel.\"), _INTL(\"...\")], 3)\n  if c_rumor == 0\n    pf_choose(:ch6_kestrel_rumor,\
        \ :encourage) rescue nil\n    pbMessage(_INTL(\"Kestrel: ...Everyone else says 'let it go'. You said 'go'. Then I'm going — all the way.\"))\n  elsif c_rumor\
        \ == 1\n    pf_choose(:ch6_kestrel_rumor, :warn) rescue nil\n    pbMessage(_INTL(\"Kestrel: I know it might not be her. I KNOW. ...I just need it not to be\
        \ nobody.\"))\n  else\n    pf_choose(:ch6_kestrel_rumor, :silent) rescue nil\n    pbMessage(_INTL(\"Kestrel: Yeah. That's what Gran says, too. Nothing, very\
        \ loudly.\"))\n  end\n  pbMessage(_INTL(\"Kestrel: The Hollow cell's gone south and down to Nadir — Mirefen, the char-burners said. I'm going after them.\
        \ Don't follow me where I can see.\"))\n  $game_switches[117] = true\n  $game_variables[126] = 8 if $game_variables[126].to_i < 8\n  $game_map.need_refresh\
        \ = true\nelse\n  pbMessage(_INTL(\"Kestrel: Again. I'm not done being right.\"))\nend"}
