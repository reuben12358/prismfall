- type: event
  name: Lecture, Archaeological
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - if: pfm_get(:ch6_k3_tried)
      then:
      - {script: pfm_fade_out(8)}
      - move:
          who: Kestrel (brow)
          route:
          - graphic: [KESTREL, 0, 2, 0]
          - {opacity: 255}
          - {script: 'moveto(66, 36)'}
          wait: true
      - move:
          who: Sahar (Door in the Skull)
          route:
          - {opacity: 255}
          wait: true
      - move:
          who: player
          route:
          - {script: 'moveto(66, 38)'}
          - turn_up
          wait: true
      - {script: 'pfm_tone(34, -6, -40, 10, 14)'}
      - '\pf[KESTREL,neutral,,Kestrel (brow)]Kestrel: Again. I''m not done being right.'
      - &id001 {script: 'pfm_set(:ch6_k3_tried)'}
      - &id002
        if: 'Prismfall.rival_battle(:RIVAL_KESTREL, "Kestrel", 3, field: :DESERT)'
        then:
        - '\pf[KESTREL,sad,,Kestrel (brow)]Kestrel: ...'
        - 'Kestrel: No. Not closer.'
        - move:
            who: Kestrel (brow)
            route: [turn_down]
            wait: true
        - {wait: 50}
        - {script: 'pbSEPlay("GUI menu open", 40, 60)

            pfm_glow(26, 26, 40, 20, 20)'}
        - {wait: 20}
        - 'Kestrel: Gran''s trunk. It was hers. Her Warden''s veil.'
        - 'Kestrel: Gran kept it in a trunk that wasn''t even locked, for six years, and never said.'
        - {script: 'pfm_face("Kestrel (brow)", :player)'}
        - '\pf[KESTREL,angry,,Kestrel (brow)]Kestrel: Everyone keeps telling me to let it go.'
        - 'Kestrel: My mother had a seat, and a Plate, and a city that loved her.'
        - 'Kestrel: Then one night she had nothing. Let WHAT go?'
        - 'Kestrel: They say she died in exile. Of the wilting. They sent a box.'
        - 'Kestrel: Nobody saw a body.'
        - 'Kestrel: Nobody in Gravenmoor will say where she''s buried.'
        - '\pf[KESTREL,sad,,Kestrel (brow)]Kestrel: And now there''s a man in a mask who talks like her, and the whole realm''s saying it. Every inn from here to
          Ebbmouth.'
        - 'Kestrel: The Mourner''s Morwen Vane. She didn''t die.'
        - 'Kestrel: She was made to disappear, and she came back.'
        - 'Kestrel: She wasn''t killed by the Bleed. She was made to disappear.'
        - choices: [Then go and find out., 'It might not be her, Kestrel.', '...']
          branches:
          - - {script: 'pf_choose(:ch6_kestrel_rumor, :encourage)'}
            - '\pf[KESTREL,shocked,jolt,Kestrel (brow)]Kestrel: ...You think it''s her.'
            - '\pf[KESTREL,happy,,Kestrel (brow)]Kestrel: You think it could be her.'
            - 'Kestrel: Everyone else says "let it go". You said "go".'
            - 'Kestrel: Then I''m going. All the way.'
            - 'Kestrel: Wherever he turns up next, I''ll be closest.'
          - - {script: 'pf_choose(:ch6_kestrel_rumor, :warn)'}
            - '\pf[KESTREL,angry,,Kestrel (brow)]Kestrel: I know it might not be her. I KNOW.'
            - 'Kestrel: Don''t you think I know?'
            - '\pf[KESTREL,sad,,Kestrel (brow)]Kestrel: ...I just need it not to be nobody.'
            - move:
                who: Kestrel (brow)
                route: [turn_up]
                wait: true
          - - {script: 'pf_choose(:ch6_kestrel_rumor, :silent)'}
            - '\pf[KESTREL,sad,,Kestrel (brow)]Kestrel: Yeah. That''s what Gran says, too.'
            - 'Kestrel: Nothing, very loudly.'
          cancel: 3
        - '\pf[KESTREL,neutral,,Kestrel (brow)]Kestrel: The cell''s gone south and down, to Nadir.'
        - 'Kestrel: Mirefen, the char-burners said. I''m going after them.'
        - 'Kestrel: Don''t follow me. You will anyway.'
        - 'Kestrel: Just don''t do it where I can see.'
        - move:
            who: Kestrel (brow)
            route:
            - through_on
            - down
            - down
            - down
            - down
            - right
            - right
            - right
            - right
            - right
            - right
            - right
            - right
            - right
            - right
            - right
            - right
            - {opacity: 0}
            wait: true
        - switch: [CH6_K3_DONE, true]
        - var: [CH6_STEP, 8]
      else:
      - {script: 'pfm_tone(34, -6, -40, 10, 30)'}
      - move:
          who: Sahar (Door in the Skull)
          route:
          - {opacity: 255}
          - turn_up
          wait: true
      - {wait: 30}
      - {script: 'pfm_face(:player, "Sahar (Door in the Skull)")'}
      - '\pf[SAHAR,neutral,,Sahar (Door in the Skull)]Sahar: The seal on that inner door was three hundred years old.'
      - 'Sahar: It took a team of nine and a Claydol four months to shift it in AF 281.'
      - {script: 'pfm_face("Sahar (Door in the Skull)", :player)'}
      - '\pf[SAHAR,deadpan,dots,Sahar (Door in the Skull)]Sahar: You leaned on it.'
      - choices: [It was loose., I was tired., '...']
        branches:
        - ['\pf[SAHAR,deadpan,,Sahar (Door in the Skull)]Sahar: It was not loose.', 'Sahar: Things are not "loose" around you. Things give up.']
        - ['\pf[SAHAR,deadpan,,Sahar (Door in the Skull)]Sahar: You were tired, and a three-hundred-year-old seal fell over.', 'Sahar: I''ll put that in the report.
            "The challenger was tired."']
        - ['\pf[SAHAR,deadpan,,Sahar (Door in the Skull)]Sahar: Don''t do the silence at me. I''m an archaeologist.', 'Sahar: I''ve been stared at by better skulls
            than you.']
        cancel: 3
      - move:
          who: Kestrel (brow)
          route:
          - graphic: [KESTREL, 0, 2, 0]
          - {opacity: 255}
          wait: true
      - raw:
        - 203
        - [8, 2, 4]
      - '\pf[KESTREL,smug,,Kestrel (brow)]Kestrel: Told you. Things give up around them.'
      - 'Kestrel: Rivers. Plates. Me. Twice.'
      - move:
          who: Sahar (Door in the Skull)
          route: [turn_up]
          wait: true
      - '\pf[SAHAR,shocked,question,Sahar (Door in the Skull)]Sahar: ...Twice?'
      - '\pf[KESTREL,deadpan,,Kestrel (brow)]Kestrel: Don''t.'
      - move:
          who: Kestrel (brow)
          route:
          - through_on
          - jump: [0, 3]
          - through_off
          wait: true
      - {script: 'pbSEPlay("Anim/Earth4", 50, 110)

          pfm_shake(1, 16, 6)'}
      - {script: pfm_pan_home(16)}
      - {script: 'pfm_face(:player, "Kestrel (brow)")'}
      - {script: 'pfm_face("Kestrel (brow)", :player)'}
      - '\pf[KESTREL,neutral,,Kestrel (brow)]Kestrel: I saw them. Over your shoulder. The king and the chain.'
      - 'Kestrel: I was in there before you, in the dark.'
      - 'Kestrel: I couldn''t read it till you brought the lamp.'
      - 'Kestrel: I left the lighthouse the night of the Lowlight and I''ve been on the Hollow''s trail ever since.'
      - 'Kestrel: They''ve got a cell out here. They came through Duneholt last week asking about old doors.'
