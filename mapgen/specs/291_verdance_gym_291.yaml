- type: sign
  name: Ring of Six Blueprint
  at: [12, 20]
  post: false
  text: 'HEDGE GARDEN — THE RING OF SIX

    Clockwise Ring: P1 (SW) — P2 (W) — P3 (NW Pier) — P4 (NW) — P5 (NE Pier) — P6 (E) — P1.

    Follow the glowing aqua floor conduits to each Brass Spigot! Watering any bed advances it + both ring neighbours (+1 mod 4: 0 Soil -> 1 Sprouts -> 2 Bridge ->
    3 Hedge -> 0).

    Crossings needed: P1, P3, P5 = Stage 2. Every Stage 3 Hedge left raises Juno''s arena!'
- type: event
  name: Apprentice Bram
  at: [11, 21]
  pages:
  - graphic: {sprite: NPC 05, dir: up}
    trigger: action
    move: fixed
    commands:
    - {script: "st_n = [\"0:Soil\", \"1:Sprouts\", \"2:Bridge\", \"3:Hedge\"]\ndefs = [[\"P1\",0,[\"P1_L\",\"P1_R\"]],[\"P2\",0,[\"P2_L\",\"P2_R\"]],[\"P3\",1,[\"\
        P3_L\",\"P3_R\"]],[\"P4\",2,[\"P4_L\",\"P4_R\"]],[\"P5\",1,[\"P5_L\",\"P5_R\"]],[\"P6\",2,[\"P6_L\",\"P6_R\"]]]\nvals = {}\ndefs.each { |pid, s0, evs| vals[pid]\
        \ = (s0 + pfp_state_of(evs[0])) % 4 }\nh291 = vals.values.count(3)\n$game_variables[346] = h291\n$game_variables[345] = h291 + $game_variables[347].to_i\n\
        summary = defs.map { |pid, _, _| \"#{pid}=#{vals[pid]}\" }.join(\"  \")\ncmds = [_INTL(\"Check beds & hedge count\"), _INTL(\"Ask for a hint\"), _INTL(\"\
        Reset all six beds\")]\ncmds.push(_INTL(\"Skip room (Puzzle Skip)\")) if $game_switches[301]\ncmds.push(_INTL(\"Never mind\"))\nch = pbMessage(_INTL(\"Bram:\
        \ Juno's cousin, at your service! [#{summary}] | Hedges here: {1} (Total: {2})\", h291, $game_variables[345]), cmds, cmds.length)\ncase ch\nwhen 0\n  pbMessage(_INTL(\"\
        Bram: Current stages — P1={1}, P2={2}, P3={3}, P4={4}, P5={5}, P6={6}.\", st_n[vals[\"P1\"]], st_n[vals[\"P2\"]], st_n[vals[\"P3\"]], st_n[vals[\"P4\"]],\
        \ st_n[vals[\"P5\"]], st_n[vals[\"P6\"]]))\n  pbMessage(_INTL(\"Bram: You need P1, P3, and P5 at Stage 2 (Bridge) to cross north. Every Stage 3 Hedge raises\
        \ Juno's arena Flower Garden stage by +1!\"))\nwhen 1\n  tier = $game_variables[348].to_i\n  if tier == 0\n    pbMessage(_INTL(\"Bram (Hint 1/3): Water the\
        \ plot NEXT to the one you want. Neighbours hear everything along the ring!\"))\n    $game_variables[348] = 1\n  elsif tier == 1\n    pbMessage(_INTL(\"Bram\
        \ (Hint 2/3): P6 is already a bridge — one watering turns it into a hedge (fast, +1 arena stage), while two waterings collapse it cleanly while feeding P1\
        \ and P5!\"))\n    $game_variables[348] = 2\n  else\n    pbMessage(_INTL(\"Bram (Hint 3/3): From a fresh reset — FAST (2 waterings, 1 hedge): water P2 once,\
        \ P6 once. CLEAN (5 waterings, 0 hedges): water P4 once, P5 twice, P6 twice!\"))\n  end\nwhen 2\n  on_plot = defs.any? { |_, _, evs| evs.any? { |en| (e =\
        \ pfp_ev(en)) && e.x == $game_player.x && e.y == $game_player.y } }\n  if on_plot\n    pbMessage(_INTL(\"Bram: Step onto dry stone before I prune the beds!\"\
        ))\n  elsif pbConfirmMessage(_INTL(\"Bram: Want me to prune all six beds back to their starting growth?\"))\n    defs.each { |_, _, evs| evs.each { |en| pfp_state(en,\
        \ 0) } }\n    $game_variables[346] = 0\n    $game_variables[345] = $game_variables[347].to_i\n    $game_switches[345] = false\n    $game_map.need_refresh\
        \ = true\n    pbSEPlay(\"Anim/Water2\", 80, 100)\n    pbMessage(_INTL(\"Bram: Done! Fresh start: P1..P6 = 0, 0, 1, 2, 1, 2.\"))\n  end\nwhen 3\n  if $game_switches[301]\n\
        \    clean = {\"P1\"=>2,\"P2\"=>0,\"P3\"=>2,\"P4\"=>1,\"P5\"=>2,\"P6\"=>2}\n    defs.each do |pid, s0, evs|\n      k = (clean[pid] - s0) % 4\n      evs.each\
        \ { |en| pfp_state(en, k) }\n    end\n    $game_variables[346] = 0\n    $game_variables[345] = $game_variables[347].to_i\n    $game_switches[345] = true\n\
        \    $game_map.need_refresh = true\n    pbSEPlay(\"Anim/HealBell\", 90, 100)\n    pbMessage(_INTL(\"Bram: Puzzle Skip active! I've pruned the clean zero-hedge\
        \ bridges (P1, P3, P5) for you.\"))\n  end\nend"}
