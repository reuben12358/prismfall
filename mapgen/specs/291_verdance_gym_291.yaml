        , \"P2_R\"]],\n  [\"P3\", 1, [\"P3_L\", \"P3_R\"]],\n  [\"P4\", 2, [\"P4_L\", \"P4_R\"]],\n  [\"P5\", 1, [\"P5_L\", \"P5_R\"]],\n  [\"P6\", 2, [\"P6_L\",\
        \ \"P6_R\"]]\n]\ntargets = [\"P1\", \"P6\", \"P2\"]\non_plot = plots.any? do |pid, _, evs|\n  targets.include?(pid) && evs.any? { |en| (e = pfp_ev(en)) &&\
        \ e.x == $game_player.x && e.y == $game_player.y }\nend\nif on_plot\n  pbMessage(_INTL(\"Step off the vine bridge onto dry stone before watering!\"))\nelse\n\
        \  cur_st = nil\n  plots.each do |pid, s0, evs|\n    cur_st = (s0 + pfp_state_of(evs[0])) % 4 if pid == \"P1\"\n  end\n  msg = _INTL(\"Plot P1 (REQUIRED BRIDGE)\
        \ — Stage {1} ({2}). Neighbours: P6, P2. Water it?\", cur_st, st_names[cur_st])\n  if pbConfirmMessage(msg)\n    pbSEPlay(\"Anim/Water1\", 80, 105)\n    cur\
        \ = {}\n    plots.each do |pid, s0, evs|\n      k = pfp_state_of(evs[0])\n      if targets.include?(pid)\n        k = (k + 1) % 4\n        evs.each { |en|\
        \ pfp_state(en, k) }\n      end\n      cur[pid] = (s0 + k) % 4\n    end\n  h291 = cur.values.count(3)\n  $game_variables[346] = h291\n  $game_variables[345]\
        \ = h291 + $game_variables[347].to_i\n  done = (cur[\"P1\"] == 2 && cur[\"P3\"] == 2 && cur[\"P5\"] == 2)\n  was_done = $game_switches[345]\n  $game_switches[345]\
        \ = done\n  $game_map.need_refresh = true\n  if done && !was_done\n    pbSEPlay(\"Anim/HealBell\", 90, 100)\n    pbMessage(_INTL(\"P1, P3, and P5 are all\
        \ woven into vine bridges! The path north is open — hedges left in this room: {1}.\", h291))\n  else\n    pbMessage(_INTL(\"Water ripples along the ring!\
        \ {1} is now {2}. (Room hedges: {3})\", \"Plot P1 (REQUIRED BRIDGE)\", st_names[cur[\"P1\"]], h291))\n  end\n  end\nend"}
