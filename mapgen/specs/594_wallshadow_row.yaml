  at: [14, 39]
  pages:
  - graphic: {sprite: NPC 18, dir: down}
    trigger: action
    move: fixed
    commands: ['Innkeeper: Welcome to The Four Ways! Warm pie, cold cider, and a mounting block that sees half Velmora pass by.', 'Innkeeper: Don''t ask
