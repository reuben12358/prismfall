- type: event
  name: Shrine-keeper
  at: [109, 57]
  pages:
  - graphic: {sprite: NPC 25, dir: up}
    trigger: action
    move: fixed
    commands: ['Shrine-keeper: "And keep the One." Every prayer ends that way.', 'Shrine-keeper: I''ve said it forty years. The Choir says it means the
        Sovereign.', 'Shrine-keeper: My gran said it meant the Ogre. Nobody''s ever told me to my face.']
- type: trainer
  at: [64, 32]
  sight: 4
  dir: down
  sprite: trainer_AROMALADY
  trainer: [AROMALADY, Linnet]
  intro: 'Linnet: The meadow herbs grow sharpest here in the Crownwall''s shadow—let''s see if your team thrives in the shade!'
  after: 'Linnet: They do better in the Wall''s shade. So do I, usually.'
- type: trainer
  at: [51, 46]
  sight: 4
  dir: up
  sprite: trainer_YOUNGSTER
  trainer: [YOUNGSTER, Hodge]
  intro: 'Hodge: Hey! You crossed the barley hedgerow without paying toll! Battle me instead!'
  after: 'Hodge: I''m telling the tithe-reeve. He won''t care either.'
- type: trainer
  at: [31, 46]
  sight: 4
  dir: up
  sprite: trainer_LASS
  trainer: [LASS, Marigold]
  intro: 'Marigold: Four kingdoms meet at The Four Ways—and I''ve challenged trainers from all of them! Your turn!'
  after: 'Marigold: Four kingdoms on that signpost and I lost in this one.'
- type: trainer
  at: [88, 37]
  sight: 4
  dir: down
  sprite: trainer_TAMER
  trainer: [TAMER, Hob]
  intro: 'Hob: Mind the Accord''s tithe wagons! My hounds keep the road clear—show me your footing!'
  after: 'Hob: Tithe barn''s full. My pride isn''t.'
- type: trainer
  at: [129, 44]
  sight: 4
  dir: up
  sprite: trainer_TWINS
  trainer: [TWINS, Meg & Peg]
  intro: 'Meg & Peg: Two roads! Two barns! Two of us! Ready for a Crown Road double battle?'
  after: 'Meg: Your fault. Peg: YOUR fault.'
