- type: sign
  name: Four-Kingdom Signpost
  at: [26, 45]
  post: false
  text: 'FOUR-KINGDOM SIGNPOST: ← ISENMAR (THE LOCKS) · ↑ ELOWEN (VERDANCE, BY PRISM FALLS) · ↓ ZENITH (LUMEN) · ↘ NADIR (THE LONG DROP). A fifth arm has
    been nailed on, pointing straight at the Crownwall. It''s blank.'
- type: sign
  name: Prayer Board
  at: [107, 56]
  post: false
  text: 'PRAYER BOARD: "...that the Eighteen keep their peace, and the land its shape, and the Sovereign his strength; and keep the One."'
- type: sign
  name: Southgate Chapel Window
  at: [111, 55]
  post: false
  text: 'SOUTHGATE CHAPEL WINDOW: Eighteen panes of coloured glass around one clear pane. The clear pane in the middle catches the sun and throws it on
    the floor as a small colourless star.'
- type: sign
  name: Southgate Shrine Door
  at: [108, 55]
  post: false
  text: SOUTHGATE SHRINE — A small stone chapel where the Crown Road meets the road down to Lumen. Inside, cool stone smells of beeswax and rain.
- type: sign
  name: West Tithe Barn Door
  at: [53, 32]
  post: false
  text: 'ACCORD TITHE BARN IV — Carved over the lintel: eighteen rings around one blank circle. Stacked sacks of Wallshadow barley fill the eaves.'
- type: sign
  name: East Tithe Barn Door
  at: [86, 33]
  post: false
  text: ACCORD TITHE BARN V — Chalk tallies mark every tenth sheaf collected for the Accord, and every tenth for the Queen.
- type: sign
  name: Four Ways Inn Door
  at: [13, 38]
  post: false
  text: THE FOUR WAYS INN — Hot pies, Elowen cider, and dry stabling. The innkeeper insists the mounting block outside is luckier than any signpost.
- type: sign
  name: Bricked-Up Accord Cave
  at: [74, 16]
  post: false
  text: A narrow cave mouth cut into the Crownwall's white chalk foot, bricked up with old Accord mortar. Several bricks are loose—cold air seeps out, smelling
    of wet chalk and faraway bells.
