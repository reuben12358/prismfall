id: 103
name: Larch Research Station
display_name: Tidewatch Station
parent: 100
template: lab
exit_link: FL_LAB
drop_template_events: [Professor, "Turn back, size(3,1)", Grass ball, Fire ball, Water ball, Controlling event,
                       Wall sign left, Wall sign right, Pokédex, Dex access]
bgm: Lab
metadata: {Name: Tidewatch Station, MapPosition: [0, 14, 26]}
events:
  - type: event
    name: Professor Larch
    at: [6, 3]
    pages:
      - cond: {switch: LARCH_AT_TIDEWATCH}
        graphic: {sprite: trainer_PROFESSOR, dir: down}
        commands: ["Professor Larch: Customs first, child. Meridian gets cross if anyone skips the queue."]
      - cond: {switch: LARCH_AT_TIDEWATCH, switch2: PRO_SCANNED_NULL}
        graphic: {sprite: trainer_PROFESSOR, dir: down}
        commands:
          - "You hand over your mother's letter. Professor Imelda Larch reads it, and sets it down very carefully."
          - "She pours two cups of kelp tea."
          - "Professor Larch: Your mother was the bravest coward I ever knew. Drink. It's disgusting."
          - "She doesn't explain."
          - "Professor Larch: The Wayfarer Sanctuary keeps partners for people who arrive with nothing. Choose one from the table."
      - cond: {switch: LARCH_AT_TIDEWATCH, switch2: CH1_STARTER_GOT}
        graphic: {sprite: trainer_PROFESSOR, dir: down}
        commands: ["Professor Larch: Look after that one. And mind Kestrel - he bites, but only when he's frightened."]
  - type: event
    name: Juno
    at: [4, 5]
    pages:
      - graphic: {sprite: trainer_RIVAL2, dir: right}
        commands:
          - "Juno: You're the one off the last ferry! I'm Juno - the Professor's assistant. Mostly I water things."
          - "Juno: We're going to be friends, I can tell. I have a nose for it."
      - cond: {switch: CH1_K1_DONE}
  - &starter
    type: event
    name: Starter table
    at: [9, 4]
    pages:
      - graphic: {sprite: Object ball}
        commands: ["Three Poké Balls rest on a velvet tray. Better wait for the Professor."]
      - cond: {switch: PRO_SCANNED_NULL}
        graphic: {sprite: Object ball}
        commands:
          - script: |
              gens = (1..9).to_a
              g = pbMessage(_INTL("Which region's partners?"), gens.map { |n| _INTL("Generation {1}", n) }, -1)
              if g >= 0
                gen = gens[g]
                lines = (0..2).map { |s| Prismfall::Rival.line(gen, s) }
                names = lines.map { |l| GameData::Species.get(l[0]).name }
                s = pbMessage(_INTL("Choose your partner!"), names + [_INTL("Back")], 3)
                if s >= 0 && s < 3 && pbAddPokemon(lines[s][0], 5)
                  Prismfall.record_starter($player.party[-1], gen: gen, slot: s)
                  $game_switches[@@CH1_STARTER_GOT] = true
                end
              end
          - if: "$game_switches[@@CH1_STARTER_GOT]"
            then:
              - "Juno bounces in, kerchief askew, seed packets everywhere."
              - script: |
                  sp = GameData::Species.get(Prismfall::Rival.rival_starter_species(:JUNO)).name
                  pbMessage(_INTL("Juno: Ooh, I'll take {1}! It was looking at me. Also, underdogs.", sp))
              - "A door bangs. A boy with hay in his hair drops down from the loft."
              - script: |
                  sp = GameData::Species.get(Prismfall::Rival.rival_starter_species(:KESTREL)).name
                  pbMessage(_INTL("Kestrel: I'll have {1}. Fair fights are for people who can afford to lose.", sp))
              - "Professor Larch lets him take it, with a look that says she has history with this family."
              - "Kestrel: See you outside, tourist."
              - "Professor Larch: And this. A Pokédex. Your mother would have wanted you to look at things properly."
              - {script: "$player.has_pokedex = true"}
              - "\\PN received a Pokédex!"
      - cond: {switch: CH1_STARTER_GOT}
        commands: ["The tray is empty now."]
  - {<<: *starter, name: Starter ball L, at: [8, 4]}
  - {<<: *starter, name: Starter ball R, at: [10, 4]}
  - type: event
    name: Rowan Ashby
    at: [3, 9]
    pages:
      - cond: {switch: CH1_K1_DONE}
        graphic: {sprite: trainer_POKEMONRANGER_M, dir: right}
        commands:
          - "Rowan Ashby: Juno's uncle - Rowan. Grass Warden, when Verdance lets me out. I'm down for seed stock."
          - "He shows you a sickly Phantump curled in his coat."
          - "Rowan Ashby: Found it in the Glasswood past Briarwick. Sitting in a tree that had turned to glass, crying."
          - "Rowan Ashby: Everything that grows must be allowed to die. That's not sad. That's what makes room."
          - "Rowan Ashby: ...She'd have liked you. My wife, I mean."
  - {type: sign, at: [11, 6], post: false, name: Imprint scanner, text: "An Imprint scanner hums quietly. Its last reading: NULL."}
