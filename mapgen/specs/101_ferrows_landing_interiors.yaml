- type: event
  name: Hesper Vane
  pages:
  - commands:
    - An old woman is polishing the great lamp with a rag. She is shouting down the stairwell.
    - '\pf[HESPER,angry,,Hesper Vane]Hesper: —and if I find straw in my good boots AGAIN, Kestrel Vane, I''ll—'
    - move:
        who: Hesper Vane
        route: [turn_down]
        wait: true
    - anim: [Hesper Vane, 3]
    - The rag drops.
    - {wait: 60}
    - '\pf[HESPER,shocked,shock,Hesper Vane]Hesper: ...'
    - '\pf[HESPER,angry,,Hesper Vane]Hesper: Who let you up here? Get out. Lighthouse is closed. Sea''s closed. Everything''s closed.'
    - choices: ['Do you know me?', I'm sorry., '...']
      branches:
      - ['\pf[HESPER,angry,,Hesper Vane]Hesper: I don''t know anybody. I''m seventy-eight. I''ve forgotten more people than you''ve met.']
      - ['\pf[HESPER,sad,,Hesper Vane]Hesper: ...Don''t be sorry. Sorry''s no use to a lamp.']
      - ['\pf[HESPER,sad,,Hesper Vane]Hesper: Stars. You even stand like— no.']
      cancel: 3
    - '\pf[HESPER,neutral,,Hesper Vane]Hesper: You''re the one the boy fought on the quay. He came home swearing. That means he liked it.'
    - '\pf[HESPER,neutral,,Hesper Vane]Hesper: Keep away from him. Everyone who gets near that boy''s mother''s ghost gets hurt.'
    - move:
        who: Hesper Vane
        route: [turn_up]
        wait: true
    - selfswitch: [A, true]
    trigger: autorun
    move: fixed
    graphic: {sprite: NPC 11, dir: up}
  - commands:
    - if: pfm?(:saw_mirror) && !pfm?(:hesper_mirror)
      then:
      - '\pf[HESPER,angry]Hesper: Leave it. It shows the truth crooked, same as everything.'
      - {script: 'pfm_set(:hesper_mirror)'}
      else: ['\pf[HESPER,angry]Hesper: Lighthouse is closed. Sea''s closed. Everything''s closed.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 11, dir: up}
    cond: {self: A}
  at: [6, 7]

