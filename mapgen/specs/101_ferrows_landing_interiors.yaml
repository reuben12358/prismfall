events:
- type: exit
  at: [10, 14]
  link: FL_INN
- type: event
  name: Innkeeper
  pages:
  - commands:
    - 'Innkeeper: Rooms are full of people who came home on the last boat with nowhere to be. First time I''ve been full since the wedding of ''91.'
    - if: $game_switches[@@CH1_ORCHARD_DONE] && $game_variables[@@STORY_CHAPTER] < 2
      then: ['Innkeeper: And Wenna Hale''s been in. Said if I find you so much as a cot, she stops selling me tarts. I''m not risking the tarts. Farm''s up the lane.']
      else: []
    trigger: action
    move: fixed
    graphic: {sprite: NPC 21, dir: down}
  at: [4, 6]
- type: event
  name: Inn Guest
  pages:
  - commands: ['Inn Guest: I left Velmora nine years ago to be a famous painter. I''m back to be a tired one.']
    trigger: action
