id: 103
name: Larch Research Station
parent: 100
template: lab
exit_link: FL_LAB
drop_template_events: [Professor, "Turn back, size(3,1)", Grass ball, Fire ball, Water ball, Controlling event,
                       Wall sign left, Wall sign right, Pokédex, Dex access]
bgm: Lab
metadata: {MapPosition: [0, 14, 26]}
events:
  - {type: npc, name: Professor Larch, at: [6, 3], sprite: trainer_PROFESSOR, dir: down,
     text: "[TODO story] Larch: The scanner said NULL? Fascinating. Pick a partner from the table - any region's."}
  - {type: npc, name: Juno, at: [4, 5], sprite: trainer_RIVAL2, dir: right,
     text: "[TODO story] Juno: You're the one off the last ferry! I'm Juno. We're going to be friends, I can tell."}
  - &starter
    type: event
    name: Starter table
    at: [9, 4]
    pages:
      - graphic: {sprite: Object ball}
        commands:
          - script: |
              gens = (1..9).to_a
              g = pbMessage(_INTL("Which region's partners?"), gens.map { |n| _INTL("Generation {1}", n) }, -1)
              if g >= 0
                gen = gens[g]
                lines = (0..2).map { |s| Prismfall::Rival.line(gen, s) }
                names = lines.map { |l| GameData::Species.get(l[0]).name }
                s = pbMessage(_INTL("Choose your partner!"), names + [_INTL("Back")], 3)
                if s >= 0 && s < 3 && pbAddPokemon(lines[s][0], 5)
                  Prismfall.record_starter($player.party[-1], gen: gen, slot: s)
                  pbSetSelfSwitch(@event_id, "A", true)
                end
              end
      - cond: {self: A}
        commands: ["The table is empty now."]
  - {<<: *starter, name: Starter ball L, at: [8, 4]}
  - {<<: *starter, name: Starter ball R, at: [10, 4]}
  - {type: sign, at: [11, 6], post: false, name: Imprint scanner, text: "[TODO art] An Imprint scanner hums quietly. Its display reads: NULL."}
