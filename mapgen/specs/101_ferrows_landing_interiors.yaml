id: 103
name: Larch Research Station
parent: 100
bgm: Lab
metadata:
  Name: Tidewatch Station
  MapPosition: [0, 14, 26]
tone: [12, 6, -10, 0]
biome: interior
tileset: 34
raw: data/raw/103.npy
events:
- type: exit
  at: [14, 15]
  link: FL_LAB
- type: event
  name: Professor Larch
  pages:
  - commands: ['\pf[LARCH,neutral]Larch: Customs first, child. Meridian gets cross if anyone skips the queue.']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_PROFESSOR, dir: up}
    cond: {switch: LARCH_AT_TIDEWATCH}
  - commands:
    - 'A cluttered station: tide charts, brass instruments, a stove with a blackened kettle. Juno is at a bench, labeling seed packets, back turned.'
    - '\pf[LARCH,neutral,,Professor Larch]Larch: If that''s the kelp man, the answer is still yes, and I don''t care what he''s offering.'
    - move:
        who: Professor Larch
        route: [turn_down]
        wait: true
    - {wait: 40}
    - '\pf[LARCH,shocked,,Professor Larch]Larch: ...Oh.'
    - '\pf[LARCH,neutral,,Professor Larch]Larch: You''ve got her chin. Give me the letter.'
    - You hand over Mum's letter. Larch reads it.
    - {wait: 90}
    - She folds it very carefully and puts it on the bench.
    - '\pf[LARCH,sad,,Professor Larch]Larch: Last winter. And nobody told me until you were already on a boat.'
    - '\pf[LARCH,neutral,,Professor Larch]Larch: Your mother was the bravest coward I ever knew. Sit.'
    - Larch pours two cups from the kettle. The liquid is dark green.
    - '\pf[LARCH,neutral,,Professor Larch]Larch: Drink. It''s disgusting.'
    - choices: [Drink it., Pretend to drink it., '...']
      branches:
      - [It tastes like a harbor at low tide. You keep it down. Barely., '\pf[LARCH,happy,,Professor Larch]Larch: Ha! Nobody finishes the first one. Ines didn''t.']
      - ['\pf[LARCH,deadpan,,Professor Larch]Larch: I''ve watched forty people pretend. You''re the worst at it.']
      - ['\pf[LARCH,deadpan,,Professor Larch]Larch: It doesn''t get better if you stare at it. I''ve tried.']
      cancel: 3
    - '\pf[LARCH,neutral,,Professor Larch]Larch: She told you nothing, I take it. "Go to Imelda." That''s Ines. Hand me a child and a mystery and die before I can
      shout at her.'
    - '\pf[LARCH,neutral,,Professor Larch]Larch: Did they scan you at the dock?'
    - choices: [Yes., It said NULL.]
      branches:
      - ['\pf[LARCH,angry,anger,Professor Larch]Larch: She wrote ONE instruction about that. ...Not your fault. What did it say?']
      - ['\pf[LARCH,neutral,,Professor Larch]Larch: ...']
      cancel: 0
    - '\pf[LARCH,neutral,,Professor Larch]Larch: Null. Right. Well. That''s that, then.'
    - move:
        who: Juno
        route: [turn_down]
        wait: true
    - A seed packet slides off the bench.
    - '\pf[JUNO,shocked,,Juno]Juno: Professor, is this— are they— is this the ferry person?!'
    - '\pf[LARCH,deadpan,,Professor Larch]Larch: This is \PN. \PN, this is Juno Hale, my assistant. She''ll tell you about larches now. I can''t stop her. Nobody
      can.'
    - '\pf[JUNO,happy,,Juno]Juno: Did you know larches are the only conifers that drop their needles? Every winter they look dead. They''re not!'
    - '\pf[JUNO,happy,,Juno]Juno: They''re just letting go so they don''t snap. Professor says it''s the most sensible thing a tree''s ever done.'
    - '\pf[LARCH,deadpan,,Professor Larch]Larch: I said it once. In 296.'
    - '\pf[LARCH,neutral,,Professor Larch]Larch: Right. You can''t walk Velmora with empty pockets. Come through to the Sanctuary. Both of you.'
    - move:
        who: Professor Larch
        route: [through_on, right, right, right, right, right, right, through_off, turn_down]
        wait: true
    - {script: 'pfm_quest_done(:mums_letter)'}
    - {script: 'pbSetSelfSwitch(%EV[Starter table]%, "A", true)'}
    - selfswitch: [A, true]
    trigger: autorun
    move: fixed
    graphic: {sprite: trainer_PROFESSOR, dir: up}
    cond: {switch: PRO_SCANNED_NULL}
  - commands: ['\pf[LARCH,neutral]Larch: Through here. The Sanctuary. Pick a partner, I''ve got kelp boiling.']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_PROFESSOR, dir: down}
    cond: {self: A}
  - commands: ['\pf[LARCH,neutral]Larch: Look after that one. And mind Kestrel. He bites, but only when he''s frightened.']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_PROFESSOR, dir: down}
    cond: {switch: CH1_STARTER_GOT}
  - commands: ['\pf[LARCH,neutral]Larch: Lecture One. I''m numbering them. Sit down before you fall down.']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_PROFESSOR, dir: down}
    cond: {switch: CH1_ORCHARD_DONE}
  at: [9, 6]
- type: event
  name: Juno
  pages:
  - commands: ['\pf[JUNO,happy]Juno: Seed packets! Every one labelled! Mostly correctly!']
    trigger: action
    move: fixed
    graphic: {sprite: JUNO, dir: up}
  - commands: ['\pf[JUNO,happy]Juno: You''ve got a partner! I''ve got a partner! Everyone''s got a partner except the kettle!']
    trigger: action
    move: fixed
    graphic: {sprite: JUNO, dir: down}
    cond: {switch: CH1_STARTER_GOT}
  - commands: []
    trigger: action
    move: fixed
    cond: {switch: CH1_K1_DONE}
  at: [8, 9]
- type: event
  name: Kestrel (loft)
  pages:
  - commands: []
    trigger: action
    move: fixed
    through: true
  - commands: []
    trigger: action
    move: fixed
    cond: {switch: CH1_STARTER_GOT}
  at: [13, 8]
- type: event
  name: Starter table
  pages:
  - commands: ['Small Pokémon from every corner of the world, in pens and on perches. Better wait for the Professor.']
    trigger: action
    move: fixed
  - commands:
    - if: '!pfm?(:sanctuary_speech)'
      then:
      - {script: 'pfm_set(:sanctuary_speech)'}
      - A glasshouse full of small Pokémon from every corner of the world, in pens and on perches.
      - '\pf[LARCH,neutral,,Professor Larch]Larch: The Wayfarer Sanctuary. Twenty years of colleagues abroad sending me Pokémon that weren''t born here, so I could
        watch how the Imprints take hold of them.'
      - '\pf[LARCH,neutral,,Professor Larch]Larch: They all pick up a tint in a few weeks. Every one. I''ve never had one that didn''t.'
      - '\pf[LARCH,neutral,dots,Professor Larch]Larch: ...Never had one.'
      - '\pf[LARCH,neutral,,Professor Larch]Larch: Pick a partner. Any of them. Take your time, it''s the only decision today I trust you with.'
    - {script: "gens = (1..9).to_a\ng = pbMessage(_INTL(\"Which region's partners?\"), gens.map { |n| _INTL(\"Generation {1}\", n) }, -1)\nif g >= 0\n  gen = gens[g]\n\
        \  lines = (0..2).map { |s| Prismfall::Rival.line(gen, s) }\n  names = lines.each_with_index.map { |l, i| [_INTL(\"Grass: \"), _INTL(\"Fire: \"), _INTL(\"\
        Water: \")][i] + GameData::Species.get(l[0]).name }\n  s = pbMessage(_INTL(\"Pick a partner.\"), names + [_INTL(\"Back\")], 3)\n  if s >= 0 && s < 3 && pbAddPokemon(lines[s][0],\
        \ 5)\n    Prismfall.record_starter($player.party[-1], gen: gen, slot: s)\n    pfm_set(:starter_picked)\n  end\nend\n"}
    - if: '!pfm?(:starter_picked)'
      then:
      - '\pf[LARCH,neutral,,Professor Larch]Larch: Take your time. They''re not going anywhere. Most of them can''t.'
      - {exit: true}
    - '\pf[LARCH,happy,,Professor Larch]Larch: Good. It liked you before you chose it. I was watching.'
    - {script: $player.has_pokedex = true}
    - \me[Key item get]\PN received the Pokédex!
    - Fitted with a Meridian Imprint Reader. Larch has put tape over half of it.
    - '\pf[JUNO,happy,,Juno]Juno: My turn! Um. Um um um.'
    - move:
        who: Juno
        route: [right, right, turn_up, wait 10, right, turn_up]
        wait: true
    - {script: 'sp = GameData::Species.get(Prismfall::Rival.rival_starter_species(:JUNO)).name

        pbMessage("\\pf[JUNO,happy,,Juno]Juno: " + _INTL("This one. {1}. It was looking at me.", sp))'}
    - '\pf[LARCH,deadpan,,Professor Larch]Larch: That one''s at a disadvantage against \PN''s, Juno.'
    - '\pf[JUNO,happy,,Juno]Juno: Somebody should give the underdog a chance! Also it was LOOKING at me.'
    - {se: Player fall}
    - A crash from the loft. Hay falls.
    - move:
        who: Kestrel (loft)
        route:
        - graphic: [trainer_RIVAL1, 0, 2, 0]
        - {opacity: 255}
        - through_on
        - down
        - down
        - through_off
        wait: true
    - '\pf[LARCH,angry,shock,Professor Larch]Larch: Kestrel Vane. How long have you been sleeping in my hayloft?'
    - '\pf[KESTREL,deadpan,,Kestrel (loft)]Kestrel: Since Gran changed the lighthouse lock. So, Tuesday.'
    - '\pf[KESTREL,neutral,,Kestrel (loft)]Kestrel: You''re handing out partners to ferry tourists now? I''ve asked you for one for two years.'
    - '\pf[LARCH,neutral,,Professor Larch]Larch: You asked me twice, and both times you''d just set something on fire.'
    - '\pf[KESTREL,smug,,Kestrel (loft)]Kestrel: One of those was an accident.'
    - move:
        who: Kestrel (loft)
        route: [down, right, turn_up]
        wait: true
    - {script: 'sp = GameData::Species.get(Prismfall::Rival.rival_starter_species(:KESTREL)).name

        pbMessage("\\pf[KESTREL,smug,,Kestrel (loft)]Kestrel: " + _INTL("This one. {1}.", sp))'}
    - '\pf[JUNO,angry,,Juno]Juno: You only picked that because it beats theirs!'
    - '\pf[KESTREL,deadpan,,Kestrel (loft)]Kestrel: Yes. Fair fights are for people who can afford to lose.'
    - anim: [Professor Larch, 3]
    - {wait: 30}
    - '\pf[LARCH,sad,dots,Professor Larch]Larch: ...Take it. Your mother would''ve done the same thing, with the same face.'
    - '\pf[KESTREL,angry,anger,Kestrel (loft)]Kestrel: Don''t talk about her.'
    - move:
        who: Kestrel (loft)
        route: [through_on, down, down, down, left, left, left, left, left, left, left, down, down, turn_up]
        wait: true
    - '\pf[KESTREL,neutral,,Kestrel (loft)]Kestrel: Ferry kid. Outside. Let''s see if you''re worth the boat fare.'
    - move:
        who: Kestrel (loft)
        route:
        - down
        - {opacity: 0}
        wait: true
    - switch: [CH1_STARTER_GOT, true]
    trigger: action
    move: fixed
    cond: {self: A}
  - commands: [The pens are quieter now. One of the little ones keeps looking at the door.]
    trigger: action
    move: fixed
    cond: {switch: CH1_STARTER_GOT}
  at: [20, 10]
- type: event
  name: Rowan Ashby
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - if: '!pfm?(:rowan_met)'
      then:
      - A tall, weathered man is sorting seed trays. Soil under his nails. A small, sickly Phantump sits on his shoulder.
      - '\pf[JUNO,happy,,Juno (station)]Juno: Uncle Rowan! This is \PN! They came on the ferry and they beat Kestrel — or nearly — and we''re a team now!'
      - '\pf[ROWAN,happy,,Rowan Ashby]Rowan: Are you, now. Rowan Ashby. I keep the garden at Verdance, and this one''s aunt kept me.'
      - '\pf[ROWAN,neutral,,Rowan Ashby]Rowan: I came down for seed stock. And to check on the Professor''s tea plants. They''re thriving. I can''t account for it.'
      - '\pf[LARCH,deadpan,,Professor Larch]Larch: Spite.'
      - '\pf[ROWAN,neutral,,Rowan Ashby]Rowan: This is a Phantump. I found it up past Briarwick, in a wood that''s gone to glass. It was sitting in a glass tree,
        crying.'
      - '\pf[ROWAN,sad,,Rowan Ashby]Rowan: Its tree couldn''t die properly, you see. So it couldn''t either.'
      - '\pf[JUNO,sad,,Juno (station)]Juno: That''s so sad...'
      - '\pf[ROWAN,neutral,,Rowan Ashby]Rowan: It''s not sad that things die, Juno. Everything that grows must be allowed to. That''s what makes room.'
      - '\pf[ROWAN,neutral,,Rowan Ashby]Rowan: What''s sad is when they''re not let.'
      - The Phantump drifts off his shoulder and hovers in front of you. It stops shivering.
      - '\pf[ROWAN,shocked,,Rowan Ashby]Rowan: ...Well. It hasn''t gone near anyone but me in a month.'
      - '\pf[ROWAN,neutral,,Rowan Ashby]Rowan: She''d have liked you.'
      - choices: ['Who?', '...']
        branches:
        - ['\pf[ROWAN,sad,,Rowan Ashby]Rowan: My wife. Elin. ...She''s still in the garden. Come and see it someday.']
        - ['\pf[ROWAN,neutral,,Rowan Ashby]Rowan: Hm. You''re a good listener. It''s rarer than badges.']
        cancel: 2
      - {script: 'pfm_item(:MIRACLESEED, 1)'}
      - From the Warden of Verdance's own stock.
      - {script: 'pfm_set(:rowan_met)'}
      else: ['\pf[ROWAN,neutral]Rowan: The gate at the dock gave me green, same as every year. Twenty-four years of green. A man could get tired of a color.']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_POKEMONRANGER_M, dir: right}
    cond: {switch: CH1_K1_DONE}
  at: [17, 10]
- type: event
  name: Juno (station)
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands: ['\pf[JUNO,happy]Juno: Uncle Rowan says the Phantump likes you. It only likes him and compost.']
    trigger: action
    move: fixed
    graphic: {sprite: JUNO, dir: left}
    cond: {switch: CH1_K1_DONE}
  - commands: []
    trigger: action
    move: fixed
    cond: {switch: CH1_ORCHARD_DONE}
  at: [19, 11]
- type: sign
  name: Station bookshelf
  post: false
  text: '"Field safety, rule one, underlined three times: NEVER TAKE A TINTED PERSON PAST A VEIL."'
  at: [4, 5]
- type: sign
  name: Imprint scanner
  post: false
  text: 'An Imprint scanner hums quietly. Its last reading: NULL.'
  at: [12, 5]
- type: sign
  name: Kettle
  post: false
  text: A blackened kettle. Something dark green is stewing in it. It smells like low tide, on purpose.
  at: [14, 5]

