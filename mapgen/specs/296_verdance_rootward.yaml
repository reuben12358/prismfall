    commands:
    - {script: "if $game_switches[124]\n  pbMessage(_INTL(\"Rootward Resident: Print whatever you like in the Gazette — Rowan Ashby watered the apple trees in this\
        \ alley every autumn for twenty years without charging a copper.\"))\n  pbMessage(_INTL(\"Rootward Resident: If that makes a man Hollow, half the Rootward's\
        \ Hollow too.\"))\nelse\n  pbMessage(_INTL(\"Rootward Resident: All the runoff from the Glasshouse Ward trickles right down into our channel. They get the\
