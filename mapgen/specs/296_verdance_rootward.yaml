- type: event
  name: Rootward Laundress
  at: [19, 25]
  pages:
  - graphic: {sprite: NPC 11, dir: right}
    trigger: action
    move: fixed
    commands:
    - {script: "pbMessage(_INTL(\"Rootward Laundress: Scrub, wring, hang — and half an hour later the sheets are dusted yellow with upper-town pollen all over again.\"\
        ))\npbMessage(_INTL(\"Rootward Laundress: Folks up on the Market Terraces call it a blessing that nothing ever rots in Verdance. Try burying someone you loved\
        \ in soil that won't take a leaf.\"))\npbMessage(_INTL(\"Rootward Laundress: We're planning one proper old-Elowen wake by the dead well — a candle allowed\
        \ to burn out, a flower from beyond the walls that can actually wilt, and a song nobody's sung since the Bleed.\"))\nif $game_switches[125]\n  pbMessage(_INTL(\"\
        Rootward Laundress: Young Juno came down yesterday with her gloves still muddy and asked if she could sit by the well with us. That girl's got her uncle's\
        \ heart without his secrets.\"))\nelsif $game_switches[124]\n  pbMessage(_INTL(\"Rootward Laundress: ...After what came out at Ironreach, even the Hollow\
        \ folk down here say old Rowan understood that much: everything that grows has to be allowed to die.\"))\nend"}
- type: event
  name: Rootward Resident
  at: [26, 15]
  pages:
  - graphic: {sprite: NPC 08, dir: down}
