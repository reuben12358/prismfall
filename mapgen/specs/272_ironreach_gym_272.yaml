        \    ['Plate_272_W', 'Plate_272_E'].each { |pnm| pe = pfp_ev(pnm); $game_self_switches[[272, pe.id, \"A\"]] = false if pe }\n      $game_variables[341] =\
        \ 0\n      $game_player.moveto(14, 21)\n      $game_player.direction = 8\n      $game_player.straighten\n      $game_map.need_refresh = true\n    end\n  \
        \  PrismfallPuzzles.reset_trail\n    pbMessage(_INTL(\"Apprentice Hiro: Boulders and sparring partners are back on their chalk marks. Fresh stance!\"))\n\
        \    _loop = false\n  when _INTL(\"Coaching Hint\")\n    $game_variables[343] = $game_variables[343].to_i + 1\n    _tier = [$game_variables[343].to_i, 3].min\n\
