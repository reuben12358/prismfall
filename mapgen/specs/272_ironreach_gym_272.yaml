        \ Hiro: West Plate: {1} | East Plate: {2} | Bell Gate: {3}.\", _p1, _p2, $game_switches[341] ? \"OPEN\" : \"LOCKED\"))\n  when _INTL(\"Reset the Room\")\n\
        \    $game_variables[340] = $game_variables[340].to_i + 1\n    pbSEPlay(\"Mining iron\", 90, 95)\n    pbFadeOutIn do\n      [['Spar_272_W', 6, 7], ['Spar_272_E',\
