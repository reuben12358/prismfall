        \ _pev.id, \"A\"]] = _held\n      _sync_dirty = true\n    end\n  end\n  $game_map.need_refresh = true if _sync_dirty\nend\nif !PrismfallPuzzles::STEP_HOOKS[272]\
        \ || !PrismfallPuzzles::STEP_HOOKS[272][:g8_272]\n  pfp_step_hook(272, :g8_272) do |_from, to|\n    plx, ply = to[0], to[1]\n    if !$game_switches[341] &&\
        \ plx >= 4 && plx <= 24 && ply >= 6 && ply <= 18\n      _ropes = [[4, 11], [5, 10], [5, 11], [7, 11], [8, 11], [9, 11], [12, 9], [12, 10], [12, 11], [12,\
        \ 12], [12, 13], [13, 9], [13, 13], [15, 9], [15, 13], [16, 9], [16, 10], [16, 11], [16, 12], [16, 13], [19, 11], [20, 11], [21, 11], [23, 10], [23, 11],\
        \ [24, 11]]\n      _purs = [['Spar_272_W', 6, 7], ['Spar_272_E', 22, 7]]\n      _blds = [['Boulder_272_W', 6, 15], ['Boulder_272_E', 22, 15]]\n      _purs.each\
        \ do |pnm, _sx, _sy|\n        ev = pfp_ev(pnm)\n        next if !ev\n        dx = plx - ev.x\n        dy = ply - ev.y\n        if dx.abs + dy.abs > 1\n  \
        \        horiz = dx > 0 ? 6 : (dx < 0 ? 4 : nil)\n          vert  = dy > 0 ? 2 : (dy < 0 ? 8 : nil)\n          order = (dx.abs >= dy.abs) ? [horiz, vert]\
        \ : [vert, horiz]\n          order.compact.each do |d|\n            ddx, ddy = PrismfallPuzzles::DIRS[d]\n            nx, ny = ev.x + ddx, ev.y + ddy\n  \
        \          next if [nx, ny] == [plx, ply] || _ropes.include?([nx, ny])\n            next if !PrismfallPuzzles.can_shift?(ev, d)\n            ev.direction\
        \ = d\n            PrismfallPuzzles.shift(ev, d)\n            break\n          end\n        end\n      end\n      _plates = [['Plate_272_W', 6, 11], ['Plate_272_E',\
        \ 22, 11]]\n      _heavy = ['Spar_272_W', 'Spar_272_E', 'Boulder_272_W', 'Boulder_272_E'].map { |n| pfp_ev(n) }.compact\n      _plates.each do |pnm, px, py|\n\
        \        _pev = pfp_ev(pnm)\n        $game_self_switches[[272, _pev.id, \"A\"]] = _heavy.any? { |he| he.x == px && he.y == py } if _pev\n      end\n     \
        \ $game_map.need_refresh = true\n      if !$game_switches[341] && !_ropes.include?([plx, ply])\n        _hit = _purs.any? { |pnm, _sx, _sy| ev = pfp_ev(pnm);\
        \ ev && (ev.x - plx).abs + (ev.y - ply).abs <= 1 }\n        if _hit\n          pbSEPlay(\"Battle damage normal\", 85, 100)\n          pfm_shake(3, 10, 8)\n\
        \          $game_variables[340] = $game_variables[340].to_i + 1\n          pbMessage(_INTL(\"Kaito's voice echoes from the iron rafters: \\\"Tagged! Stand\
        \ up. Again.\\\"\"))\n          pbFadeOutIn do\n            _purs.each { |pnm, sx, sy| ev = pfp_ev(pnm); if ev; ev.moveto(sx, sy); ev.direction = 2; end }\n\
        \            _blds.each { |bnm, sx, sy| ev = pfp_ev(bnm); ev.moveto(sx, sy) if ev }\n          ['Plate_272_W', 'Plate_272_E'].each { |pnm| _pe = pfp_ev(pnm);\
        \ $game_self_switches[[272, _pe.id, \"A\"]] = false if _pe }\n            $game_player.moveto(14, 18)\n            $game_player.direction = 8\n          \
        \  $game_player.straighten\n            $game_map.need_refresh = true\n          end\n          PrismfallPuzzles.reset_trail\n        end\n      end\n   \
        \ end\n  end\nend"}
