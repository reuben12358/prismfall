- type: event
  name: Apprentice Wenlow
  at: [4, 16]
  pages:
  - graphic: {sprite: WENLOW, dir: up}
    trigger: action
    move: fixed
    commands:
    - {script: "loop do\n  s = $game_variables[330].to_i\n  b = $game_variables[331].to_i\n  rem = 10 - $game_variables[332].to_i\n  sa = $game_switches[331]\
        \ ? \"DONE\" : \"Needs 1\"\n  bb = $game_switches[332] ? \"OPEN!\" : \"#{$game_variables[333].to_i}/7\"\n  cmds = [_INTL(\"Check status\"), _INTL(\"\
        Reset flasks & filter\"), _INTL(\"Ask for a hint\")]\n  cmds.push(_INTL(\"Skip room (puzzleskip)\")) if $game_switches[301]\n  cmds.push(_INTL(\"\
        Back to work\"))\n  ch = pbMessage(_INTL(\"Wenlow: Mind your mask! Sir says I'll run this place one day — I say not till I can carry a tray! [3F:{1}\
        \ 5F:{2} Filter:{3}/10 | A:{4} | B:{5}]\", s, b, rem, sa, bb), cmds, cmds.length)\n  case ch\n  when 0\n    pbMessage(_INTL(\"Wenlow: 3-Flask={1}/3,\
        \ 5-Flask={2}/5, Filter={3}/10 steps left. Socket A: {4}. Basin B: {5}.\", s, b, rem, sa, bb))\n  when 1\n    $game_variables[330] = 0\n    $game_variables[331]\
        \ = 0\n    $game_variables[332] = 0\n    $game_variables[334] = $game_variables[334].to_i + 1\n    pbFadeOutIn do\n      $game_player.moveto(4,\
        \ 13)\n      $game_player.turn_right\n    end\n    pbMessage(_INTL(\"Wenlow: Fresh filter cartridge and rinsed flasks — your delivered Socket A\
        \ & Basin B doses stayed safe!\"))\n    break\n  when 2\n    t = $game_variables[334].to_i\n    if t == 0\n      pbMessage(_INTL(\"Wenlow (Hint\
        \ 1/3): You can pour between flasks at the island trays, sir lets me — you can only FILL at this west tap! And always hit the glowing filter station\
        \ on Island A!\"))\n    elsif t == 1\n      pbMessage(_INTL(\"Wenlow (Hint 2/3): Basin B adds up cumulatively! On trip two, fill both flasks at\
        \ the tap so they hold 2 + 5 = 7 together, refill on Island A, then pour both into Basin B!\"))\n    else\n      pbMessage(_INTL(\"Wenlow (Hint\
        \ 3/3): Trip 1: Fill 3 -> Pour 3 to 5 -> Fill 3 -> Pour 3 to 5 (3-Flask holds 1!). Cross to Island A, pour 1 into Socket A, refill filter, return!\
        \ Trip 2: Make 2 in 3-Flask (Fill 5->3, Tip 3, 5->3), then Fill 5 (you carry 2 + 5!). Cross to A, refill filter, cross to B, pour BOTH flasks =\
        \ 7!\"))\n    end\n    $game_variables[334] = t + 1\n  when 3\n    if $game_switches[301]\n      $game_switches[331] = true\n      $game_switches[332]\
        \ = true\n      $game_variables[333] = 7\n      $game_map.need_refresh = true\n      pbSEPlay(\"Anim/HealBell\", 85, 100)\n      pbMessage(_INTL(\"\
        Wenlow: All dosed! Both the east sluice gate and north Arena bridge are open!\"))\n    end\n    break\n  else\n    break\n  end\nend"}
