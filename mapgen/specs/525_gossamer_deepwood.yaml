- type: event
  name: Crystal silk
  at: [41, 20]
  pages:
  - graphic: {sprite: pf_silk_curtain, dir: left}
    dir_fix: true
    commands:
    - if: pf_choice(:ch2_tamsin)
      then:
      - You hold up Mother Loom's shuttle. The crystal silk unpicks itself, thread by thread, and lets you through.
      - {script: '$game_self_switches[[548, 0, ''ESCORT'']] = true'}
      - selfswitch: [A, true]
      else: ['Silk turned to glass, hard as a pane. Something beyond it is ringing. Tamsin might know how to open it.']
  - cond: {self: A}
    through: true
- type: event
  name: Shelly
  at: [15, 26]
  pages:
  - graphic: {sprite: NPC 11, dir: left}
    commands:
    - if: $game_self_switches[[525, 0, 'MASQ']]
      then:
      - '\pf[SHELLY,neutral]Shelly: You just... walked in. Where I''m from, nobody walks into the sick places and comes out the same.'
      - '\pf[SHELLY,happy]Shelly: Before I go, could we have one practice battle? Doubles? I''m supposed to be good at this and I don''t want to be rusty
        when I get home.'
      - {script: 'Prismfall.cameo_battle(:FESTIVAL_SHELLY, "Shelly", 1, double: true, field: :SILKWOOD)'}
      - '\pf[SHELLY,happy]Shelly: Your forest sounds like home used to, before the city got sick. Look after it?'
      - {script: 'pbReceiveItem(:SILVERPOWDER)'}
      - {script: 'tm = GameData::Item.keys.find { |k| d = GameData::Item.get(k); d.is_TM? && d.move == :STRUGGLEBUG }

          tm ? pbReceiveItem(tm) : pbMessage(_INTL("You received a TM: Struggle Bug! [item data missing]"))'}
      - switch: [CAMEO_SHELLY_DONE, true]
      - {script: '$game_variables[123] += 1'}
      - (She steps into the pond's reflection and is gone. One pink ribbon floats on the water.)
      - selfswitch: [A, true]
      else:
      - if: $game_self_switches[[525, 0, 'SHELLY']]
        then: ['\pf[SHELLY,sad]Shelly: The pond''s behind that shimmer. I can''t go near it. You can, can''t you?']
        else:
        - (A pink-haired girl is crouched in front of a Caterpie, bowing to it.)
        - '\pf[SHELLY,panic]Shelly: I''m so sorry, was this your leaf? I didn''t know it was your leaf.'
        - '\pf[SHELLY,shocked,sweat]Shelly: Oh! A person! Um. Hello. Is this— this isn''t the Rhodochrine Jungle, is it.'
        - '\pf[SHELLY,sad]Shelly: I looked into a pond at home and then I was looking OUT of this one. That was three days ago. The paths keep re-weaving.'
        - choices: [I'll help you get back.]
          cancel: 1
          branches:
          - - '\pf[SHELLY,happy]Shelly: Really? You don''t have to. I mean please do. I mean thank you.'
            - {script: '$game_self_switches[[525, 0, ''SHELLY'']] = true'}
  - cond: {self: A}
