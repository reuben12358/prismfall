events:
- type: exit
  at: [7, 10]
  link: T590_PC
- type: event
  name: Gale Post Clerk
  at: [3, 6]
  pages:
  - graphic: {sprite: NPC 14, dir: right}
    trigger: action
    commands:
    - 'Gale Post Clerk: Gale Post Express! A letter arrived from Elowen with your name on it — green ink, and three exclamation marks on the envelope.'
    - '"\PN!!! Uncle Rowan was invited to Meridian''s gala in Lumen (the TENTH YEAR OF LIGHT, with AIRSHIPS) and he''s got Warden business, again, so he gave me his
      invitation and said, ''Go and eat their little cakes for me, Juno. All of them.''"'
    - '"He''s never once missed a chance to tell Meridian what he thinks of them. I think he''s being nice to me. He''s been very nice to me lately. It''s a bit worrying."'
    - '"I''m coming down the Prism Falls road. Meet me at the Four Ways on the Crown Road? It''s the inn with the signpost that points at four kingdoms. You can''t
      miss it. FOUR KINGDOMS. — Juno"'
    - '"P.S. The Spewpa evolved. It''s a Vivillon now, and it''s still rude."'
    - if: $game_variables[125] < 1
      then:
      - var: [CH5_STEP, 1]
      - {script: 'pfm_quest(:ch5_eighteen_roads, "Eighteen Roads", "Meet Juno at the Four Ways on Wallshadow Row, then go on to Lumen.")'}
      else: []
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: NPC 14, dir: right}
    trigger: action
    commands: ['Gale Post Clerk: No fresh mail from Elowen yet. The Four Ways inn is east over the Icefall Locks and along Coppice Ride!']
- type: mart
  name: Center Supply Clerk
  at: [11, 6]
  sprite: NPC 19
  dir: left
  greeting: 'Supply Clerk: Meridian''s company store outside only takes scrip, so the League Center keeps real coin supplies right here. What do you need?'
  items: [POKEBALL, GREATBALL, NETBALL, SUPERPOTION, HYPERPOTION, ANTIDOTE, PARALYZEHEAL, ICEHEAL, SUPERREPEL, ESCAPEROPE]
- type: event
  name: Lock Road Traveler
  at: [4, 8]
  pages:
  - graphic: {sprite: NPC 20, dir: up}
    trigger: action
    move: fixed
    commands: ['Traveler: Climbing the Icefall Locks on foot is a haul, friend. If you''ve got an Electric-type — or a spare Cell Battery from the old Sluiceworks
        — the lift-boy outside can wake the frozen Ice Elevator!', 'Traveler: And keep warm by the stove. Isenmar frost doesn''t let go till you crest the top lock
        into Elowen.']
