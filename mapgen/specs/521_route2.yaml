- type: warp
  name: To Gossamer Wood
  at: [0, 10]
  link: R2_WOOD
  arrive: [1, 10, right]
- type: warp
  name: To Gossamer Wood 2
  at: [0, 9]
  to: {map: 524, x: 22, y: 56, dir: up}
- type: warp
  name: To Gossamer Wood 3
  at: [0, 11]
  to: {map: 524, x: 24, y: 56, dir: up}
- type: warp
  name: To the Glassed Orchard
  at: [61, 23]
  link: R2_ORCHARD
  arrive: [60, 23, left]
- type: warp
  name: To the Glassed Orchard 2
  at: [61, 22]
  to: {map: 522, x: 2, y: 37, dir: right}
- type: sign
  at: [43, 44]
  text: 'ROUTE 2

    Briarwick ahead. Travelers are reminded that the Gossamer Wood is the Crown''s forest and the Warden''s care. Litterers will be woven into something.'
- type: event
  name: Accord barrier 1
  at: [3, 9]
  pages:
  - graphic: {tile: 22960}
    trigger: action
    commands: ['Accord Guard: Hold. Quarantine order: nobody leaves the Landing without papers.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {tile: 22960}
    trigger: action
    commands:
    - 'Accord Guard: Hold. Quarantine order: nobody leaves the Landing without papers.'
    - 'Accord Guard: ...You''ve got a Badge Case. A challenger. Right. Challengers pass, that''s older law than the quarantine.'
    - 'Accord Guard: "Eighteen in Concord, One in Keeping." On you go.'
    - &id001 {se: Door exit}
    - The guard drags the barrier off the road.
    - {script: '$game_self_switches[[521, 0, ''BAR'']] = true; $game_map.need_refresh = true'}
  - cond: {switch: CH1_ORCHARD_DONE}
    through: true
    commands:
    - {comment: gone once the barrier is lifted (see page 4 script condition)}
