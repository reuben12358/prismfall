- type: event
  name: Accord guard
  at: [4, 8]
  pages:
  - graphic: {sprite: NPC 07, dir: down}
    commands: ['Accord Guard: Hold. Quarantine order: nobody leaves the Landing without papers.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: NPC 07, dir: down}
    commands: ['Accord Guard: Hold. Quarantine order: nobody leaves the Landing without papers.', 'Accord Guard: ...You''ve got a Badge Case. A challenger.
        Right. Challengers pass, that''s older law than the quarantine.', 'Accord Guard: "Eighteen in Concord, One in Keeping." On you go.']
- type: event
  name: Accord guard (aside)
  at: [7, 8]
  pages:
  - graphic: {sprite: NPC 07, dir: right}
    commands: ['Second Guard: Nobody past. Orders came down this morning.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: NPC 07, dir: right}
    commands: ['Second Guard: (low) That''s the null one from the dock. Captain said let them through, whatever happens.', 'Accord Guard: Which captain?',
      'Second Guard: Didn''t say. Came down from Crownhaven with a white seal on it.', '\pf[ACCORD_GUARD,deadpan,sweat,Accord guard](They notice you listening.)',
      '\pf[ACCORD_GUARD,deadpan,sweat,Accord guard (aside)](Both of them, very interested in the sky.)', 'Accord Guard: Lovely weather.']
- type: trainer
  at: [31, 16]
  sight: 4
  dir: down
  sprite: trainer_BUGCATCHER
  trainer: [BUGCATCHER, Wim]
  intro: I'm going to be Warden of Briarwick!
  after: '...Assistant Warden.'
- type: trainer
  at: [50, 19]
  sight: 4
  dir: left
  sprite: trainer_PICNICKER
  trainer: [PICNICKER, Ada]
  intro: My Budew sneezes pollen when it's nervous. It's nervous now.
  after: Bless you. Bless both of us.
- type: trainer
  at: [10, 12]
  sight: 3
  dir: right
  sprite: trainer_CAMPER
  trainer: [CAMPER, Joss]
  intro: Trainers have to battle when their eyes meet! It's in the Accord. Probably.
  after: The wood's just west. Mind the silk walls.
- type: npc
  name: Meridian Surveyor
  at: [35, 19]
  sprite: trainer_SCIENTIST
  dir: left
  text: 'Meridian Surveyor: Mind the orange flags. Survey line for the new Lattice. Straight through to the wood. Trees aren''t in the plan, but trees rarely
    are.'
- type: npc
  name: Hay-cart Driver
  at: [54, 24]
  sprite: NPC 25
  dir: down
  text: 'Hay-cart Driver: Used to take me a day to Briarwick and back. Now the east road''s all glass and I go round. Day and a half. Glass doesn''t pay
    my horse.'
- type: npc
  name: Coll (Headbutt tutor)
  at: [33, 39]
  sprite: NPC 03
  dir: down
  commands:
  - 'Coll: Want your partner to learn to headbutt trees? Things fall out. Usually Pokémon. Once, a boot.'
  - {script: 'pbMoveTutorChoice(:HEADBUTT)'}
- type: event
  name: Juno flags 1
  at: [57, 21]
  pages:
  - cond: {switch: CH1_ORCHARD_DONE}
    trigger: touch
    commands:
    - if: $game_self_switches[[521, 0, 'FLAG']]
      then: []
      else:
      - '\pf[JUNO,neutral]Juno: These weren''t here in winter. They go right toward the Glasswood. That''s... probably fine?'
      - {script: '$game_self_switches[[521, 0, ''FLAG'']] = true'}
