- type: sign
  name: Loyal Three shrine
  post: false
  text: 'A stone shrine: three carved beasts, a dog, a monkey and a pheasant, standing over a broken ogre mask. Someone keeps it swept.'
  at: [21, 8]
- type: event
  name: Old woman at the shrine
  pages:
  - commands: []
    trigger: action
    move: fixed
    through: true
  - commands:
    - 'A stone shrine: three carved beasts, a dog, a monkey and a pheasant, standing over a broken ogre mask. An old woman in a grey shawl is sweeping it.
      She is barefoot.'
    - 'Old Woman: Three loyal hounds and an ogre so bold...'
    - 'Old Woman: ...but who was the thief, when the story was told?'
    - choices: ['Who was?', That's not how the story goes., '...']
      branches:
      - ['Old Woman: Oh, I couldn''t say. I could sing it, but I couldn''t say.']
      - ['Old Woman: Isn''t it? I''ve only ever told it true. That''s the trouble with me.']
      - ['Old Woman: Quiet. Good. You''ll hear more that way. Most of it''s under the floor.']
      cancel: 3
    - 'Old Woman: You''ve no color on you, child. Did you know? Like water in a glass.'
    - 'Old Woman: Walk carefully. Eighteen roads is a long way, and people will want to carry you.'
    - She goes back to sweeping.
    trigger: action
    move: fixed
    graphic: {sprite: NPC 28, dir: up}
    cond: {switch: GLOAMING_DISGUISED_CELESTINE}
  at: [22, 9]
- type: event
  name: Dusk petal
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - if: '!pfm?(:dusk_petal)'
      then:
      - A single dusk-colored flower lies on the shrine.
      - {script: 'pfm_item(:DUSKPETAL, 1, "Dusk Petal")'}
      - It's only open at twilight. It's open now. It's noon.
      - {script: 'pfm_set(:dusk_petal)'}
      else: [The old woman is gone. The shrine has been swept very clean.]
    trigger: action
    move: fixed
    cond: {self: A}
  at: [23, 8]
- type: event
  name: Lattice pylon
  pages:
  - commands:
    - if: pf_choice(:ch2_tamsin) == :keep_secret
      then: ['A finished brass pylon, humming. A plate reads: MERIDIAN CONCORD — LATTICE 15 (BRIARWICK) — "Light for Everyone." The grass around it has
          gone stiff as spun sugar for three yards.']
      else:
      - if: pf_choice(:ch2_tamsin)
        then: ['The half-built pylon stands where it stood. A new chalk line marks a smaller footing, well off the grove.']
        else: ['Half a brass pylon. A plate reads: MERIDIAN CONCORD — LATTICE 15 (BRIARWICK) — "Light for Everyone." It is faintly warm, and the grass around
            it is stiff, like spun sugar.']
    trigger: action
    move: fixed
  at: [69, 30]
