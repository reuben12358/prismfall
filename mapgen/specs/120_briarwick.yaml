events:
- type: warp
  name: To Gossamer Wood
  link: WOOD_BRIAR
  arrive: [35, 62, up]
  at: [35, 63]
- type: warp
  name: To Gossamer Wood b
  to: {map: 524, x: 25, y: 1, dir: down}
  at: [36, 63]
- type: event
  name: Arrival
  pages:
  - commands:
    - 'A village lashed between tree trunks: rope bridges, treetop houses, bolts of silk drying like flags. At the east edge, orange survey flags march
      to a half-built brass pylon.'
    - move:
        who: Juno (arrival)
        route:
        - graphic: [trainer_RIVAL2, 0, 8, 0]
        - {opacity: 255}
        wait: true
    - '\pf[JUNO,happy,sparkle,Juno (arrival)]Juno: Briarwick! Smell that? That''s mulberry and lanolin and— oh, the egg-seller''s open. I''ll find you at
      the gym! Don''t start without me! Or do! I''ll catch up!'
    - move:
        who: Juno (arrival)
        route:
        - through_on
        - up
        - up
        - up
        - up
        - up
        - up
        - {opacity: 0}
        wait: true
    - if: $player.badge_count == 0
      then:
      - switch: [GLOAMING_DISGUISED_CELESTINE, true]
    - selfswitch: [A, true]
    trigger: autorun
    move: fixed
  - commands: []
    trigger: action
    move: fixed
    cond: {self: A}
  at: [34, 62]
- type: event
  name: Juno (arrival)
  pages:
  - commands: []
    trigger: action
    move: fixed
    through: true
  at: [36, 61]
- type: event
  name: Stage manager
  pages:
  - commands:
    - {script: "if $player.badge_count >= 1\n  $game_switches[@@GLOAMING_DISGUISED_CELESTINE] = false if $game_switches[@@GLOAMING_DISGUISED_CELESTINE]\n\
        \  pbSetSelfSwitch(%EV[Dusk petal]%, \"A\", true)\nend\npbSetSelfSwitch(%EV[Charcoal child]%, \"A\", true) if $game_switches[@@CH2_MATRIARCH_DONE]\
        \ && !pfm?(:ch2_close)"}
    - {erase: true}
    trigger: parallel
    move: fixed
  at: [37, 62]
- type: sign
  name: Loomhouse sign
  post: true
  text: 'LOOMHOUSE GYM. WARDEN: Old Mother Loom (painted over) TAMSIN LOOM.

    "A thread holds because it''s twisted with others."'
  at: [38, 16]
- type: event
  name: Old woman at the shrine
  pages:
  - commands: []
    trigger: action
    move: fixed
    through: true
  - commands:
    - 'A stone shrine: three carved beasts, a dog, a monkey and a pheasant, standing over a broken ogre mask. An old woman in a grey shawl is sweeping it.
      She is barefoot.'
    - 'Old Woman: Three loyal hounds and an ogre so bold...'
    - 'Old Woman: ...but who was the thief, when the story was told?'
    - choices: ['Who was?', That's not how the story goes., '...']
      branches:
      - ['Old Woman: Oh, I couldn''t say. I could sing it, but I couldn''t say.']
      - ['Old Woman: Isn''t it? I''ve only ever told it true. That''s the trouble with me.']
      - ['Old Woman: Quiet. Good. You''ll hear more that way. Most of it''s under the floor.']
      cancel: 3
    - 'Old Woman: You''ve no color on you, child. Did you know? Like water in a glass.'
    - 'Old Woman: Walk carefully. Eighteen roads is a long way, and people will want to carry you.'
    - She goes back to sweeping.
    trigger: action
    move: fixed
    graphic: {sprite: NPC 28, dir: up}
    cond: {switch: GLOAMING_DISGUISED_CELESTINE}
  at: [24, 15]
- type: sign
  name: Loyal Three shrine
  post: false
  text: 'A stone shrine: three carved beasts, a dog, a monkey and a pheasant, standing over a broken ogre mask. Someone keeps it swept.'
  at: [23, 14]
- type: event
  name: Dusk petal
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - if: '!pfm?(:dusk_petal)'
      then:
      - A single dusk-colored flower lies on the shrine.
      - {script: 'pfm_item(:DUSKPETAL, 1, "Dusk Petal")'}
      - It's only open at twilight. It's open now. It's noon.
      - {script: 'pfm_set(:dusk_petal)'}
      else: [The old woman is gone. The shrine has been swept very clean.]
    trigger: action
    move: fixed
    cond: {self: A}
  at: [25, 14]
- type: event
  name: Lattice pylon
  pages:
  - commands:
    - if: pf_choice(:ch2_tamsin) == :keep_secret
      then: ['A finished brass pylon, humming. A plate reads: MERIDIAN CONCORD — LATTICE 15 (BRIARWICK) — "Light for Everyone." The grass around it has
          gone stiff as spun sugar for three yards.']
      else:
      - if: pf_choice(:ch2_tamsin)
        then: ['The half-built pylon stands where it stood. A new chalk line marks a smaller footing, well off the grove.']
        else: ['Half a brass pylon. A plate reads: MERIDIAN CONCORD — LATTICE 15 (BRIARWICK) — "Light for Everyone." It is faintly warm, and the grass around
            it is stiff, like spun sugar.']
    trigger: action
    move: fixed
  at: [68, 30]
- type: sign
  name: Survey flags
  post: false
  text: Orange cloth on stakes. Four of the stakes have been neatly cut. The cuts are very clean. A weaver's shears.
  at: [66, 33]
- type: event
  name: Pylon watch 1
  pages:
  - commands:
    - if: pfm?(:met_tamsin) && !$game_switches[@@CH2_THISTLE_DONE]
      then:
      - {script: pfm_dusk(30)}
      - Night. Two grey-cowled figures in carved bark masks are cutting survey stakes with shears. A third stands at the pylon with a hand flat on the brass.
      - move:
          who: Bereaved 1
          route:
          - graphic: [trainer_CHANNELER, 0, 4, 0]
          - {opacity: 255}
          wait: false
      - move:
          who: Bereaved 2
          route:
          - graphic: [trainer_CHANNELER, 0, 6, 0]
          - {opacity: 255}
          wait: false
      - move:
          who: Pallbearer Thistle
          route:
          - graphic: [trainer_BURGLAR, 0, 8, 0]
          - {opacity: 255}
          wait: true
      - 'Bereaved: That''s the last of the south line.'
      - '\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: Leave soil where they stood. Bare. Let something rot there for once.'
      - {se: Voltorb Flip mark}
      - Snap. A twig, under your foot.
      - anim: [Bereaved 1, 3]
      - anim: [Bereaved 2, 3]
      - move:
          who: Pallbearer Thistle
          route: [face_player]
          wait: true
      - '\pf[THISTLE,angry,shock,Pallbearer Thistle]Thistle: A watcher. Meridian''s, or the Warden''s?'
      - choices: [Neither., 'Who are you?', '...']
        branches:
        - ['\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: Everyone''s somebody''s. You just haven''t been told whose yet.']
        - ['\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: The Hollow. We mourn what this land was. Somebody has to.']
        - ['\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: No answer. Then I''ll assume the worst. It saves time.']
        cancel: 3
      - '\pf[THISTLE,sad,,Pallbearer Thistle]Thistle: I was a weaver once. Lowmarsh. You won''t find it on a map now. It had looms too.'
