  pages:
  - commands: ['Finch: Fourteen dead this week. They fly east at dusk and come back with glass on their wings. Then they don''t come back.', 'Finch: Meridian
        says the Lattice will "stabilize" it. The line they''ve drawn for it goes straight through my grove.']
    trigger: action
