events:
- type: warp
  name: To Gossamer Wood
  at: [35, 63]
  link: WOOD_BRIAR
  arrive: [35, 62, up]
- type: sign
  at: [38, 17]
  post: false
  name: Gym sign
  text: 'LOOMHOUSE GYM. WARDEN: Old Mother Loom (painted over) TAMSIN LOOM. "A thread holds because it''s twisted with others."'
- type: sign
  at: [20, 32]
  post: false
  name: Gym sign
  text: 'BRIARWICK — Where the Thread Never Tangles. (Carved under it, smaller: "Unlike the Guild Accounts.")'
- type: sign
  at: [38, 31]
  name: Loyal Three shrine
  text: A shrine to the Loyal Three, "who drove the Gossamer Ogre from the wood." Carved ogre masks hang from the eaves.
- type: sign
  at: [33, 30]
  name: Festival poster
  text: 'The same poster as the Landing. Here the dark fleck in the Crown''s stone has been circled in charcoal. Someone has written: "SEE CHAPEL."'
- type: event
  name: Pallbearer Thistle
  at: [63, 33]
  pages:
  - graphic: {sprite: trainer_BURGLAR, dir: left}
    commands:
    - A masked figure is cutting Meridian's orange survey flags, one by one.
    - 'Thistle: You''ll stop me? Lowmarsh had looms too, once.'
    - if: TrainerBattle.start(:HOLLOW_THISTLE, "Thistle")
      then:
      - 'Thistle: ...Ask your Warden what she signed.'
      - The Hollow pallbearer slips away between the trees.
      - switch: [CH2_THISTLE_DONE, true]
      - selfswitch: [A, true]
  - cond: {self: A}
- type: sign
  at: [65, 32]
  name: Lattice pylon
  text: 'Half a brass pylon. A plate reads: MERIDIAN CONCORD — LATTICE 15 (BRIARWICK) — "Light for Everyone." It is faintly warm, and the grass around it
    is stiff, like spun sugar.'
- type: event
  name: Old woman at the shrine
  at: [39, 32]
  pages:
  - cond: {switch: GLOAMING_DISGUISED_CELESTINE}
    graphic: {sprite: NPC 28, dir: up}
    commands: ['An old woman sings softly to the shrine:', '"Three loyal hounds and an ogre so bold - but who was the thief, when the story was told?"',
      She doesn't turn around.]
- type: npc
  name: Gym guide
  at: [34, 17]
  sprite: NPC 01
  dir: down
  text: The Loomhouse is all silk and string. Threads that hold only when twisted together - that's the Warden's whole puzzle.
- type: npc
  name: Meridian liaison
  at: [50, 32]
  sprite: trainer_GENTLEMAN
  dir: left
  text: 'Meridian liaison: Meridian has... arrangements with the Warden. The Lattice will save these groves. Eventually.'
- type: warp
  name: To Gossamer Wood b
  at: [36, 63]
  to: {map: 524, x: 24, y: 1, dir: down}
- type: event
  name: Finch
  at: [22, 30]
  pages:
  - graphic: {sprite: NPC 13, dir: down}
    move: random
    commands: ['Finch: Fourteen dead this week. They fly east at dusk and come back with glass on their wings. Then they don''t come back.', 'Finch: Meridian
        says the Lattice will "stabilize" it. The line they''ve drawn for it goes straight through my grove.']
- type: event
  name: Weaver at loom
  at: [16, 36]
  pages:
  - graphic: &id001 {sprite: NPC 16, dir: down}
    move: fixed
    commands:
    - 'Weaver at loom: Clack-clack. Sixty picks a minute. Don''t talk to me on the downstroke.'
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: *id001
    move: fixed
    commands: ['Weaver at loom: That was the downstroke.']
- type: event
  name: Dyer
  at: [19, 28]
  pages:
  - graphic: {sprite: NPC 15, dir: down}
    move: fixed
    commands: ['Dyer: Elowen green, that''s my vat. The Queen''s own shade. She''s never paid for a yard of it. "The Crown''s by right of soil," says the
        taxman. So''s the mud, I said.']
- type: event
  name: Apprentice
  at: [39, 48]
  pages:
  - graphic: {sprite: NPC 17, dir: down}
    move: random
    commands: ['Apprentice: I wove my first scarf! It''s got eleven mistakes. Tamsin found a twelfth and then apologized for an hour.']
- type: event
  name: Rope-bridge Boy
  at: [30, 33]
  pages:
  - graphic: {sprite: NPC 10, dir: down}
    move: fixed
    commands: ['Rope-bridge Boy: If you jump on the bridge it goes BWOING. I''m not allowed. You''re a grown-up. YOU do it.', 'Boy: HA!', 'Voice below:
        WHO''S JUMPING?!', 'Boy: Coward.']
- type: event
  name: Grandmother knitting
  at: [48, 32]
  pages:
  - graphic: {sprite: NPC 02, dir: down}
    move: fixed
    commands: ['Grandmother knitting: It''s a jumper for my Caterpie. Sixteen sleeves. I''m on the fourth. Don''t rush me.']
- type: event
  name: Silk Merchant
  at: [60, 33]
  pages:
  - graphic: {sprite: trainer_GENTLEMAN, dir: down}
    move: random
    commands: ['Silk Merchant: Briarwick silk never tangles and never rots. That''s why nobody ever buys a second one. Terrible business. Wonderful product.']
- type: event
  name: Meridian Linesman
  at: [36, 26]
  pages:
  - graphic: &id002 {sprite: trainer_SCIENTIST, dir: down}
    move: fixed
    commands:
    - 'Meridian Linesman: Pylon''ll be humming by month''s end. Free light for the looms! Folk here look at me like I''m selling plague.'
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: *id002
    move: fixed
    commands: ['Meridian Linesman: Truth is, I don''t know what it does to the wood. I just bolt the brass.']
- type: event
  name: Tired Mother
  at: [44, 48]
  pages:
  - graphic: {sprite: NPC 17, dir: down}
    move: fixed
    commands: ['Tired Mother: Three nights running somebody''s cut the survey flags. I''m not saying who. I''m saying I slept very well through it.']
- type: event
  name: Old Man on bridge
  at: [34, 34]
  pages:
  - graphic: {sprite: NPC 09, dir: down}
    move: random
    commands: ['Old Man on bridge: The Loyal Three drove the Ogre out of this wood. My grandfather told me. His grandfather told him. Nobody''s grandfather
        SAW it, mind.']
- type: event
  name: Girl in ogre mask
  at: [36, 44]
  pages:
  - graphic: {sprite: NPC 16, dir: down}
    move: fixed
    commands: ['Girl in ogre mask: RAAH! I''m the Gossamer Ogre! I steal children and eat looms!', 'Boy in dog mask: And I''m a Loyal Hound and I bite you!
        ...Why does the Ogre mask look sad?']
- type: event
  name: Egg-seller
  at: [28, 46]
  pages:
  - graphic: {sprite: NPC 22, dir: down}
    move: fixed
    commands: ['Egg-seller: Silk-moth eggs, a copper each. That loud girl bought forty. FORTY. For her uncle, she says.']
- type: event
  name: Tax-barge Deserter
  at: [39, 30]
  pages:
  - graphic: {sprite: trainer_SAILOR, dir: down}
    move: random
    commands: ['Tax-barge Deserter: I rowed the Queen''s tax-barge. Jumped off at Saltmere when they booed us. Weaving''s quieter. Nobody boos a scarf.']
- type: event
  name: Accord Chaplain
  at: [34, 18]
  pages:
  - graphic: {sprite: trainer_GENTLEMAN, dir: down}
    move: fixed
    commands: ['Accord Chaplain: The chapel''s open. The mural''s older than the looms. Mind the Crown in it — people say it''s painted wrong. It isn''t.
        It''s painted *before*.']
- type: event
  name: Youngster
  at: [56, 40]
  pages:
  - graphic: {sprite: trainer_YOUNGSTER, dir: down}
    move: fixed
    commands: ['Youngster: The Warden cries in the gym at night. I heard her through the wall. Then she apologized to the wall.']
- type: event
  name: Woman with basket
  at: [50, 45]
  pages:
  - graphic: {sprite: NPC 17, dir: down}
    move: random
    commands: ['Woman with basket: East wood rings like a bell now. My mother says a ringing wood means a wedding. I don''t think this is a wedding.']
- type: event
  name: Cutter's Wife
  at: [23, 21]
  pages:
  - graphic: {sprite: NPC 13, dir: down}
    move: fixed
    commands: ['Cutter''s Wife: You''ll want my husband if there''s a tree in your way. He''ll say no first. He always says no first. Wait for the second
        answer.']
- type: sign
  name: Survey Flags
  at: [62, 30]
  post: true
  text: Orange cloth on stakes. Four of the stakes have been neatly cut. The cuts are very clean. A weaver's shears.
- type: sign
  name: Silk Racks
  at: [23, 26]
  post: true
  text: The silk moves in no wind at all.
