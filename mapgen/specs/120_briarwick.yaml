- type: event
  name: Tamsin (square)
  pages:
  - commands:
    - move:
        who: Tamsin (square)
        route: [toward_player]
        wait: true
    - {se: Player bump}
    - Silk everywhere.
    - anim: [Tamsin (square), 3]
    - '\pf[TAMSIN,panic,shock,Tamsin (square)]Tamsin: Sorry! Sorry — I wasn''t — are you hurt? You''re not hurt. Sorry.'
    - '\pf[TAMSIN,neutral,,Tamsin (square)]Tamsin: You''ve a Badge Case. Oh. Oh no. You''re a challenger. TODAY?'
    - '\pf[TAMSIN,panic,sweat,Tamsin (square)]Tamsin: It''s fine! It''s fine. The gym''s open. It''s just a bit— the moths are— there was a meeting.'
    - '\pf[TAMSIN,neutral,,Tamsin (square)]Tamsin: I''m Tamsin. Loom. The Warden. Since spring. Come to the Loomhouse when you''re ready. Take your time.
      Please take your time.'
    - move:
        who: Tamsin (square)
        route:
        - through_on
        - right
        - right
        - right
        - right
        - right
        - right
        - right
        - {opacity: 0}
