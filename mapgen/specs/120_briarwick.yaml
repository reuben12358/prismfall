- type: event
  name: Pylon watch 1
  pages:
  - commands:
    - if: pfm?(:met_tamsin) && !$game_switches[@@CH2_THISTLE_DONE]
      then:
      - {script: pfm_dusk(30)}
      - Night. Two grey-cowled figures in carved bark masks are cutting survey stakes with shears. A third stands at the pylon with a hand flat on the brass.
      - move:
          who: Bereaved 1
          route:
          - graphic: [trainer_CHANNELER, 0, 4, 0]
          - {opacity: 255}
          wait: false
      - move:
          who: Bereaved 2
          route:
          - graphic: [trainer_CHANNELER, 0, 6, 0]
          - {opacity: 255}
          wait: false
      - move:
          who: Pallbearer Thistle
          route:
          - graphic: [trainer_BURGLAR, 0, 8, 0]
          - {opacity: 255}
          wait: true
      - 'Bereaved: That''s the last of the south line.'
      - '\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: Leave soil where they stood. Bare. Let something rot there for once.'
      - {se: Voltorb Flip mark}
      - Snap. A twig, under your foot.
      - anim: [Bereaved 1, 3]
      - anim: [Bereaved 2, 3]
      - move:
          who: Pallbearer Thistle
          route: [face_player]
          wait: true
      - '\pf[THISTLE,angry,shock,Pallbearer Thistle]Thistle: A watcher. Meridian''s, or the Warden''s?'
      - choices: [Neither., 'Who are you?', '...']
        branches:
        - ['\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: Everyone''s somebody''s. You just haven''t been told whose yet.']
        - ['\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: The Hollow. We mourn what this land was. Somebody has to.']
        - ['\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: No answer. Then I''ll assume the worst. It saves time.']
        cancel: 3
      - '\pf[THISTLE,sad,,Pallbearer Thistle]Thistle: I was a weaver once. Lowmarsh. You won''t find it on a map now. It had looms too.'
      - '\pf[THISTLE,angry,,Pallbearer Thistle]Thistle: Ask your Warden what she signed!'
      - {script: setBattleRule("cannotRun")}
      - if: TrainerBattle.start(:HOLLOW_THISTLE, "Thistle")
        then:
        - '\pf[THISTLE,shocked,,Pallbearer Thistle]Thistle: ...Your partner doesn''t fight like the Wood''s got hold of it. It fights like it''s standing
          nowhere at all.'
        - '\pf[THISTLE,neutral,,Pallbearer Thistle]Thistle: Let the land grieve, child. And look at the grass by that pylon in daylight.'
        - move:
            who: Bereaved 1
            route:
            - through_on
            - right
            - right
            - {opacity: 0}
            wait: false
        - move:
            who: Bereaved 2
            route:
            - through_on
            - right
            - right
            - {opacity: 0}
            wait: false
        - move:
            who: Pallbearer Thistle
            route:
            - through_on
            - right
            - right
            - right
            - {opacity: 0}
            wait: true
        - The three vanish into the trees. A bark mask is left on the ground.
        - {script: 'pfm_item(:BARKMASK, 1, "Bark Mask")'}
        - Carved to look like the Gossamer Ogre. It does look sad.
        - switch: [CH2_THISTLE_DONE, true]
        - {script: pfm_day(30)}
        else:
        - {script: pfm_day(10)}
    trigger: touch
    move: fixed
  at: [63, 30]
