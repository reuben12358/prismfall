  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - 'Child: I circled it. The Crown in the chapel''s got a whole stone. This one''s got a bit gone. See?'
    - 'Child: Mum says the Crown got hurt once.'
    - 'Child: How do you hurt a crown?'
    - {wait: 20}
    - Your hand moves, unprompted, to your chest.
    - {wait: 40}
    - {script: 'pfm_set(:ch2_close)'}
    - selfswitch: [B, true]
    trigger: action
    move: fixed
    graphic: {sprite: NPC 08, dir: up}
    cond: {self: A}
  - commands: ['Child: How do you hurt a crown? Nobody will tell me.']
    trigger: action
    move: fixed
