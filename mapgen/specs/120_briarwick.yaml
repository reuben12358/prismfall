    - if: pfm?(:sleeves_done)
      then: ['Grandmother: Sixteen sleeves. I''m on the fifth. Don''t rush me.']
      else:
      - if: pfm_quest?(:sixteen_sleeves)
        then:
        - if: $bag.quantity(:TINYMUSHROOM) >= 3
          then:
          - {script: '$bag.remove(:TINYMUSHROOM, 3)'}
          - You hand over three Tiny Mushrooms.
          - 'Grandmother: Lovely. Smells dreadful. Here, I made this one first. It was meant for a Weedle. He evolved. Ungrateful.'
          - {script: 'pfm_item(:SILKSCARF, 1)'}
          - Two sleeves. A Kakuna has no use for it.
          - {script: 'pfm_set(:sleeves_done)'}
          - {script: 'pfm_quest_done(:sixteen_sleeves)'}
          else:
          - 'Grandmother: Three Tiny Mushrooms. From the wood. Green dye doesn''t boil itself.'
          - {script: 'pbMessage(_INTL("({1} of 3.)", [$bag.quantity(:TINYMUSHROOM), 3].min))'}
        else:
        - if: pfm?(:gran_talked)
          then:
          - 'Grandmother: I''ve run out of green. The dyer won''t sell me less than a bolt. Fetch me three Tiny Mushrooms from the wood and I''ll boil my
            own.'
          - {script: 'pfm_quest(:sixteen_sleeves, "Sixteen Sleeves", "Bring three Tiny Mushrooms (0/3).")'}
          else:
          - 'Grandmother: It''s a jumper for my Caterpie. Sixteen sleeves. I''m on the fourth. Don''t rush me.'
          - {script: 'pfm_set(:gran_talked)'}
    trigger: action
