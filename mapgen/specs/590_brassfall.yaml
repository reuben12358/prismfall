- type: event
  name: Lockmaster Garrow
  at: [19, 17]
  pages:
  - graphic: {sprite: NPC 25, dir: left}
    trigger: action
    move: fixed
    commands: ['Lockmaster Garrow: Zenith engineers cut every lock on these falls to the millimeter. If the river stutters, take it up with the Spire —
        not me.']
- type: event
  name: Union Steward Gunnhild
  at: [17, 17]
  pages:
  - graphic: {sprite: NPC 21, dir: right}
    trigger: action
    move: fixed
    commands: ['Union Steward Gunnhild: Scrip''s only good at Meridian''s store, and the company store doesn''t sell boots that last an Isenmar winter.',
      'Union Steward Gunnhild: If you haul anything strange off the sled road, bring it up to our Union Boiler on the upper terrace.']
- type: sign
  name: Company Store Sign
  at: [28, 28]
  post: false
  text: MERIDIAN COMPANY STORE — SCRIP ONLY.
- type: event
  name: Company Store Clerk
  at: [32, 28]
  pages:
  - graphic: {sprite: NPC 14, dir: down}
    trigger: action
    move: fixed
    commands: ['Store Clerk: Scrip only. ...You haven''t got scrip.', 'Store Clerk: Nobody who isn''t from here has scrip.', 'Store Clerk: I''ve sold one
