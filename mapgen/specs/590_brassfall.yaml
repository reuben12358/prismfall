    commands: ['Ice-cutter: Lumen''s getting a gala and we''re getting frostbite.', 'Ice-cutter: That''s the Lock Road for you. Everything goes uphill.']
- type: sign
  name: Union Notice Board
  at: [16, 10]
  post: false
  text: 'UNION NOTICE BOARD: "SOLIDARITY WITH THE EBB GUILD." · "SCRIP IS NOT MONEY." · "LOST: one (1) Mudsdale. Answers to Mudsdale."'
- type: event
  name: Union Steam Boiler
  at: [18, 10]
  pages:
  - trigger: action
    commands:
    - if: pfm_has?(:ICEBOUNDSATCHEL) && !pfm_has?(:HEATCONTRACT)
      then:
      - You prop the Ice-Bound Satchel against the roaring brass boiler. Meltwater hisses and drips for a long time until the clasp pops free.
      - {script: 'pfm_take(:ICEBOUNDSATCHEL)

          pfm_item(:HEATCONTRACT, 1, "HEAT CONTRACT (DRAFT)")'}
      - 'HEAT CONTRACT (DRAFT): "MERIDIAN CONCORD — HEAT SUPPLY CONTRACT 7-B (DRAFT). Party B: the Dominion of Ashkaar. Terms identical to Contract 7 (Isenmar)."
        Penciled in the margin: "Don''t let the Thane see B."'
      - 'Union Steward Gunnhild: (reading over your shoulder) Contract Seven. That''s ours. That''s what keeps Rimeholt''s children warm.'
      - 'Union Steward Gunnhild: And this is the same contract. Word for word. For Ashkaar. They''re selling the same fire to both of them.'
      - 'Union Steward Gunnhild: Keep that. Don''t show it to an Isenmar man with a drink in him. Or an Ashkaar man with a sword. Or anybody, really.'
      else: [A massive cast-iron union boiler heating the whole upper terrace. Snow melts three feet back from its firebox.]
- type: sign
  name: Ice Elevator Board
  at: [30, 10]
  post: false
  text: BRASSFALL ICE ELEVATOR — OUT OF ORDER SINCE THE STRIKE. Motor requires live spark or Cell Battery.
- type: event
  name: The Ice Elevator
  at: [32, 9]
  pages:
  - trigger: action
    commands:
    - if: pfm?(:brassfall_elevator)
      then:
      - The brass Ice Elevator hums on its rail, cables thawed clean. Ride up to the top of the Icefall Locks?
      - choices: [Ride to the top, Not now]
        cancel: 2
        branches:
        - - {se: Door exit}
          - transfer: {map: 581, x: 14, y: 18, dir: down}
        - []
      else:
      - A brass lift-cage frozen solid to its rail.
      - if: $player.party.any? { |p| p && !p.egg? && p.hasType?(:ELECTRIC) }
        then:
        - Your Electric-type Pokémon could jolt the frozen motor awake!
        - choices: [Let your Pokémon jolt it, Leave it]
          cancel: 2
          branches:
          - - {se: Anim/Thunder1}
            - {script: 'pfm_set(:brassfall_elevator)'}
            - Sparks dance down the brass rail! The cage shakes off its sheath of ice and grinds smoothly to life — the shortcut to the top of the Icefall
              Locks is open!
          - []
        else:
        - if: pfm_has?(:CELLBATTERY)
          then:
          - You have a Cell Battery in your bag. Slot it into the lift motor?
          - choices: [Use Cell Battery, Keep it]
            cancel: 2
            branches:
            - - {se: Anim/Thunder1}
              - {script: 'pfm_take(:CELLBATTERY)

                  pfm_set(:brassfall_elevator)'}
              - The Cell Battery clicks home! The cage shudders free of the ice — the shortcut to the top of the Icefall Locks is open!
            - []
          else: [The motor is dead cold. An Electric-type Pokémon — or a spare Cell Battery — could jump-start it.]
- type: event
  name: Lift-boy
  at: [33, 10]
  pages:
  - graphic: {sprite: NPC 09, dir: left}
    trigger: action
    commands:
    - if: pfm?(:brassfall_elevator)
      then: ['Lift-boy: It goes all the way to the top of the Locks!', 'Lift-boy: Don''t tell the union I fixed a Meridian lift. Don''t tell Meridian the
          union let me.']
      else: ['Lift-boy: It runs off a Cell, and Meridian took the Cells back when the union walked out.', 'Lift-boy: Give the motor a jolt and it''ll go.
          Anything with a spark in it — or a Cell Battery from the old Sluiceworks.']
