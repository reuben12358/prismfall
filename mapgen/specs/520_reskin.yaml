  at: [18, 62]
  text: 'THE FERRYMEN'S MILE

    Ferrow''s Landing - Hale''s Bramble - Windfall Row.

    Mind the hedges. The hedges mind you.'
  post: false
- type: trainer
  at: [13, 50]
  sight: 4
  dir: down
  sprite: trainer_YOUNGSTER
  trainer: [YOUNGSTER, Pim]
  intro: A trainer! With a real partner! Fight me, I've got a Bidoof and a dream!
  after: The dream's fine. The Bidoof needs a minute.
- type: trainer
  at: [19, 38]
  sight: 4
  dir: left
  sprite: trainer_LASS
  trainer: [LASS, Dory]
  intro: My Fletchling only knows Tackle and judgment.
  after: It's judging me now.
- type: npc
  name: Farmhand
  at: [23, 46]
  sprite: NPC 03
  dir: down
  move: random
  text: 'Farmhand: Tall grass is where the wild ones are. Juno''ll tell you their Latin names. Nobody asked her to learn those.'
- type: event
  name: Juno tutorial
  at: [9, 54]
  pages:
  - cond: {switch: CH1_K1_DONE}
    trigger: touch
    commands:
    - if: $game_self_switches[[520, 0, 'TUT']]
      then: []
      else:
      - '\pf[JUNO,happy]Juno: Catching tutorial! Weaken it, then throw. Don''t throw the Ball AT it, throw it NEAR it.'
      - '\pf[JUNO,happy]Juno: I learned that the hard way. Sorry, Biscuit.'
      - {script: 'pbReceiveItem(:POKEBALL, 5)'}
      - {script: '$game_self_switches[[520, 0, ''TUT'']] = true'}
