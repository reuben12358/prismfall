- type: sign
  at: [31, 50]
  post: false
  name: Scarecrow
  text: It's wearing a Meridian linesman's cap. Somebody has a sense of humor.
- type: sign
  at: [31, 25]
  post: false
  name: Lookout board
  text: 'GULLWATCH LOOKOUT

    On a clear day you can see the Dovetail turn for home.'
- type: sign
  at: [12, 11]
  post: false
  name: Waystone
  text: A waystone, older than the lane. EIGHTEEN IN CONCORD, it says. The last line has been chiselled off.
- type: sign
  at: [13, 40]
  post: false
  name: Old well
  text: A dry well. Something small has made a nest of ferry tickets at the bottom.
