- type: event
  name: Professor Larch
  at: [14, 56]
  pages:
  - commands: []
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: trainer_PROFESSOR, dir: down}
    commands:
    - if: $game_self_switches[[520, 0, 'CH2']]
      then: []
      else:
      - '\pf[LARCH,neutral]Larch: Eighteen gyms. Briarwick''s first, up through the Gossamer Wood. The Warden''s a girl called Tamsin Loom. Go easy on her,
        she inherited the seat in spring and hasn''t slept since.'
      - '\pf[LARCH,neutral]Larch: Write to me. I mean it. Gale Post, every town. If I don''t hear from you in a week I start Lecture Two by post.'
      - '\pf[JUNO,happy]Juno: I''m coming as far as Briarwick! Uncle Rowan wants silk-moth eggs, and I want to see a gym!'
      - &id001 {script: 'pbReceiveItem(:TOWNMAP)'}
      - (Larch has drawn a skull on the Glassed Orchard, and a smaller skull on her own kettle.)
      - 'QUEST: "Eighteen Roads" - Earn the first badge in Briarwick.'
      - &id002 {script: '$game_variables[102] = 2 if $game_variables[102] < 2'}
      - &id003 {script: 'ev = $game_map.events.values.find { |e| e.name == ''Professor Larch'' }

          $game_self_switches[[520, ev.id, ''A'']] = true if ev

          $game_map.need_refresh = true'}
      - {script: '$game_self_switches[[520, 0, ''CH2'']] = true'}
  - cond: {self: A}
    commands: []
