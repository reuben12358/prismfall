- type: event
  name: Apprentice Nadim
  at: [17, 22]
  pages:
  - graphic: {sprite: NPC 13, dir: left}
    trigger: action
    move: fixed
    commands:
    - {script: "m1 = $game_variables[325].to_i % 3\nm2 = $game_variables[326].to_i % 3\ns1 = (m1 == 0 ? \"Lane A (hard crust)\" : (m1 == 1 ? \"Lane B (hard\
        \ crust)\" : \"Canyon wall (A & B soft)\"))\ns2 = (m2 == 0 ? \"Lane D (hard crust)\" : (m2 == 1 ? \"Canyon wall (C & D soft)\" : \"Lane C (hard\
        \ crust)\"))\ncmds = [_INTL(\"Check sun-mirrors\"), _INTL(\"Reset sun-mirrors\"), _INTL(\"Ask for a hint\")]\ncan_skip = ($game_switches[301] ==\
        \ true)\ncmds.push(_INTL(\"Skip puzzle (puzzleskip)\")) if can_skip\ncmds.push(_INTL(\"Leave it\"))\nc = pbMessage(_INTL(\"Aide Nadim: Sun hardens,\
        \ shade sinks! Need a hand reading the lanes?\"), cmds, cmds.length)\nif c == 0\n  pbMessage(_INTL(\"Mirror 1 (West Terrace): {1}.\\nMirror 2 (East\
        \ Terrace): {2}.\", s1, s2))\nelsif c == 1\n  if pbConfirmMessage(_INTL(\"Swing both sun-mirrors back to start (Lane A and Lane D lit)?\"))\n  \
        \  pbSEPlay(\"Strength push\", 85, 100)\n    pbFadeOutIn do\n      $game_variables[325] = 0\n      $game_variables[326] = 0\n      $game_player.moveto(14,\
        \ 21)\n      $game_player.turn_up\n      $game_map.need_refresh = true\n    end\n    pbMessage(_INTL(\"Both sun-mirrors swung back to start: Lane\
        \ A (west) and Lane D (northeast) are sun-hardened crust!\"))\n  end\nelsif c == 2\n  h = (pfm_get(:g5_hint).to_i rescue 0)\n  if h == 0\n    pbMessage(_INTL(\"\
        Nadim (Hint 1): Sahar says the dig taught her more than the dunes ever did. Every soft sand lane drops you into a sealed gallery below — with its\
        \ own ladder back up!\"))\n  elsif h == 1\n    pbMessage(_INTL(\"Nadim (Hint 2): Lane C's mirror is over on the east terrace. Walk west across Lane\
        \ A, then step into soft Lane C on purpose and see where the tunnel beneath it leads!\"))\n  else\n    pbMessage(_INTL(\"Nadim (Full Solution):\
        \ 1) Walk west across lit Lane A to the West Terrace. 2) Step into soft Lane C to drop into the Under-Dig tunnel, follow it east, and climb Ladder\
        \ Hc up to the East Terrace. 3) Rotate Mirror 2 TWICE (D -> Wall -> C) so Lane C hardens! 4) Step into soft Lane B to drop and climb back to this\
        \ plaza. 5) Walk Lane A -> Lane C -> Warden Sahar's stairs!\"))\n  end\n  (pfm_set(:g5_hint, [h + 1, 2].min) rescue nil)\nelsif can_skip && c ==\
        \ 3\n  pbSEPlay(\"Mining reveal\", 90, 100)\n  $game_variables[325] = 0\n  $game_variables[326] = 2\n  $game_map.need_refresh = true\n  pbMessage(_INTL(\"\
        Nadim signals the mirror crew! Both Lane A and Lane C are now baked solid — walk straight west and north to Warden Sahar!\"))\nend"}
