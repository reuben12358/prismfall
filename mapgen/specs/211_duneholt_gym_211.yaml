- type: event
  name: Sun-Mirror M1
  at: [3, 12]
  pages:
  - graphic: {tile: 23029}
    trigger: action
    commands:
    - {script: "cur = $game_variables[325].to_i % 3\ncur_lbl = case cur\nwhen 0 then \"Lane A (southwest)\"\nwhen 1 then \"Lane B (southeast)\"\nwhen 2\
        \ then \"the bare canyon wall\"\nelse \"Wall\"\nend\nc = pbMessage(_INTL(\"Sun-Mirror M1 is aimed at {1}.\", cur_lbl),\n              [_INTL(\"\
        Rotate sun-mirror\"), _INTL(\"Leave it\")], 2)\nif c == 0\n  nxt = (cur + 1) % 3\n  pbSEPlay(\"Strength push\", 85, 105)\n  pbSEPlay(\"Mining reveal\"\
        , 70, 120)\n  $game_variables[325] = nxt\n  $game_map.need_refresh = true\n  msg = case nxt\nwhen 0 then \"Sunlight floods Lane A! Its sand bakes\
        \ into firm golden crust — Lane B goes soft in the shade.\"\nwhen 1 then \"Sunlight pivots east across Lane B! Lane B hardens into crust while Lane\
        \ A sinks back into shade.\"\nwhen 2 then \"The mirror tilts into the sandstone wall — both Lane A and Lane B fall into shade and turn soft!\"\n\
        \  else \"The beam sweeps harmlessly onto bare canyon sandstone.\"\n  end\n  pbMessage(_INTL(\"{1}\", msg))\nend"}
- type: event
  name: Sun-Mirror M2
  at: [25, 12]
  pages:
  - graphic: {tile: 23029}
    trigger: action
    commands:
    - {script: "cur = $game_variables[326].to_i % 3\ncur_lbl = case cur\nwhen 0 then \"Lane D (northeast cistern)\"\nwhen 1 then \"the bare canyon wall\"\
        \nwhen 2 then \"Lane C (northwest arena approach)\"\nelse \"Wall\"\nend\nc = pbMessage(_INTL(\"Sun-Mirror M2 is aimed at {1}.\", cur_lbl),\n   \
        \           [_INTL(\"Rotate sun-mirror\"), _INTL(\"Leave it\")], 2)\nif c == 0\n  nxt = (cur + 1) % 3\n  pbSEPlay(\"Strength push\", 85, 105)\n\
        \  pbSEPlay(\"Mining reveal\", 70, 120)\n  $game_variables[326] = nxt\n  $game_map.need_refresh = true\n  msg = case nxt\nwhen 0 then \"Sunlight\
        \ pours down Lane D! The path to the northeast cistern bakes solid — Lane C turns soft in the shade.\"\nwhen 1 then \"The mirror swings against\
        \ the sandstone cliff — both Lane C and Lane D fall into shade and turn soft!\"\nwhen 2 then \"A blinding sunbeam locks onto Lane C! Its sand hardens\
        \ into bright golden crust all the way to the north terrace!\"\n  else \"The beam sweeps harmlessly onto bare canyon sandstone.\"\n  end\n  pbMessage(_INTL(\"\
        {1}\", msg))\nend"}
