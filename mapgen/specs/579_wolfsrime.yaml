- type: sign
  name: Road sign
  at: [40, 6]
  text: THE WOLFSRIME -- the old drove road, unkept since the North Gate road was blazed. ^ The Rimewood. v Frostwick Pass, by the snow bank (no way back
    up). No blazes. Mind the wolves.
  post: false
- type: event
  name: The hanging bell
  at: [42, 34]
  pages:
  - trigger: action
    commands:
    - A drover's bell hangs from a birch bough, rimed white. You give it a tap.
    - {se: Voltorb Flip tile}
    - It rings once, small and clear. Somewhere off in the trees, something answers.
- type: event
  name: Cold kiln
  at: [20, 44]
  pages:
  - trigger: action
    commands: ['An old charcoal kiln, cold for years. A Snom has made itself a nest in the flue and is not leaving.']
- type: event
  name: Old drover
  at: [22, 47]
  pages:
  - graphic: {sprite: NPC 03, dir: down}
    trigger: action
    move: fixed
    commands: ['Old drover: My da drove sheep down this road to the Pass every autumn. Then they blazed the North Gate road and this one went to the wolves.',
      'Old drover: The bank at the bottom''s the quick way to the Pass. Quick down, mind. You''ll not get back up it.']
- type: event
  name: Drovers' bothy
  at: [60, 74]
  pages:
  - trigger: action
    commands:
    - The drovers' bothy. Someone has left kindling, dry, and a pot of something that was soup.
    - You rest by the fire a while.
    - {heal: true}
- type: event
  name: Old wolf trap
  at: [56, 58]
  pages:
  - trigger: action
    commands: ['An old wolf trap, rusted open. Something chewed through the chain a long time ago.']
- type: event
  name: Birch fork
  at: [31, 67]
  pages:
  - trigger: action
    commands: [A wolf's skull wedged high in a birch fork. Someone has put a Pecha Berry in its mouth. It looks almost cheerful.]
- type: event
  name: Drover's grandson
  at: [46, 59]
  pages:
  - graphic: {sprite: NPC 25, dir: down}
    trigger: action
    move: fixed
    commands: ['Boy: Grandda says there''s a den off the road where the wolves used to sleep. There''s a scratch on a birch where you leave the path. A
        big one.']
- type: event
  name: Clawed birch
  at: [46, 28]
  pages:
  - trigger: action
    commands: ['Four long claw-scratches on a birch, old and healed over. They point off the road, into the trees.']
- type: event
  name: The old den
  at: [62, 18]
  pages:
  - trigger: action
    commands: ['(A hollow under a fallen giant, lined with old bones and older fur. Nothing has slept here for years except, apparently, mushrooms.)']
