  name: Woodward
  at: [8, 8]
  pages:
  - graphic: {sprite: trainer_HIKER, dir: down}
    commands:
    - 'Woodward: Past my hut it''s all glass. I''ve stopped chopping. You can''t burn it and it cuts the axe.'
