events:
- type: exit
  at: [9, 13]
  link: BW_PC
- type: event
  name: Trainer
  pages:
  - commands: ['Trainer: The gym''s all planks and looms. Pull the wrong lever and the floor leaves. I''ve met the basement twice.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 20, dir: down}
  at: [5, 10]
- type: event
  name: Gale Post desk
  pages:
  - commands:
    - if: $game_switches[@@CH2_MATRIARCH_DONE] && pfm?(:ch2_close) && !pfm?(:gale2)
      then:
      - GALE POST. A letter is waiting.
      - '"Heard about the Hollow. Lecture Two enclosed. It is nine pages. Page nine says I''m proud of you. Do not skip to page nine. — I.L."'
      - {script: 'pfm_set(:gale2)'}
      - var: [STORY_CHAPTER, 3]
      else:
      - if: '!pfm?(:gale1)'
        then:
        - GALE POST. A letter is waiting.
        - '"Lecture Two is drafted. Do not make me send it. Eat something. — I.L."'
        - {script: 'pfm_item(:POTION, 2)'}
        - {script: 'pfm_item(:KELPTEABAG, 1, "Kelp Tea Bag")'}
        - You could throw it away. You don't.
        - {script: 'pfm_set(:gale1)'}
        else: ['GALE POST. Write to Tidewatch Station, Ferrow''s Landing. Larch reads every letter twice and answers half.']
    trigger: action
    move: fixed
  at: [6, 6]
take_events:
- template: pokecenter
  name: Nurse
  at: [9, 5]
  replace_text: {'\rHello, and welcome to the Pokémon Center.': '\rWe heal for free. The scanner at the door is new. It told me I''m "Insect, Briarwick". I''ve lived
      here forty years, I''d worked it out.'}
  prepend:
  - if: $player.party_count == 0
    then:
    - \rOh, you don't have one yet! Come back when you do. I'll act surprised.
    - {exit: true}
- template: pokecenter
  name: Healing balls
  at: [11, 5]
- template: pokecenter
  name: PC
  at: [5, 5]

