- type: event
  name: Retired Weaver
  pages:
  - commands: ['Retired Weaver: I wove Old Mother Loom''s shroud. She''d picked the pattern at thirty. "Plan ahead," she said. Tamsin plans ahead too. She plans for
        everything to go wrong.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 10, dir: down}
  at: [8, 8]
- type: sign
  name: Bookshelf
  post: false
  text: '"A Child''s Pageant of the Loyal Three." The last page, where the Ogre is driven out, has been torn away. Someone has drawn the Ogre a little house instead.'
  at: [9, 5]
- type: sign
  name: Loom
  post: false
  text: A narrow tape loom, threaded with a shroud pattern half a century old. Nobody has woven on it since spring.
  at: [3, 8]
- type: sign
  name: Chapel mural
  post: false
  text: Eighteen colored stones falling from a white sky into green land. Above them, a silver crown with one clear stone. The stone is whole.
  at: [29, 5]
- type: event
  name: Child in pew
  pages:
  - commands: ['Child: Mum says the Crown got hurt once. She says don''t ask the chaplain. So I''m asking you.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 07, dir: up}
  at: [28, 9]
- type: sign
  name: Chapel window
  post: false
  text: Eighteen panes of colored glass around one clear pane. The clear one has no lead around it, as if it were added first.
  at: [33, 5]

