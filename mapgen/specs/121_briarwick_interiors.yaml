events:
- type: exit
  at: [10, 14]
  link: BW_GUILD
- type: event
  name: Hett
  pages:
  - commands:
    - if: $game_switches[@@CH2_MATRIARCH_DONE] && pfm?(:ledger_read) && !pfm?(:hett_reward)
      then:
      - 'Hett: From the guild''s teaching chest. Old Mother Loom would''ve wanted a stranger to have it. She never trusted us with it.'
      - {script: pfm_money(2000)}
      - {script: 'pfm_item(:TMSTRINGSHOT, 1, "TM String Shot")'}
      - {script: 'pfm_set(:hett_reward)'}
      - {script: 'pfm_quest_done(:locked_ledger)'}
      else:
      - if: $player.badge_count >= 1
        then: ['Hett: She signed WHAT? Alone? ...Poor fool child. Her gran would''ve made the whole village sign it with her, and then it''d be all our fault. That''s
            what a guild''s FOR.']
        else:
        - if: pfm?(:ledger_read) && !pfm?(:ledger_told)
          then:
          - 'Hett: ...Alone. She signed it alone. Don''t say anything yet. Let me think how to say it kindly. I''m out of practice.'
          - {script: 'pfm_set(:ledger_told)'}
          else:
          - if: pfm?(:hett_talked) && !pfm_quest?(:locked_ledger)
            then:
            - 'Hett: You''re a stranger, so you can do what I can''t. The guild ledger''s in the Warden''s loft and it''s locked. Old Mother Loom kept the key in
              the gym. "Where the first thread starts," she used to say.'
            - {script: 'pfm_quest(:locked_ledger, "The Locked Ledger", "Find the ledger key in the Loomhouse.")'}
            else:
            - if: pfm_quest?(:locked_ledger)
              then: ['Hett: Where the first thread starts. In the Loomhouse. Mind the planks.']
              else:
              - 'Hett: Old Mother Loom ran this guild forty years and never once missed a moth-count. The girl''s missed three.'
              - 'Hett: I''m not saying she''s hiding something. I''m saying the ledger''s locked and it never used to be.'
              - {script: 'pfm_set(:hett_talked)'}
    trigger: action
    move: fixed
    graphic: {sprite: NPC 14, dir: down}
  at: [8, 7]
- type: event
  name: Apprentice (guild)
  pages:
  - commands: ['Apprentice: The loft is the Warden''s. We''re not to go up. I go up to look at the moths'' tally board. Don''t tell Hett.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 24, dir: right}
  at: [12, 10]
- type: sign
  name: Moth tally board
  post: false
  text: A board of chalk tallies, one column per morning. The last column has fourteen strokes, and then the chalk was pressed so hard it snapped.
  at: [4, 5]
- type: sign
  name: Silk bolts
  post: false
  text: Bolts of Briarwick silk, every shade of green. None of them has ever tangled. Somebody has labelled one "THE QUEEN'S (UNPAID)".
  at: [3, 11]
- type: event
  name: Loft manager
  pages:
  - commands:
    - {script: 'pbSetSelfSwitch(%EV[Tamsin (loft)]%, "A", true) if $player.badge_count >= 1 && pf_choice(:ch2_tamsin).nil?'}
    - {erase: true}
    trigger: parallel
    move: fixed
  at: [17, 12]
- type: event
  name: Guild ledger
  pages:
  - commands:
    - if: pfm?(:ledger_read)
      then: ['The last page: "Received of the Meridian Concord, for stewardship rights, Lattice 15: ₽400,000. Signed, T. Loom, Warden." The line for "Guild witnesses"
          is blank.']
      else:
      - if: pfm_has?(:LEDGERKEY)
        then:
        - The brass key turns.
        - 'LEDGER, last page: "Received of the Meridian Concord, for stewardship rights, Lattice 15: ₽400,000. Signed, T. Loom, Warden."'
        - One signature. The line for "Guild witnesses" is blank.
        - {script: 'pfm_set(:ledger_read)'}
        else: [The guild ledger. It's locked. It never used to be.]
    trigger: action
    move: fixed
  at: [28, 6]
- type: event
  name: Tamsin (loft)
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - 'The loft: a ledger open on a table, a contract with a gold sunburst seal. Tamsin won''t sit.'
    - if: pfm?(:ledger_read)
      then: ['\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: You''ve read it. Hett has too. I can tell by how gently she''s speaking to me.']
    - '\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: That masked woman at the pylon. She was right. I signed it.'
    - '\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: Briarwick''s bankrupt. It has been for three years. Gran hid it. I found the accounts the week I buried her.'
    - '\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: Meridian offered four hundred thousand for "stewardship rights". One pylon. Free light. I signed it by myself, at night,
      so nobody would have to know how bad it was.'
    - '\pf[TAMSIN,crying,,Tamsin (loft)]Tamsin: And now the Glasswood''s walking up the survey line like it was invited. Fourteen moths this week. I count them. I
      count them every morning.'
    - '\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: The guild meets tonight. Tell me what to do. Please. I''ve run out of thread.'
    - choices: [Tell them the truth. I'll stand next to you., 'They deserve to know. If you won''t say it, I will.', It's your secret. I won't tell.]
      branches:
      - - {script: 'pf_choose(:ch2_tamsin, :help_confess)'}
        - '\pf[TAMSIN,shocked,,Tamsin (loft)]Tamsin: Next to me. Not in front?'
        - '\pf[TAMSIN,neutral,,Tamsin (loft)]Tamsin: ...A thread holds because it''s twisted with others. I''ve had that on the SIGN.'
        - tone: [-255, -255, -255, 0, 20]
        - {wait: 24}
        - The guild meeting. Tamsin speaks. Her voice cracks twice.
        - 'Hett: Then we sign it WITH you, girl, and then we tear it up together.'
        - 'The contract is renegotiated: a smaller pylon, off the grove.'
        - tone: [-8, 8, -18, 0, 20]
        - {wait: 20}
      - - {script: 'pf_choose(:ch2_tamsin, :expose)'}
        - '\pf[TAMSIN,panic,,Tamsin (loft)]Tamsin: No— wait— not like—'
        - tone: [-255, -255, -255, 0, 20]
        - {wait: 24}
        - The guild meeting. You lay the contract on the table. Uproar. The looms stop.
        - Tamsin stands very still, then tears the contract in half herself, in front of them.
        - '\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: I''m sorry. I''m so sorry. That''s the last time I''ll say it tonight.'
        - tone: [-8, 8, -18, 0, 20]
        - {wait: 20}
      - - {script: 'pf_choose(:ch2_tamsin, :keep_secret)'}
        - '\pf[TAMSIN,sad,,Tamsin (loft)]Tamsin: ...Thank you. I think. I''ll fix it quietly. I''ll find the money somewhere.'
      cancel: 0
    - '\pf[TAMSIN,neutral,,Tamsin (loft)]Tamsin: Whatever''s making the wood ring, it''s in Cocoonfall Hollow, at the Glasswood''s heart. I can''t cross the Veil.
      Nobody can.'
    - move:
        who: Juno (loft)
        route:
        - graphic: [trainer_RIVAL2, 0, 8, 0]
        - {opacity: 255}
        wait: true
    - '\pf[JUNO,neutral,,Juno (loft)]Juno: ...They can.'
    - '\pf[TAMSIN,shocked,shock,Tamsin (loft)]Tamsin: What?'
    - '\pf[TAMSIN,neutral,,Tamsin (loft)]Tamsin: Then take this. It was Gran''s shuttle. It''s only wood. But she never dropped a thread while she held it.'
    - {script: 'pfm_item(:MOTHERLOOMSSHUTTLE, 1, "Mother Loom''s Shuttle")'}
    - Worn smooth by fifty years of one hand.
    - {script: 'pfm_quest(:ringing_wood, "The Ringing Wood", "Cut through the Deepwood to Cocoonfall Hollow.")'}
    - selfswitch: [B, true]
    trigger: action
    move: fixed
    graphic: {sprite: trainer_LASS, dir: down}
    cond: {self: A}
  - commands: ['\pf[TAMSIN,neutral]Tamsin: Cocoonfall Hollow. Through the Deepwood. The Cutter will open the way. ...Come back, will you?']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_LASS, dir: down}
    cond: {self: B}
  at: [30, 6]
