        \  pf_trial_talk(:PG_JUNO_BRIDE_TREE)\nelsif $game_switches[125]\n  pbMessage(_INTL(\"Juno: Look at the blossoms now, \\PN — they're finally resting instead\
        \ of bursting.\"))\n  if $game_switches[182]\n    pbMessage(_INTL(\"Juno: Ever since you played Venam's recording for me, I sit here every dawn and tell Aunt\
        \ Elin what happened in the city. The petals fall when I finish.\"))\n  else\n    pbMessage(_INTL(\"Juno: The Quiet Way says the roots carry voices all the\
        \ way down to the Listening Root. Sometimes I leave a bouquet against the bark just to see if she hums back.\"))\n  end\n  pbMessage(_INTL(\"Juno: Uncle Rowan's\
        \ postscript said: 'Water Elin at dawn. She likes it before the bees are up.' I haven't missed a morning yet.\"))\nelse\n  pbMessage(_INTL(\"Juno: You've\
        \ heard about her. Everyone has. This is Aunt Elin — AF 288.\"))\n  pbMessage(_INTL(\"Juno: Uncle Rowan walked me up here every dawn for twelve years and\
        \ watered her roots. Sometimes I think she's listening. Isn't that stupid?\"))\n  if $game_switches[182]\n    pbMessage(_INTL(\"Juno: ...Wait — that recording\
        \ from Mirefen? She could hear everything while she was stone? ...Oh. Oh, Aunt Elin.\"))\n  end\nend"}
