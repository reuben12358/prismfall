- type: sign
  name: Mural I — The Gilded King
  at: [9, 18]
  post: false
  text: 'MURAL I: A king in gold on a throne under a sun, one hand raised as if weighing the sky itself. Below him, white domes and a harbour. His face
    has been scratched out with a chisel — all but the corner of a smile they missed. (Sahar''s note: ''He isn''t praying. He''s giving the sun an order.'')'
- type: sign
  name: Mural II — Year of Two Weathers
  at: [17, 16]
  post: false
  text: 'MURAL II: Two titans tearing at the land — one red rising out of the earth with fire in its back, one blue rising out of the sea with the tide
    in its arms. Between them, tiny armies hold golden chains along what is now Ossaria''s western Dry Tide.'
- type: sign
  name: Mural III — The Eighteen-Lit Beast
  at: [34, 18]
  post: false
  text: 'MURAL III: A great beast ringed by eighteen coloured lights, bound in a chain of eighteen golden locks held by the tiny figure of the golden king.
    Unown letters shift across the frame — spelling a warning someone tried to bury.'
- type: sign
  name: Mural IV — The Falling Lights
  at: [18, 6]
  post: false
  text: 'MURAL IV: The great beast breaking apart — eighteen lights falling out of it like coloured rain while the golden city tips towers-first into the
    sea. Three hundred years later, Zenith was built on its roof.'
