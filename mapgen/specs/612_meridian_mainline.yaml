- type: event
  name: Directorate Checkpoint Officer
  at: [56, 33]
  pages:
  - graphic: {sprite: trainer_MERIDIAN_DIRECTORATE, dir: down}
    trigger: action
    move: fixed
    commands:
    - {script: "pbMessage(_INTL(\"Directorate Officer: Mandate checkpoint. Papers and tint. Hand on the scanner plate.\"))\npbMessage(_INTL(\"Drover (in queue): Two\
        \ weeks ago this was a road.\"))\npbMessage(_INTL(\"Directorate Officer: It's still a road, sir. It's a road with a checkpoint on it.\"))\npbSEPlay(\"Mining\
        \ reveal\", 75, 120)\npbMessage(_INTL(\"(Your turn. You lay your palm on the brass scanner plate... chime — nothing. NULL.)\"))\npbMessage(_INTL(\"Directorate\
        \ Officer: ...Hold on.\"))\npbMessage(_INTL(\"(She turns to a ledger chained to the tent pole and runs a gloved finger down the page. She stops.)\"))\nif\
        \ (pf_choice(:ch5_lowlight_testimony) == :someone_else rescue false)\n  pbMessage(_INTL(\"Directorate Officer: You're flagged. By the Director herself.\"\
        ))\n  pbMessage(_INTL(\"Directorate Officer: 'Do not obstruct. Report movements.' That's all it says.\"))\n  pbMessage(_INTL(\"Directorate Officer: So I'm\
        \ not obstructing you. And I'm reporting that you went east toward Ossaria. Have a nice trip.\"))\nelse\n  pbMessage(_INTL(\"Directorate Officer: You're on\
        \ the Chair's guest list. Gala, Lumen.\"))\n  pbMessage(_INTL(\"Directorate Officer: ...You were THERE?\"))\n  pbMessage(_INTL(\"Directorate Officer: Go on\
        \ through. And — I'm sorry. About the Lowlight.\"))\n  pbMessage(_INTL(\"Directorate Officer: My sister's on the Spire feeds. She was off that night. She's\
        \ not been off since.\"))\nend\npbSEPlay(\"Strength push\", 85, 100)\npbMessage(_INTL(\"(The brass barrier swings up across the service road.)\"))\npbMessage(_INTL(\"\
        Drover (behind you): Oh, very nice. Very fair. Some of us have been here since six.\"))\n$game_switches[576] = true\n$game_variables[126] = 2 if $game_variables[126].to_i\
        \ < 2\n$game_map.need_refresh = true"}
