        - - {script: 'pf_choose(:ch4_teo, :keep_secret)'}
          - 'Marisol Reyes: I owe you. I won''t forget it.'
        - - {script: 'pf_choose(:ch4_teo, :confront)'}
          - 'Marisol Reyes: He''s my brother! He''s - he''s nineteen and furious and he''s RIGHT about the river!'
      - switch: [CH4_TEO_MET, true]
      - selfswitch: [A, true]
