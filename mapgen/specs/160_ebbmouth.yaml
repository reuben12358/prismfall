  - {type: sign, at: [24, 33], text: "EBBMOUTH\nWhere the Ebb meets the sea. Southern port of Isenmar."}
  - {type: sign, at: [27, 36], text: "MERIDIAN TIDAL LATTICE - UNIT 2\nPowering Isenmar's future. Keep off the intake."}
  - {type: npc, name: Ice-fisher, at: [10, 34], sprite: trainer_FISHERMAN, dir: up,
     text: "\u266a Sleep, old whale, under the ice... When the whale wakes, the sea remembers it's a sea. \u266a"}
  - {type: npc, name: Guild striker, at: [16, 30], sprite: NPC 03, dir: down, move: random,
     text: "Ebb Guild: Thane Eirik taxes our catch, Meridian lays us off. And the river stops dead for minutes now!"}
  - {type: npc, name: Dockworker, at: [36, 34], sprite: trainer_SAILOR, dir: left,
     text: "Watch the mill-wheels. When the Ebb stutters they freeze mid-turn and we all hold our breath."}
  - type: event
    name: Teo
    at: [31, 36]
    pages:
      - cond: {switch: CH4_K2_DONE}
        graphic: {sprite: trainer_BURGLAR, dir: down}
        commands:
          - "Night. The river has stopped. A child's boat drifts toward the stalled mill-race - and a Hollow cell is spiking the Lattice."
          - "Marisol vaults the rail beside you: \"Get the kid! I'll take the - Teo?!\""
          - "Teo Reyes: Stay out of it, sis. You too, ferry kid."
          - if: 'TrainerBattle.start(:HOLLOW_TEO, "Teo")'
            then:
              - "The boat is safe. Teo backs toward the dark water. Marisol... lets him run."
              - "She sees that you saw."
              - choices: ["Report Teo to Meridian", "Keep Marisol's secret", "Confront her privately"]
                cancel: 0
                branches:
                  - [{script: "pf_choose(:ch4_teo, :report)"}, "Marisol Reyes: ...Do what you have to."]
                  - [{script: "pf_choose(:ch4_teo, :keep_secret)"}, "Marisol Reyes: I owe you. I won't forget it."]
                  - [{script: "pf_choose(:ch4_teo, :confront)"}, "Marisol Reyes: He's my brother! He's - he's nineteen and furious and he's RIGHT about the river!"]
              - {switch: [CH4_TEO_MET, true]}
              - {selfswitch: [A, true]}
      - cond: {self: A}
