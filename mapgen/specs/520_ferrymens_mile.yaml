- type: event
  name: Stile send-off 1
  at: [16, 99]
  pages: &id002
  - commands: []
  - cond:
      var: [STORY_CHAPTER, 2]
    trigger: touch
    commands:
    - if: pfm?(:ch2_sendoff)
      then: []
      else: &id003
      - '\pf[LARCH,neutral,,Professor Larch]Larch: Eighteen gyms. Saltmere''s first. The forest road to Briarwick''s corded off -- the Glasswood''s walked
        across it -- so you go round by the coast.'
      - '\pf[LARCH,neutral,,Professor Larch]Larch: Two days on foot. Chalk cliffs, then dunes, then the free port. The Warden''s Dorian Pell. He''ll call
        you "darling" and mean it about a third of the time.'
      - '\pf[LARCH,neutral,,Professor Larch]Larch: Write to me. I mean it. Gale Post, every town. If I don''t hear from you in a week I start Lecture Two
        by post.'
      - '\pf[JUNO,happy]Juno: I''m coming as far as Saltmere! Mum''s promised forty tarts to the Pageant crowd and I''m the cart!'
      - '\pf[JUNO,happy]Juno: And I''ve wanted to see the Pageant since I was six. There''s a bit where the Plates fall and they use REAL glitter.'
      - '\pf[LARCH,deadpan,,Professor Larch]Larch: They use salt.'
      - '\pf[JUNO,shocked,shock]Juno: ...Why would you tell me that.'
      - {script: 'pfm_item(:TOWNMAP, 1, "Town Map")'}
      - (Larch has drawn a skull on the Glassed Orchard, a skull on the forest road, and a smaller skull on her own kettle.)
      - {script: 'pfm_quest(:eighteen_roads, "Eighteen Roads", "Earn the first badge in Saltmere, west along the coast.")'}
      - {script: '$game_variables[102] = 2 if $game_variables[102] < 2'}
      - {script: 'pfm_set(:ch2_sendoff)'}
      - {script: 'ev = $game_map.events.values.find { |e| e.name == ''Professor Larch'' }

          $game_self_switches[[520, ev.id, ''A'']] = true if ev

          $game_map.need_refresh = true'}
