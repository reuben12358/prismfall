- type: event
  name: Accord guard
  at: [5, 71]
  pages:
  - graphic: {sprite: NPC 07, dir: down}
    commands: ['Accord Guard: Hold. Quarantine order: nobody leaves the Landing without papers.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: NPC 07, dir: right}
    commands: ['Accord Guard: Hold. Quarantine order: nobody leaves the Landing without papers.', 'Accord Guard: ...You''ve got a Badge Case. A challenger.
        Right. Challengers pass, that''s older law than the quarantine.', 'Accord Guard: "Eighteen in Concord, One in Keeping." On you go. Saltmere''s two
        days west. Mind the cliff path in wind.']
- type: event
  name: Accord guard (aside)
  at: [6, 77]
  pages:
  - graphic: {sprite: NPC 07, dir: up}
    commands: ['Second Guard: Nobody past. Orders came down this morning.']
  - cond: {switch: CH1_ORCHARD_DONE}
    graphic: {sprite: NPC 07, dir: right}
    commands: ['Second Guard: (low) That''s the null one from the dock. Captain said let them through, whatever happens.', 'Accord Guard: Which captain?',
      'Second Guard: Didn''t say. Came down from Crownhaven with a white seal on it.', '\pf[ACCORD_GUARD,deadpan,sweat,Accord guard](They notice you listening.)',
      'Accord Guard: Lovely weather.']
- type: event
  name: The Hale Bell
  at: [16, 70]
  pages:
  - trigger: action
    commands: ['THE HALE BELL: A ship''s bell on a post above the sea cliff. The ferrymen rang it once the last boat was in.', A cloth has been tied round
        the clapper., '\pf[JUNO,sad]Juno: Dad tied that. The night they closed the strait. He said there wasn''t anything left to ring for.']
- type: event
  name: Hay-cart Driver
  at: [26, 70]
  pages:
  - graphic: {sprite: NPC 11, dir: down}
    trigger: action
    move: fixed
    commands: ['Hay-cart Driver: Used to take me four hours to Briarwick and back by the forest road.', 'Hay-cart Driver: Now it''s all glass and I go round
        by Saltmere. Two days. Glass doesn''t pay my horse.']
