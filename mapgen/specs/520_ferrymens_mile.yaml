- type: event
  name: Juno tutorial 1
  at: [20, 89]
  pages: &id001
  - cond: {switch: CH1_K1_DONE}
    trigger: touch
    commands:
    - if: $game_self_switches[[520, 0, 'TUT']]
      then: []
      else:
      - '\pf[JUNO,happy]Juno: Catching tutorial! Weaken it, then throw. Don''t throw the Ball AT it, throw it NEAR it.'
      - '\pf[JUNO,happy]Juno: I learned that the hard way. Sorry, Biscuit.'
      - {script: 'pbReceiveItem(:POKEBALL, 5)'}
      - {script: '$game_self_switches[[520, 0, ''TUT'']] = true'}
- type: event
  name: Juno tutorial 2
  at: [21, 89]
  pages: *id001
- type: event
  name: Juno tutorial 3
  at: [22, 89]
  pages: *id001
- type: event
  name: Juno tutorial 4
