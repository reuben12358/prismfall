- type: trainer
  at: [52, 36]
  sight: 4
  dir: down
  sprite: trainer_ROCKER
  trainer: [ROCKER, Jax]
  intro: 'Jax: Hear that hum? The whole Mile''s wired to Lumen''s Neon Grid! Electric moves sing out here—let''s crank it up!'
  after: 'Jax: Lamp 47 flickered. That threw me off. That''s my story.'
- type: trainer
  at: [62, 46]
  sight: 4
  dir: up
  sprite: trainer_JUGGLER
  trainer: [JUGGLER, Fitch]
  intro: 'Fitch: Watch the glow, watch the hands! A hundred arc lamps and not a shadow to hide in!'
  after: 'Fitch: A hundred lamps to light and I drop it at this one.'
- type: trainer
  at: [79, 36]
  sight: 4
  dir: down
  sprite: trainer_BEAUTY
  trainer: [BEAUTY, Coralie]
  intro: 'Coralie: Waiting on the Lumen Tramway is terribly dull—care to entertain me while Stop 3 stays empty?'
  after: 'Coralie: The tram''s never coming, is it. Neither is my win.'
- type: trainer
  at: [41, 17]
  sight: 4
  dir: right
  sprite: trainer_SCIENTIST
  trainer: [SCIENTIST, Morley]
  intro: 'Morley: Remarkable! The residual Neon Grid induction spills fifty yards past the lamps into the apple trees. Hold still for a field test!'
  after: 'Morley: Fascinating. Do that again, slower, so I can write it down.'
