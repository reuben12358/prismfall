- type: event
  name: Lamp 47
  at: [50, 37]
  pages:
  - trigger: action
    commands:
    - Lamp 47. The only dark one on the Mile. The glass is clean. Someone still polishes it.
    - choices: ['Look under the base plate?', Leave it.]
      cancel: 2
      branches:
      - - 'The plate unscrews. Inside, on a wire, an engineer''s brass tag:'
        - '"No. 47. FAULT: none found. Went dark 23:40, Festival night, AF 290. Every lamp on the Mile dipped at once for nine seconds. 46 came back. 47
          didn''t."'
        - '"Draw spike on every grid in Zenith, same second. Source: not ours?? Refer to Chief Engineer. — L.G."'
        - 'Under it, scratched in another hand: "Referred. Referred again. Stop asking. — Spire."'
        - selfswitch: [A, true]
      - []
  - cond: {self: A}
    trigger: action
    commands: ['Lamp 47. The brass tag is still wired inside the base plate: "Referred. Referred again. Stop asking. — Spire."']
- type: event
  name: Depot Keeper
  at: [50, 16]
  pages:
  - graphic: {sprite: trainer_ENGINEER, dir: down}
    trigger: action
    move: fixed
    commands: ['Depot Keeper: We don''t light them any more. They light themselves. We polish them.', 'Depot Keeper: A lamplighter who only polishes is
        a polisher. I''m keeping the title.']
