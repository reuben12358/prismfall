  sight: 4
  dir: left
  sprite: trainer_PAINTER
  trainer: [PAINTER, Morwenna]
  intro: Red's my color! Red's everyone's color, eventually, if you work the madder vat.
  after: Look at my hands. They'll be red till Fallmorn.
- type: trainer
  at: [60, 10]
  sight: 4
  dir: down
  sprite: trainer_PAINTER
  trainer: [PAINTER, Ash]
  intro: Woad blue. The Queen's Elowen green is woad and weld together. She's never paid for a yard of it.
  after: Bill her. Somebody bill her.
- type: event
  name: Dye Foreman
  at: [54, 19]
  pages:
  - graphic: {sprite: NPC 20, dir: down}
    trigger: action
    commands:
    - if: $game_variables[602] >= 4
      then: ['Dye Foreman: You opened the sluice? In the right order? Which order was it?', (You tell him. He hums it. He hums it wrong.), 'Dye Foreman:
          Tell the bargee the cloth''s ready. She''ll row you down to Saltmere, she owes me.']
      else: ['Dye Foreman: The sluice stones. Step them in the order I hum. Red, blue, yellow. No -- that''s blue, red, yellow.', 'Dye Foreman: I''ve been
          humming it wrong for thirty years and nobody''s told me. The river knows. Ask the river.']
