        \          end\n        end\n      end\n      _plates = [['Plate_273_M1', 22, 9], ['Plate_273_M2', 25, 11]]\n      _heavy = ['Spar_273_M', 'Boulder_273_M'].map\
        \ { |n| pfp_ev(n) }.compact\n      _all_held = true\n      _new_latch = false\n      _plates.each do |pnm, px, py|\n        _held = _heavy.any? { |he| he.x\
        \ == px && he.y == py }\n        _all_held = false if !_held\n        _pev = pfp_ev(pnm)\n        if _pev\n          _was = $game_self_switches[[273, _pev.id,\
        \ \"A\"]]\n          _new_latch = true if _held && !_was\n          $game_self_switches[[273, _pev.id, \"A\"]] = _held\n        end\n      end\n      pbSEPlay(\"\
        Mining iron\", 85, 105) if _new_latch\n      $game_map.need_refresh = true\n      if _all_held && !$game_switches[343]\n        $game_switches[343] = true\n\
        \        pbSEPlay(\"Mining iron\", 95, 90)\n        pfm_shake(3, 10, 10)\n      pfm_flash(100, 170, 255, 10, 140)\n        $game_map.need_refresh = true\n\
        \        pbMessage(_INTL(\"Three hollow knocks sound behind the iron seal... then silence. Blue aura flickers across the stone wall as Kaito's Marrowgate\
        \ Mastery Coffer unlocks!\"))\n      end\n      if !$game_switches[343] && !_ropes.include?([plx, ply])\n        _hit = _purs.any? { |pnm, _sx, _sy| ev =\
        \ pfp_ev(pnm); ev && (ev.x - plx).abs + (ev.y - ply).abs <= 1 }\n        if _hit\n          pbSEPlay(\"Battle damage normal\", 85, 100)\n          pfm_shake(3,\
        \ 10, 8)\n          $game_variables[340] = $game_variables[340].to_i + 1\n          pbMessage(_INTL(\"Kaito's voice echoes from the iron rafters: \\\"Tagged!\
        \ Stand up. Again.\\\"\"))\n          pbFadeOutIn do\n            _purs.each { |pnm, sx, sy| ev = pfp_ev(pnm); if ev; ev.moveto(sx, sy); ev.direction = 2;\
        \ end }\n            _blds.each { |bnm, sx, sy| ev = pfp_ev(bnm); ev.moveto(sx, sy) if ev }\n          ['Plate_273_M1', 'Plate_273_M2'].each { |pnm| _pe =\
        \ pfp_ev(pnm); $game_self_switches[[273, _pe.id, \"A\"]] = false if _pe }\n            $game_player.moveto(22, 18)\n            $game_player.direction = 8\n\
        \            $game_player.straighten\n            $game_map.need_refresh = true\n          end\n          PrismfallPuzzles.reset_trail\n        end\n    \
        \  end\n    end\n  end\nend"}
