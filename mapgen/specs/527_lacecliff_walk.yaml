- type: event
  name: Tide-rock
  at: [64, 44]
  pages:
  - graphic: {sprite: Object rock, dir: down}
    trigger: action
    commands:
    - if: PBDayNight.isNight?
      then:
      - The tide is out. The rock stands in a dry hollow now, and you can squeeze past it.
      - selfswitch: [A, true]
      else: ['The sea fills the gap behind this rock. At low tide, maybe.']
  - cond: {self: A}
