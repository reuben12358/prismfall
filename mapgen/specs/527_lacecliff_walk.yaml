  at: [129, 27]
  pages:
  - trigger: action
    commands: ['ROAD STONE I-b. THE STRAND ROAD. "Ferrow 2, Saltmere 6." Someone has chalked a seventh mile on, for the arches.']
- type: event
  name: Lacemakers' Bench
  at: [57, 41]
  pages:
  - trigger: action
    commands:
    - '\pf[JUNO,happy]Juno: Sit! You have to sit! It''s the Lacemakers'' Bench. Everyone who walks the Strand sits here or the cliffs fall in.'
    - choices: ['Is that true?', (Sit.)]
      cancel: 1
      branches:
      - ['\pf[JUNO,deadpan]Juno: No. But they haven''t fallen in, have they.']
      - - (You sit. Juno sits. A Wingull lands on the end of the bench. Nobody says anything for a while. The sea does most of the talking.)
        - '\pf[JUNO,neutral]Juno: ...This is nice. I don''t get to sit. I''m always going somewhere with a basket.'
        - '\pf[JUNO,happy]Juno: Right! That''s enough nice! Saltmere!'
        - {heal: true}
