- type: event
  name: The Lace Arches
  at: [104, 29]
  pages:
  - trigger: touch
    commands:
    - (Chalk cliffs worn by the sea into arches as fine as lace. The path goes through three of them. Well -- two and a half.)
    - '\pf[JUNO,happy]Juno: The Briarwick weavers copy these cliffs for their lace. Not the other way round. The sea did it first.'
    - '\pf[JUNO,happy]Juno: The sea does most things first. It''s very annoying of it.'
    - selfswitch: [A, true]
  - cond: {self: A}
    commands: []
