- type: event
  name: Drowned sample-book
  at: [74, 47]
  pages:
  - trigger: action
    commands: ['A weaver''s sample-book, swollen with seawater. Every page is a lace pattern copied from these cliffs.', 'On the last page, in a different
        hand: "Found the Thread. Going home by the forest road." It is dated the winter the road closed.']
- type: item
  at: [76, 47]
