# The Dovetail - Deck (109). WRITTEN BY layouts/dovetail.py (PF Rejuv, tileset 51).
id: 109
biome: harbour
name: The Dovetail - Deck
parent: 0
bgm: Islands
tone: [14, -4, -24, 10]
fog: {name: prismfall_seamist, opacity: 55, blend: 0, zoom: 100, sx: 3, sy: 0}
metadata:
  Name: The Dovetail
  MapPosition: [0, 14, 27]
raw: data/raw/109.npy
tileset: 51
events:
- type: event
  name: Prologue intro
  pages:
  - commands:
    - tone: [-255, -255, -255, 0, 0]
    - {script: 'pfm_card(:PF_PROLOGUE_CARD, "Spring, AF 300.", "The Concert of Regions has sealed the borders of Velmora.", "This is the final civilian
        crossing.")'}
    - In the black porthole glass, a reflection looks back at you.
    - choices: [That's me. (Style A), That's me. (Style B)]
      branches:
      - - {script: pbChangePlayer(1)}
      - - {script: pbChangePlayer(2)}
      cancel: 0
    - tone: [14, -4, -24, 10, 30]
    - {wait: 30}
    - The deck. You stand at the port rail, one bag at your feet. Gulls. On the horizon, a low line of eighteen colored glows.
    - 'Deckhand: Twenty minutes to the Landing! Mind your bags, mind your feet, mind the Captain!'
    - 'Deckhand: And the manifest. Captain''s orders: last crossing, nobody goes missing off her books. Name?'
    - {label: Manifest name}
    - {script: pbTrainerName}
    - 'Deckhand: \PN. That right?'
    - choices: [That's right., 'No, let me spell it.']
      branches:
      - []
      - - {jump_label: Manifest name}
      cancel: 0
    - move:
        who: Deckhand
        route: [left, left, left]
        wait: true
    - {script: $player.has_running_shoes = true}
    - {script: Prismfall.choose_difficulty}
    - switch: [LARCH_AT_TIDEWATCH, true]
    - var: [STORY_ACT, 0]
    - var: [STORY_CHAPTER, 0]
    - selfswitch: [A, true]
    trigger: autorun
    move: fixed
  - commands: []
    trigger: action
    move: fixed
    cond: {self: A}
  at: [16, 13]
- type: sign
  name: Rail sign
  post: true
  text: DO NOT LEAN ON RAIL.
  commands:
  - DO NOT LEAN ON RAIL. — Capt. E. Morrow
  - if: $game_player.direction == 8
    then: [You are leaning on it.]
  at: [12, 5]
- type: event
  name: Mug ring
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands: [A ring of cold tea. He drank it black.]
    trigger: action
    move: fixed
    cond: {switch: PRO_FERRY_DONE}
  at: [13, 5]
- type: event
  name: Rail watch 1
  pages:
  - commands:
    - else:
      - if: '!pfm?(:dove_voss)'
        then:
        - move:
            route: [toward_player, toward_player, toward_player, face_player]
            wait: true
            who: Aurelian Voss
        - He leans on the rail right next to the sign. He holds a chipped white mug with a faded sunburst.
        - '\pf[VOSS,happy,,Aurelian Voss]Voss: First crossing? Everyone goes quiet when they see the lights.'
        - '\pf[EDDA,angry,anger,Captain Edda]Edda: RAIL!'
        - '\pf[VOSS,happy,,Aurelian Voss]Voss: I believe the rail has no objection, Captain.'
        - '\pf[EDDA,angry,,Captain Edda]Edda: Nobody asked the passengers in the nice coats!'
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: She''s been shouting at me since I was a linesman. It''s how I know I''m home.'
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: I''ve spent a month in a marble room asking the Concert not to do this. They did it anyway. Politely.'
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: So. You''re coming in on the day everyone else wishes they could get out. That takes nerve or bad luck.'
        - branches:
          - ['\pf[VOSS,happy,,Aurelian Voss]Voss: Good. Velmora runs on it.']
          - ['\pf[VOSS,happy,,Aurelian Voss]Voss: Then you''ll fit right in.']
          - ['\pf[VOSS,neutral,,Aurelian Voss]Voss: Or grief. Forgive me. I shouldn''t guess.']
          cancel: 3
          choices: [Nerve., Bad luck., '...']
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: Are you challenging the gyms? You''ve got the look. Eighteen Wardens, eighteen badges. Nobody''s done all
          eighteen in ten years.'
        - '\pf[VOSS,happy,,Aurelian Voss]Voss: Here. You''ll want one of these.'
        - {script: 'pfm_item(:BADGECASE, 1, "Badge Case")'}
        - 'A slim brass case with eighteen empty settings. Stamped on the hinge: MERIDIAN CONCORD.'
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: We make them for the League anyway. Call it a welcome from a fellow traveler.'
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: And this, if you''ll take it. A Meridian Fellowship. A little money each month, a discount at any Mart.
          We give them to young trainers with promise.'
        - branches:
          - - {script: 'pf_choose(:pro_fellowship, :accept)'}
            - {script: 'pfm_item(:FELLOWSHIPCARD, 1, "Fellowship Card")'}
            - {script: pfm_money(3000)}
            - '\pf[VOSS,happy,,Aurelian Voss]Voss: No, I insist. Somebody should be kind to you on a day like this.'
          - - {script: 'pf_choose(:pro_fellowship, :decline)'}
            - '\pf[VOSS,happy,,Aurelian Voss]Voss: Independent. Good. Keep that. It''s worth more than the card.'
          - - {script: 'pf_choose(:pro_fellowship, :silent)'}
            - '\pf[VOSS,neutral,,Aurelian Voss]Voss: Think about it.'
            - He sets the card on the rail.
            - {script: 'pfm_item(:FELLOWSHIPCARD, 1, "Fellowship Card")'}
            - It is not activated. A Mart clerk could switch it on.
            - {script: 'pfm_set(:fellowship_off)'}
          cancel: 0
          choices: [Thank you., 'No, thank you.', '...']
        - The ship's horn sounds, long and low.
        - '\pf[VOSS,neutral,,Aurelian Voss]Voss: That''s the Landing. Aurelian Voss. If you ever need anything in Lumen City, ask for me by name. They''ll
          laugh, and then they''ll fetch me.'
        - move:
            route:
            - through_on
            - away_player
            - away_player
            - away_player
            - turn_180
            - wait 20
            - turn_180
            - away_player
            - away_player
            - {opacity: 0}
            wait: true
            who: Aurelian Voss
        - {script: 'pfm_set(:dove_voss)'}
        - switch: [PRO_FERRY_DONE, true]
        - tone: [-255, -255, -255, 0, 20]
        - {wait: 24}
        - The Dovetail noses in against an old stone pier. Ropes thump. The gangway clatters down aft.
        - tone: [14, -4, -24, 10, 20]
        - {wait: 20}
        - {script: Prismfall.checkpoint}
      if: '!pfm?(:dove_edda)'
      then:
      - move:
          route: [toward_player, toward_player]
          wait: true
          who: Captain Edda
      - '\pf[EDDA,angry,anger,Captain Edda]Edda: Oi! Sprog! Can you read?'
      - branches:
        - ['\pf[EDDA,deadpan,,Captain Edda]Edda: Then you''re doing it on purpose. That''s worse.']
        - ['\pf[EDDA,shocked,sweat,Captain Edda]Edda: ...Oh. Oh, stars. Right. That''s a D. That one''s an O.']
        - ['\pf[EDDA,deadpan,,Captain Edda]Edda: Strong silent type. Wonderful. I''ll just talk to the rail, shall I?', '\pf[EDDA,angry,,Captain Edda]Edda:
            Rail! Tell the sprog to get off you!']
        cancel: 3
        choices: [Yes., No., '...']
      - move:
          route: [toward_player]
          wait: true
          who: Captain Edda
      - anim: [Captain Edda, 3]
      - {wait: 40}
      - '\pf[EDDA,shocked,dots,Captain Edda]Edda: Don''t lean on my rail like that, you''ll— huh.'
      - '\pf[EDDA,neutral,,Captain Edda]Edda: ...Never mind. You stand how you like.'
      - '\pf[EDDA,neutral,,Captain Edda]Edda: Mind the gap when we dock. And don''t look down at the water after dark.'
      - branches:
        - ['\pf[EDDA,deadpan,,Captain Edda]Edda: Because I said, and it''s my boat.']
        - ['\pf[EDDA,sad,,Captain Edda]Edda: ...Good. Somebody used to ask me that every crossing.']
        cancel: 2
        choices: ['Why not?', '...']
      - move:
          route:
          - through_on
          - {script: 'moveto(6, 9)'}
          - through_off
          - turn_down
          wait: true
          who: Captain Edda
      - {script: 'pfm_set(:dove_edda)'}
    move: fixed
    trigger: touch
  - commands: []
    cond: {switch: PRO_FERRY_DONE}
    move: fixed
    trigger: action
  at: [10, 6]
