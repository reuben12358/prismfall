- type: sign
  name: Bunk
  post: false
  text: Your bunk. You didn't sleep in it.
  at: [3, 7]
- type: sign
  name: Porthole
  post: false
  text: Dark water. Far down, for a moment, something glows. Then it doesn't.
  at: [11, 5]
- type: event
  name: Cook
  pages:
  - commands:
    - 'Cook: Last bowl of chowder on the last ferry. Historic chowder. Eat it slow.'
    - {script: 'pfm_item(:OLDCHOWDER, 1, "Old Chowder")'}
    - Restores 20 HP. Tastes like the end of an era.
    - selfswitch: [A, true]
    trigger: action
    move: fixed
    graphic: {sprite: NPC 09, dir: down}
  - commands: ['Cook: Last bowl on the last ferry. You had it. Historic.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 09, dir: down}
    cond: {self: A}
  at: [9, 7]
- type: sign
  name: Bookshelf
  post: false
  text: '"Passenger Notice: Persons of Velmoran birth are advised that prolonged absence from one''s home Imprint may cause fatigue, pallor and low spirits. The line
    accepts no liability for wilting."'
  at: [7, 5]
- type: sign
  name: Locked trunk
  post: false
  text: 'It''s locked. Scratched into the lid, very small: I.A. + child, night crossing, 290. Paid in full.'
  at: [10, 8]
- type: sign
  name: Mum's letter
  post: false
  text: 'A letter in your mother''s handwriting. The ink runs where the sea got at it.

    "Go to Imelda Larch at Ferrow''s Landing, before they close the strait.

    Don''t let anyone scan you. Don''t go to Crownhaven.

    I''m sorry I never told you why. I wanted one of us to have an ordinary life.

    — Mum."'
  at: [4, 7]
