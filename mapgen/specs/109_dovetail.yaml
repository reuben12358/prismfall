  - commands: []
    trigger: action
    move: fixed
    cond: {self: A}
  at: [27, 12]
- type: event
  name: Deckhand
  pages:
  - commands: ['Deckhand: Twenty minutes, I said! It''s been twenty minutes for an hour. The Captain''s going slow on purpose.']
    trigger: action
    move: random
    graphic: {sprite: NPC 15, dir: right}
  at: [8, 12]
- type: event
  name: Old Man
  pages:
  - commands: ['Old Man: See the colors on the skyline? Eighteen of ''em. That''s Velmora.', 'Old Man: When I was a lad you only saw the Imprints on a clear
        night. Now you see ''em through fog.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 06, dir: up}
  at: [18, 6]
- type: event
  name: Woman with crate
  pages:
  - commands: ['Woman with crate: I''m going home to Saltmere. My sister says don''t. I said, where else would I go? I get ill anywhere else.', 'Woman with
        crate: Three weeks abroad and I was grey as dishwater. They call it wilting. You''ll see.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 22, dir: down}
  at: [24, 13]
- type: event
  name: Boy
  pages:
  - commands: ['Boy: Mum says when we land a machine tells you what color you are! I want to be red.', 'Boy''s Mother: You''ll be green like the rest of
        us, love. We''re Briarwick.', 'Boy: ...Can I be green AND red?']
    trigger: action
    move: random
    graphic: {sprite: NPC 02, dir: up}
  at: [16, 7]
- type: event
  name: Boy's Mother
  pages:
  - commands: ['Boy''s Mother: You''ll be green like the rest of us, love. We''re Briarwick.', 'Boy: ...Can I be green AND red?']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 04, dir: left}
  at: [17, 8]
- type: event
  name: Sailor
  pages:
  - commands: ['Sailor: Last crossing. After tonight the Concert''s cutters turn back anything bigger than a gull.', 'Sailor: Captain says she''ll tie up
        at the Landing and learn to knit. She won''t.']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_SAILOR, dir: down}
  at: [26, 9]
- type: event
  name: Seasick Man
  pages:
  - commands: ['Seasick Man: Don''t talk to me. If I open my mouth, more than words come out.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 05, dir: right}
  at: [4, 11]
- type: warp
  name: Cabin hatch
  link: DOVE_CABIN
  se: Door exit
  at: [15, 10]
  arrive: [15, 11, down]
