      else:
      - 'A door in the wings, chalked: "OLD REVOLVE - CREW ONLY. Come back with a second badge, darling. - D.P."'
- type: event
  name: Field Notes
  at:
  - 0
  - 1
  pages:
  - trigger: parallel
    commands:
    - if: '!pfm?(:fn_grand_stage) && $game_player.y <= 27 && !$game_temp.message_window_showing'
      then:
      - script: pfm_set(:fn_grand_stage)
      - 'FIELD NOTES: GRAND STAGE - the audience reacts. Sound moves and dances earn applause, and applause lifts the next
