id: 154
name: Pell Playhouse - The Grand Stage
parent: 150
biome: interior
bgm: Gym
field: GRAND_STAGE
metadata:
  MapPosition:
  - 0
  - 10
  - 25
raw: data/raw/154.npy
tileset: 54
events:
- type: warp
  name: To the stage door
  at:
  - 9
  - 13
  to:
    map: 151
    x: 12
    y: 4
    dir: down
- type: event
  name: Dorian
  at:
  - 9
  - 4
  pages:
  - graphic:
      sprite: trainer_GENTLEMAN
      dir: down
    commands:
    - 'Dorian Pell: Enter, stage left, our brave challenger! You performed the whole of The Gilded King to get here. Did you
      notice?'
    - 'Dorian Pell: The stage tells the truth the throne won''t. A duet, then - two by two!'
    - script: setBattleRule("double")
    - if: Prismfall.gym_battle(2)
      then:
      - 'Dorian Pell: Bravo! BRAVO! The house is on its feet!'
      - script: Prismfall.award_badge(2)
      - script: pbReceiveItem(:TM42)
      - 'Dorian Pell: Facade - the art of turning a bad night into a standing ovation.'
      - if: pfm?(:gilded_crown)
        then:
        - 'Dorian Pell: You found the old crown! Keep it. Every understudy should own one thing that doesn''t fit.'
      - 'Dorian Pell: And one more gift, from the whole troupe. Forty auditions, never cast. You two are a matched set.'
      - script: 'pkmn = Pokemon.new(:EEVEE, 10)

          pkmn.name = "Understudy"

          pbAddPokemon(pkmn)'
      - switch:
        - CH3_UNDERSTUDY_GOT
        - true
      - 'Dorian Pell: Opening night of the Pageant is at the Hall. Come. Bring Juno. Bring everyone.'
      - selfswitch:
        - A
        - true
  - cond:
      self: A
    graphic:
      sprite: trainer_GENTLEMAN
      dir: down
    commands:
    - 'Dorian Pell: The Pageant, darling! The Hall, tonight!'
- type: npc
  name: Audience 0
  at:
  - 8
  - 10
  sprite: NPC 03
  dir: up
  text: Ooh, a new face!
- type: npc
  name: Audience 1
  at:
  - 10
  - 10
  sprite: NPC 11
  dir: up
  text: Dorian never loses gracefully. He wins gracefully.
- type: npc
  name: Audience 2
  at:
  - 7
  - 12
  sprite: NPC 07
  dir: up
  text: Is it a comedy or a tragedy tonight?
