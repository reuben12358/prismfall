- type: event
  name: Dorian
  at:
  - 12
  - 7
  pages:
  - graphic:
      tile: 2305
  - cond:
      var:
      - STAGE_CURTAIN
      - 1
    graphic:
      sprite: trainer_GENTLEMAN
      dir: down
    commands:
    - if: $game_self_switches[[154, 0, 'TRIED']]
      then:
      - '\pf[DORIAN,happy]Dorian: Act Two! I adore an Act Two. Everyone''s warmed up.'
      else:
      - (Dorian stands center stage in a single spotlight, cane raised, as if he has been standing there for an hour. He may
        have.)
      - '\pf[DORIAN,happy]Dorian: Enter, stage left, our brave challenger! To thunderous applause!'
      - (The audience applauds, thunderously.)
      - '\pf[DORIAN,neutral]Dorian: Your first Warden. Your first field. Your first audience. I envy you, darling. You only
        get one of each.'
      - '\pf[DORIAN,smug]Dorian: On my stage the house loves a show. Sing, dance, dazzle them, and they''ll carry you. Bore
        them, and they''ll let you fall.'
      - '\pf[DORIAN,happy]Dorian: Shall we give them something to remember?'
    - script: $game_self_switches[[154, 0, 'TRIED']] = true
    - if: 'Prismfall.gym_battle(pfm_gym(:LEADER_DORIAN), double: false)'
      then:
      - '\pf[DORIAN,shocked]Dorian: ...They''re standing. Look at them. They''re on their FEET.'
      - '\pf[DORIAN,crying]Dorian: Bravo! BRAVO! Oh, I''m crying, don''t look, it''s the footlights.'
      - script: Prismfall.award_badge(pfm_gym(:LEADER_DORIAN))
      - '(You open the Badge Case and set the badge in. A faint hum: one clear note. The whole house goes quiet.)'
      - '\pf[JUNO,happy,question]Juno: Ooh. Is it supposed to do that?'
      - '\pf[DORIAN,shocked,shock]Dorian: Darling, in Saltmere nothing is supposed to do ANYTHING. That''s the whole charter.'
      - '\pf[DORIAN,neutral]Dorian: ...'
      - '\pf[DORIAN,happy]Dorian: Do it again.'
      - (Nothing. The case is quiet.)
      - '\pf[DORIAN,deadpan]Dorian: One night only. The best kind.'
      - script: pbReceiveItem(:TM42)
      - '\pf[DORIAN,neutral]Dorian: Facade. The art of turning a bad night into a standing ovation. You''ll need it more often
        than you''d think.'
      - '\pf[DORIAN,neutral]Dorian: That badge is the Accord''s word that Pokémon up to level nineteen will heed you. Briarwick''s
        will let you cut the dead wood, when you''ve earned it. They have a man for that.'
      - (The troupe files on from the wings. The smallest actor is carrying an Eevee in a ruff.)
      - '\pf[DORIAN,happy]Dorian: And one more gift, from the whole company. Forty auditions. Never cast. A tragedy in a ruff.'
      - '\pf[DORIAN,neutral]Dorian: You came off that ferry with no color at all, I hear, and this one''s never picked one
        either. You two are a matched set.'
      - script: 'pkmn = Pokemon.new(:EEVEE, 10)

          pkmn.name = "Understudy"

          pbAddPokemon(pkmn)'
      - switch:
        - CH3_UNDERSTUDY_GOT
        - true
      - '\pf[DORIAN,happy]Dorian: Rehearsal at the Lantern Theatre this afternoon, opening night at eight. Come to both. Bring
        Juno. Bring everyone.'
      - selfswitch:
        - A
        - true
  - cond:
      self: A
    graphic:
      sprite: trainer_GENTLEMAN
      dir: down
    commands:
    - '\pf[DORIAN,happy]Dorian: Rehearsal at the Lantern Theatre, darling! Opening night at eight!'
    - if: pfm_gym_won?(:LEADER_TAMSIN)
      then:
      - '\pf[DORIAN,smug]Dorian: And a second badge! Then the old stage-left wing is yours. The revolve back there hasn''t
        turned since my debut. Get it through all three acts. There''s a prompt-book in the prop room I''d rather you found
        than the Crown''s inspectors.'
- type: event
