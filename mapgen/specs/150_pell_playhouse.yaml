events:
- type: event
  name: Comedy door
  at:
  - 6
  - 4
  pages:
  - commands:
    - A dressing-room door with a smiling mask. "COMEDY."
    - if_switch:
      - GYM2_MASK
      - true
      then:
      - The costume is already yours.
      else:
      - '"Tonight the truth wears a smile." The right costume!'
      - switch:
        - GYM2_MASK
        - true
      - se: Door exit
      - Down the corridor, a lock clicks open.
- type: event
  name: Tragedy door
  at:
  - 11
  - 4
  pages:
  - commands:
    - A dressing-room door. "TRAGEDY."
    - if_self:
      - A
      - false
      then:
      - An actor bursts out in full costume!
      - if: TrainerBattle.start(:LADY, "Odette")
        then:
        - selfswitch:
          - A
          - true
    - Wrong costume!
- type: event
  name: Crown door
  at:
  - 16
  - 4
  pages:
  - commands:
    - A dressing-room door. "CROWN."
    - if_self:
      - A
      - false
      then:
      - An actor bursts out in full costume!
      - if: TrainerBattle.start(:JUGGLER, "Pierrot")
        then:
        - selfswitch:
          - A
          - true
    - Wrong costume!
- type: event
  name: Fool door
  at:
  - 21
  - 4
  pages:
  - commands:
    - A dressing-room door. "FOOL." Inside, only a jester's cap on a hook. Wrong costume!
- type: warp
  name: To Revolving Stage
  at:
  - 1
  - 5
  to:
    map: 151
    x: 12
    y: 2
    dir: down
- type: event
  name: Stage door
  at:
  - 25
  - 5
  pages:
  - commands:
    - 'Locked. A note: "Costume first, darling."'
  - cond:
      switch: GYM2_MASK
    trigger: touch
    commands:
    - se: Door exit
    - transfer:
        map: 154
        x: 6
        y: 11
        dir: up
