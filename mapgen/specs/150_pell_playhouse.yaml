- type: event
  name: Dorian
  at:
  - 12
  - 5
  pages:
  - graphic:
      tile: 2305
  - cond:
      var:
      - STAGE_CURTAIN
      - 1
    graphic:
      sprite: trainer_GENTLEMAN
      dir: down
    commands:
    - 'Dorian Pell: Enter, challenger, to thunderous applause! Your first Warden. Your first field. Your first audience.'
    - 'Dorian Pell: On my stage the house loves a show: dance, sing, dazzle them, and they''ll lift you. The stage tells the
      truth the throne won''t.'
    - if: 'Prismfall.gym_battle(pfm_gym(:LEADER_DORIAN), double: false)'
      then:
      - 'Dorian Pell: Bravo! BRAVO! The house is on its feet!'
      - script: Prismfall.award_badge(pfm_gym(:LEADER_DORIAN))
      - script: pbReceiveItem(:TM42)
      - 'Dorian Pell: Facade - the art of turning a bad night into a standing ovation.'
      - 'Dorian Pell: And one more gift, from the whole troupe. Forty auditions, never cast. You two are a matched set.'
      - script: 'pkmn = Pokemon.new(:EEVEE, 10)

          pkmn.name = "Understudy"

          pbAddPokemon(pkmn)'
      - switch:
        - CH3_UNDERSTUDY_GOT
        - true
      - 'Dorian Pell: Opening night of the Pageant is at the Hall. Come. Bring Juno. Bring everyone.'
      - selfswitch:
        - A
        - true
  - cond:
