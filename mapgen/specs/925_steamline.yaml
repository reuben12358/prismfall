    trigger: event_touch
    commands:
    - {script: pbNoticePlayer(get_self)}
    - 'Hirdman Styr: You. The one walking between.'
    - 'Ember-Rider Kessa: For once, the north and I agree.'
    - (Sigrun comes out of the steam at your shoulder, frost on one side of her face and soot on the other.)
    - 'Sigrun: They agree on something. Wonderful. It''s us.'
    - {script: 'pbRegisterPartner(:LEADER_SIGRUN, "Sigrun", 19)'}
    - {script: setBattleRule("double")}
    - if: TrainerBattle.start(:ISENMAR_HIRDMAN, "Styr", 0, :ASHKAAR_EMBER_RIDER, "Kessa", 0)
      then:
      - &id001 {script: pbDeregisterPartner rescue ($PokemonGlobal.partner = nil)}
      - 'Sigrun: Still standing. Both of us. Look up.'
      - 'Sigrun: The crest is just south. Go.'
      - {script: 'pfm_set(:war_partner_done)

          $game_variables[140] = 6 if $game_variables[140] < 6'}
      - selfswitch: [A, true]
      else:
      - *id001
  - cond: {switch: WAR_SIDE_MID, self: A}
    graphic: {sprite: trainer_COOLTRAINER_M, dir: up}
    trigger: action
    commands: ['Ember-Rider Kessa: You stood between. So we both had something to aim at.']
  fixed: true
