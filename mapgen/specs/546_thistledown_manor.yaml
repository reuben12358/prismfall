# Thistledown Manor (546) + Attic (547): the comic haunted house (story/04_ACT_I.md Ch3 optional set piece),
# on the base project's Mansion interior tileset (palettes/mansion.yaml): checker foyer with a grand staircase,
# a long portrait hall, a dust-sheeted dining room, and a ruined, cobwebbed attic. DarkMap = circle of light.
id: 546
name: Thistledown Manor
parent: 540
palette: mansion
bgm: Cave
metadata: {DarkMap: true, MapPosition: [0, 12, 21]}
map: |
  ################################
  ################################
  ################################
  #::::::::::....................#
  #::::::::::====================#
  #::::::::::====================#
  #::::::::::....................#
  #::::::::::#########..##########
  #::::::::::#########..##########
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::##.................##
  #::::::::::#####################
  #####::#########################
tileblocks:
  - {tile: 521, size: [4, 3], at: [4, 3], layer: 1}      # grand staircase (impassable art; the warp is bumped)
  - {tile: 433, size: [2, 2], at: [14, 1], layer: 1}     # arched windows along the hall
  - {tile: 433, size: [2, 2], at: [22, 1], layer: 1}
  - {tile: 476, size: [3, 1], at: [1, 3], layer: 2}      # cobweb fringe
  - {tile: 476, size: [3, 1], at: [27, 9], layer: 2}
  - {tile: 542, size: [2, 1], at: [19, 12], layer: 1}    # long dining table
  - {tile: 542, size: [2, 1], at: [21, 12], layer: 1}
tiles:
  - {tile: 518, at: [12, 3], layer: 1}
  - {tile: 518, at: [30, 3], layer: 1}
  - {tile: 596, at: [19, 11], layer: 1}
  - {tile: 596, at: [21, 11], layer: 1}
  - {tile: 604, at: [20, 13], layer: 1}
  - {tile: 605, at: [14, 15], layer: 1}
  - {tile: 606, at: [15, 15], layer: 1}
  - {tile: 607, at: [27, 15], layer: 1}
  - {tile: 519, at: [1, 16], layer: 1}
  - {tile: 519, at: [10, 16], layer: 1}
events:
  - {type: exit, at: [5, 18], link: R3_MANOR}
  - {type: warp, name: Grand staircase, at: [5, 5], link: MANOR_UP, arrive: [5, 6, down], se: Door exit}
  - {type: sign, at: [12, 4], post: false, name: Portrait L, text: "A portrait of a Thistledown actor in a crown. The eyes follow the light."}
  - {type: sign, at: [30, 4], post: false, name: Portrait R, text: "A portrait of the whole company, AF 211. One face has been painted over."}
  - &scene
    type: event
    name: Scene 1
    at: [8, 9]
    pages:
      - graphic: {sprite: NPC 25, dir: down, opacity: 160}
        commands:
          - "A ghostly actor in a ruff glares at you. \"You're late! Scene one - the battlements! Your line?\""
          - choices: ["\"Who's there?\"", "\"Is this a Poké Ball I see before me?\"", "\"Line?\""]
            cancel: 0
            branches:
              - ["\"...Perfect. PERFECT.\" The ghost wipes away a spectral tear.", {selfswitch: [A, true]}]
              - ["\"WRONG PLAY!\" The ghost's Pokémon lunges out of the dark!", {script: "WildBattle.start(:GASTLY, 13)"}]
              - ["\"LINE?! Off with them!\"", {script: "WildBattle.start(:GASTLY, 13)"}]
      - cond: {self: A}
        commands: ["Only a cold spot where the actor stood."]
  - <<: *scene
    name: Scene 2
    at: [26, 5]
    pages:
      - graphic: {sprite: NPC 28, dir: down}
        commands:
          - "A ghostly queen sweeps toward you. \"Scene two! The closet! What do you say to your mother?\""
          - choices: ["\"I must be cruel only to be kind.\"", "\"Mother, I've caught a Magikarp.\"", "*bow silently*"]
            cancel: 0
            branches:
              - ["\"Exquisite.\" She fades, delighted.", {selfswitch: [A, true]}]
              - ["\"HOW DARE YOU.\"", {script: "WildBattle.start(:MISDREAVUS, 13)"}]
              - ["\"A mime? In MY production?\"", {script: "WildBattle.start(:MISDREAVUS, 13)"}]
      - cond: {self: A}
        commands: ["A faint scent of greasepaint lingers."]
  - <<: *scene
    name: Scene 3
    at: [28, 12]
    pages:
      - graphic: {sprite: NPC 03, dir: left}
        commands:
          - "A ghostly gravedigger holds up a Poké Ball like a skull. \"Scene three! The graveyard! Well?\""
          - choices: ["\"Alas, poor Voltorb!\"", "\"Is it... empty?\"", "\"I'll take it.\""]
            cancel: 0
            branches:
              - ["\"Alas indeed!\" He bows, cackling, and is gone.", {selfswitch: [A, true]}]
              - ["\"EMPTY?!\"", {script: "WildBattle.start(:DUSKULL, 13)"}]
              - ["\"Props are NOT for keeping!\"", {script: "WildBattle.start(:DUSKULL, 13)"}]
      - cond: {self: A}
        commands: ["Freshly turned earth on a parlour rug."]
  - type: event
    name: Lady Thistledown
    at: [23, 10]
    pages:
      - graphic: {sprite: NPC 28, dir: down, opacity: 180}
        commands:
          - if: '$game_map.events.values.select { |e| e.name[/^Scene \d/] }.all? { |e| $game_self_switches[[@map_id, e.id, "A"]] }'
            then:
              - "Lady Thistledown: Darling. DARLING. Three scenes, three triumphs. The company has not had an understudy like you in a century."
              - "Behind her, the butler-ghost mouths one word at you: don't."
              - "Lady Thistledown: Stay for the second act. Join the Thistledown Players... forever."
              - choices: ["Bow out gracefully", "Join the company"]
                cancel: 1
                branches:
                  - - "Lady Thistledown: ...A pity. Then take your bouquet. Every star needs one."
                    - {script: "pbReceiveItem(:SPELLTAG)"}
                    - "A chipped teacup rattles off the mantel and follows you."
                    - {script: "pbAddPokemon(:SINISTEA, 14)"}
                    - {switch: [THISTLEDOWN_CLEARED, true]}
                    - {selfswitch: [A, true]}
                  - - {script: "Prismfall.game_over(:GO_CURTAIN_CALL)"}
            else: ["Lady Thistledown: Places, everyone! Places! ...You. You're the new understudy? Learn your scenes."]
      - cond: {self: A}
        commands: ["The parlour is quiet. On the mantel, a playbill: THE THISTLEDOWN PLAYERS - FINAL SEASON."]
  - type: event
    name: Ghost girl
    at: [2, 13]
    pages:
      - graphic: {sprite: NPC 07, dir: down, opacity: 140}
        commands:
          - "A little girl in an old-fashioned dress: \"Mama says the play never ends. Is that true?\""
          - "When you blink, she's gone."
          - {selfswitch: [A, true]}
      - cond: {self: A}
  - {type: trainer, at: [17, 6], sight: 4, dir: right, sprite: trainer_CHANNELER, trainer: [CHANNELER, Mireille],
     intro: "The spirits asked me to audition you!", after: "They say you have presence. Ghostly presence."}
  - {type: item, at: [29, 16], item: CLEANSETAG}
