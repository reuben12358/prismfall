- type: sign
  name: Painted North Door
  at: [10, 3]
  post: false
  text: You press against the grand iron-banded door — it doesn't budge a hair. Looking closer, the hinges, rivets, and keyhole are painted straight onto
    solid canyon sandstone in red ochre!
- type: event
  name: Gym Guide
  at: [7, 13]
  pages:
  - graphic: {sprite: NPC 21, dir: right}
    trigger: action
    move: fixed
    commands: ['Gym Guide: Yo, challenger! Welcome to The Dig — Ground-types on the Desert field!', 'Gym Guide: Water, Grass, and Ice dig in here. Electric
        doesn''t, ever, at all.', 'Gym Guide: Sun hardens and shade sinks. The sun-mirrors downstairs pick which sand lanes bake into crust and which stay
        soft.', 'Gym Guide: Falling isn''t failing in here. Warden Sahar says falling''s how you find the second floor!']
- type: event
  name: Excavation Medic
  at: [13, 13]
  pages:
  - graphic: {sprite: NPC 18, dir: left}
    trigger: action
    move: fixed
    commands:
    - {script: "pbMessage(_INTL(\"Excavation Medic: Desert grit gets into every joint. Let me brush off your Pokémon and patch them up!\"))\npbMEPlay(\"\
        Pkmn healing\")\npbFadeOutIn do\n  $player.heal_party\nend\npbMessage(_INTL(\"Excavation Medic: Right as rain — or as close as we get in Ossaria!\
        \ Stop back anytime.\"))"}
- type: event
  name: Sahar's Aide
  at: [12, 4]
  pages:
  - graphic: {sprite: NPC 14, dir: down}
    trigger: action
    move: fixed
    commands: ['Sahar''s Aide: Everyone tries the door. The door''s painted on.', 'Sahar''s Aide: The way in is down — step right onto the shaded cracked
        sand in the center of the hall!']
- type: event
  name: Excavator Foreman
  at: [15, 11]
  pages:
  - graphic: {sprite: trainer_FOREMAN, dir: left}
    trigger: action
    move: fixed
    commands:
    - {script: "if (pfm_gym_won?(:LEADER_SAHAR) rescue false)\n  if !$game_switches[327]\n    pbMessage(_INTL(\"Excavator Foreman: Word came up the lift\
        \ — you beat Warden Sahar! She told us to hand this over the moment you surfaced.\"))\n    pbReceiveItem(:HM04)\n    $game_switches[327] = true\n\
        \    pbMessage(_INTL(\"Excavator Foreman: HM04 Strength! With the Sandglass Badge, your Pokémon can shove heavy tomb boulders clear — handy out\
        \ on the Marrow Road and inside the Ossuary of Dunes!\"))\n  else\n    pbMessage(_INTL(\"Excavator Foreman: Put Strength to good use out in the\
        \ Ossuary of Dunes — those Elector-era boulders haven't budged in three hundred years!\"))\n  end\nelse\n  pbMessage(_INTL(\"Excavator Foreman:\
        \ We're shoring the upper excavation walls. Once you earn Sahar's Sandglass Badge, come talk to me — my crew has HM04 Strength waiting for you!\"\
        ))\nend"}
- type: trainer
  name: Trainer(2)
  at: [4, 9]
  sight: 2
  dir: right
  sprite: trainer_PICNICKER
  trainer: [PICNICKER, Layla]
  intro: 'Picnicker Layla: I came down here to look for shade and a quiet lunch — and now the sand''s trying to eat my basket! Battle me while I still have
