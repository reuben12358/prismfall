  at: [73, 49]
  pages:
  - graphic: {sprite: NPC 27, dir: down}
    trigger: action
    move: fixed
    commands:
    - 'Prop-mistress: If you''re digging in the old barge, there''s a shovel by the wagon.'
    - 'Prop-mistress: The prompter''s box went down with it in ''71. Nobody''s had the heart.'
    - if: '!pfm_has?(:SANDSHOVEL)'
      then:
      - {script: 'pfm_item(:SANDSHOVEL, 1, "Sand Shovel")'}
- type: event
  name: The Prompter's Box
  at: [33, 57]
  pages:
  - trigger: action
    commands:
    - if: pfm?(:sm_prompter)
      then: [Only sand now. The barge has given up its secret.]
      else:
      - if: pfm_has?(:SANDSHOVEL)
        then:
        - (A theater barge lies half-buried in the dune, its name board reading THE WANDERING CHORUS.)
        - You dig at the stern with the shovel...
        - {script: 'pfm_item(:PROMPTERSSCRIPT, 1, "Prompter''s Script")'}
        - {script: 'pfm_item(:NORMALGEM, 1, "Normal Gem")'}
        - {script: 'pfm_set(:sm_prompter)'}
        else: [(A theater barge lies half-buried in the dune. Costume hampers. A prop throne with three legs.), Something square is buried at the stern.
            You'd need a shovel.]
