- type: event
  name: Sledge run
  at: [52, 14]
  pages:
  - trigger: action
    commands:
    - (A waxed sledge at the top of the run. The sand drops away to the sea.)
    - choices: [Ride it down!, Not today.]
      cancel: 1
      branches:
      - - move:
            who: -1
            route:
            - turn_down
            - dir_fix_on
            - through_on
            - {speed: 5}
            - down 50
            - {speed: 4}
            - through_off
            - dir_fix_off
        - {se: Slots stop}
        - {script: 'pfm_add(:sledge_runs, 1) rescue nil'}
        - (Nine seconds, maybe ten. The record is seven, and a broken arm.)
      - [(You'd need a running start. And a will.)]
- type: sign
  name: Road sign
  at: [105, 29]
  text: MARRAM DOWN - Free Port of Saltmere, 1 mile. Pulling up the marram grass is fined. Yes, even that one.
  post: false
- type: event
  name: Free Port charter stone
  at: [4, 36]
  pages:
  - trigger: action
    commands: ['FREE PORT CHARTER STONE: "By grant of Sovereign Maren, AF 41: SALTMERE ANSWERS TO THE ACCORD AND TO NO CROWN."', 'Someone has carved underneath,
        smaller: "AND BOOS THE REST."']
- type: event
  name: The stile
  at: [2, 42]
  pages:
  - trigger: action
    commands: ['A toll-free stile into Saltmere. A painted board: "FREE PORT. NO TOLL. NO KINGS. MIND THE STEP."']
- type: event
  name: The Saltmere Beacon
  at: [55, 9]
  pages:
  - trigger: touch
    commands:
    - 'From the top of the dune the free port opens out below you: a white town on a salt lake, striped awnings, lantern masts, and a theatre on every second
      corner.'
    - '\pf[JUNO,happy]Juno: Saltmere! Look at it! Everything''s ordinary! Isn''t it WONDERFUL?'
    - '\pf[JUNO,happy]Juno: The Blank Plate''s under there somewhere. Nothing strange ever happens in Saltmere. No Bleed, no glowing rivers, nothing.'
    - '\pf[JUNO,happy]Juno: So they make it all up instead. Every night. On purpose.'
    - selfswitch: [A, true]
  - cond: {self: A}
    commands: []
- type: event
  name: Beacon Keeper
  at: [58, 9]
  pages:
  - graphic: {sprite: NPC 26, dir: down}
    trigger: action
    commands:
    - 'Beacon Keeper: Tea? It''s not kelp. I''ve heard about the kelp.'
    - {heal: true}
    - (The party is rested.)
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: NPC 26, dir: down}
    trigger: action
    commands: ['Beacon Keeper: The pot''s cold. Come back when I''ve forgotten you.']
- type: event
  name: Sledge run sign
  at: [54, 14]
  pages:
  - trigger: action
    commands: ['THE SLEDGE RUN. Down the Beacon to the shore in nine seconds. The record is seven, and a broken arm.', 'One way only. The sand does not
        go back up, and neither do you.']
- type: event
  name: Sledge boy
  at: [53, 65]
  pages:
  - graphic: {sprite: NPC 05, dir: down}
    trigger: action
    move: fixed
    commands: ['Sledge boy: You came down the run? Leave the sledge, I drag them back up. Two coppers a drag. ...Fine. Free. This once.']
- type: event
  name: Hound Number One
  at: [68, 44]
  pages:
  - graphic: {sprite: NPC 03, dir: down}
    trigger: action
    move: fixed
    commands: ['Hound Number One: And SO the Loyal Three drove the Gossamer Ogre from the wood--']
- type: event
  name: Ogre
  at: [71, 43]
  pages:
  - graphic: {sprite: NPC 25, dir: down}
    trigger: action
    move: random
    commands: ['Ogre: (muffled) Can I take the mask off? It''s very hot in the Ogre.', 'Ogre: (muffled) Why does he look so sad, though? He''s the villain.']
- type: event
  name: Director with script
  at: [75, 44]
  pages:
  - graphic: {sprite: NPC 18, dir: down}
    trigger: action
    move: fixed
    commands: ['Director: The Ogre does NOT take the mask off. The Ogre has never taken the mask off. It''s in the text.', 'Director: Because the carver
        was having a bad week in AF 140! Places!']
