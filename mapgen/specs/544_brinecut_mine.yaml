# Brinecut Mine (544 1F, 545 B1F, :CAVE): chalk-and-salt mine linking Thistledown Lea and the Grey Saltings.
# Built on the base project's Rock Cave templates (data/templates/cave1/cave2); the salt lake is [TODO art].
id: 544
name: Brinecut Mine 1F
parent: 540
template: cave1
drop_template_events: [Exit south, Exit right, Ladder, Hole, NPC, StrengthBoulder, Boulder position checks, Sign,
                       Dungeon ladder, Dungeon sign, Tile puzzles, EV016]
bgm: Cave
field: CAVE
metadata: {Name: Brinecut Mine, MapPosition: [0, 11, 23], BattleBack: cave1}
events:
  - {type: warp, name: To the Grey Saltings, at: [18, 22], link: R4_MINE, arrive: [18, 21, up], se: Door exit}
  - {type: warp, name: To Thistledown Lea, at: [24, 9], link: R3_MINE, arrive: [24, 10, down], se: Door exit}
  - {type: warp, name: Ladder down, at: [10, 12], to: {map: 545, x: 11, y: 12, dir: right}, se: Door exit}
  - {type: trainer, at: [14, 12], sight: 4, dir: right, sprite: trainer_HIKER, trainer: [HIKER, Bram],
     intro: "Salt in the walls, salt in my boots! Let's go!", after: "The B1F salt lake glows at night. Pretty, but don't drink it."}
  - {type: trainer, at: [20, 7], sight: 4, dir: down, sprite: trainer_BLACKBELT, trainer: [BLACKBELT, Taro],
     intro: "I train by punching chalk. Want to see?", after: "Chalk wins. Usually."}
  - type: event
    name: Salt miner
    at: [9, 11]
    pages:
      - graphic: {sprite: trainer_HIKER, dir: right}
        commands:
          - "Salt miner: Brinecut's been worked since before the Prismfall. Rockfalls every spring now, though."
          - if: "Prismfall.has_badge?(2)"
            then:
              - "Salt miner: Two badges? Then you can handle this. Smash what's in your way."
              - {script: "pbReceiveItem(:TM98)"}
              - {selfswitch: [A, true]}
            else: ["Salt miner: Come back with Dorian's badge and I'll teach you how we clear rubble."]
      - cond: {self: A}
        graphic: {sprite: trainer_HIKER, dir: right}
        commands: ["Salt miner: Rock Smash. Use it on the cracked boulders - sometimes there's something inside."]
  - {type: item, at: [19, 20], item: ESCAPEROPE}
  - {type: item, at: [12, 7], item: HARDSTONE, hidden: true}
