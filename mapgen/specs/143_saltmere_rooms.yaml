id: 145
name: Pageant Hall
parent: 140
biome: interior
bgm: Lerucean Town
tone: [4, 0, -6, 0]
metadata:
  MapPosition: [0, 10, 25]
raw: data/raw/145.npy
tileset: 54
events:
- type: exit
  at: [18, 24]
  link: SM_PAGEANT
- type: exit
  at: [19, 24]
  link: SM_PAGEANT
- type: event
  name: Pageant
  at: [18, 7]
  pages:
  - graphic: {sprite: trainer_GENTLEMAN, dir: down}
    commands:
    - if: '!pfm_gym_won?(:LEADER_DORIAN)'
      then: ['Stage manager: Rehearsals, rehearsals. Opening night is after the Warden''s own show - come back with his badge!']
      else:
      - 'Opening night: the Pageant of the Prismfall. You sit with Juno and Dorian in the front row.'
      - Mid-performance the stage lights go grey.
      - 'A figure steps out of the painted backdrop of the falling Plates: ash-bark mask, a single white lily.'
      - 'The Mourner: Three hundred years of pageantry.'
      - 'The Mourner: Ask your Warden why nothing in Verdance ever rots. Ask your Sovereign why the old capital is underwater.'
      - 'The Mourner: Ask why the Loyal Three wore poison on their collars. Let the land grieve.'
      - Hollow banners drop from the flies. The crowd panics - two grunts block the aisle!
      - if: TrainerBattle.start(:HOLLOW_GRUNT_M, "Grunt", :HOLLOW_GRUNT_F, "Grunt")
        then:
        - The Mourner looks straight at you across the theatre - and goes still.
        - 'The Mourner: ...You.'
        - Then he's gone, in a burst of Cotton Spore.
        - 'Juno: He sounded sad. Isn''t that weird? I thought he''d sound evil.'
        - Dorian, pale, pulls you into his dressing room and presses a yellowed page into your hands.
        - 'Dorian Pell: The prologue of The Gilded King. Ansel Crewe wrote it in AF 52. They hanged him for it.'
        - 'Dorian Pell: I''ve never staged it. I''m a coward with excellent diction.'
        - 'One line is underlined: "If heaven will not kneel, we''ll build a chain."'
        - switch: [CH3_PAGEANT_DONE, true]
        - var: [STORY_CHAPTER, 3]
        - selfswitch: [A, true]
  - cond: {self: A}
- type: event
  name: Prop shelf
  at: [2, 5]
  pages:
  - trigger: action
    commands: ['The prop room shelf: crowns, a papier-mache Plate, three identical daggers and a labelled jar of "STAGE BLOOD (JAM)".']
- type: event
  name: Torn backdrop
  at: [34, 4]
  pages:
  - trigger: action
    commands: ['An old drop, torn top to bottom: a forest on one side, a throne room on the other. Someone has been painting the tear shut, leaf by leaf.']
- type: event
  name: Dorian's mirror
  at: [31, 3]
  pages:
  - trigger: action
    commands: ['Dorian''s mirror, ringed with bulbs. Telegrams tucked in the frame: ''BREAK A LEG'', ''BREAK BOTH'', ''PAY YOUR RENT''.']
- type: event
  name: Chorus singer
  at: [4, 6]
  pages:
  - graphic: {sprite: NPC 13, dir: right}
    trigger: action
    commands: ['Chorus singer: We sing the hymns between the scenes. Tonight the hymn was screaming. We were very good at it.']
- type: event
  name: Chorus singer 2
  at: [7, 4]
  pages:
  - graphic: {sprite: NPC 17, dir: down}
    trigger: action
    commands: ['Chorus singer: The Octave lend us their voices for the Pageant. They make the rest of us sound like gulls.']
- type: event
  name: Usher
  at: [25, 12]
  pages:
  - graphic: {sprite: NPC 18, dir: down}
    trigger: action
    commands: ['Usher: Programmes, a copper! The Pageant of the Prismfall! Dorian Pell in the role of everyone!']
- type: event
  name: Vesper
  at: [5, 5]
  pages:
  - commands: []
  - cond: {switch: CH3_PAGEANT_DONE}
    graphic: {sprite: NPC 14, dir: down}
    trigger: action
    commands:
    - (Chorus singers in Prism Choir white sit on prop crates with blankets round them. A young woman in the same white kneels on the boards - not to you. To Understudy.)
    - 'Vesper: Oh. Hello, little one. You''re new.'
    - 'Vesper: I''m Vesper. Vesper Lindqvist. We''re the Octave: eight singers, eight Eevee. I just conduct. The Choir lends us to the Pageant for the hymns.'
    - 'Vesper: (to Understudy) It hasn''t decided which Imprint it belongs to yet.'
    - 'Vesper: (to you, after a long look) Neither have you, I think.'
    - choices: ['What does that mean?', '...']
      cancel: 1
      branches:
      - ['Vesper: Only what it says. I sing; I don''t explain. The Hierophant says I''d make a terrible priest.']
      - ['Vesper: You don''t have to answer. Nobody answers me. It''s restful.']
    - 'Vesper: We all lost our homes in the Glassfall. The Choir raised us, and when the others were grown it sent each of them to live beside a Plate, one each.
      They say an Eevee becomes what it lives beside.'
    - 'Vesper: Would you sing a duet with us before we go? It helps, after a fright. Lyra, come here.'
    - '(A girl in Choir grey, humming, with an Eevee at her heels: the Octave''s Elowen singer, going home to Briarwick.)'
    - choices: [Sing., Not tonight.]
      cancel: 1
      branches:
      - - {script: setBattleRule("double")}
        - {script: setBattleRule("canLose")}
        - {script: 'TrainerBattle.start(:OCTAVE_VESPER, "Vesper", 0, :OCTAVE_SINGER, "Lyra", 0)'}
        - 'Vesper: There. Your hands have stopped shaking. So have mine.'
      - ['Vesper: Then at the Festival. We''ll all be there. We always are.']
    - 'Vesper: Look after it. Whatever it becomes, it''ll become it because of you.'
    - switch: [VESPER_MET_SALTMERE, true]
    - {script: 'pf_trial_talk(:VESPER_SALTMERE)'}
  - cond: {switch: VESPER_MET_SALTMERE}
    graphic: {sprite: NPC 14, dir: down}
    trigger: action
    commands:
    - {script: 'pf_trial_talk(:VESPER_SALTMERE)'}
- type: event
  name: Lyra
  at: [6, 5]
  pages:
  - commands: []
  - cond: {switch: CH3_PAGEANT_DONE}
    graphic: {sprite: NPC 16, dir: left}
    trigger: action
    commands: ['Lyra: (humming) Sorry - it''s the Briarwick tune. The Wood hums it back if you sing it right. My Eevee thinks so, anyway.']
- type: event
  name: Eevee (Lyra)
  at: [7, 6]
  pages:
  - commands: []
  - cond: {switch: CH3_PAGEANT_DONE}
    graphic: {sprite: Followers/EEVEE, dir: left}
    trigger: action
    commands: ['(The Eevee sniffs at Understudy, then sits very straight, as if it has been told to.)']
