events:
- type: sign
  name: Glass-choked way
  at: [18, 33]
  post: false
  text: The old way south to Thistledown Lea is choked with glass. The Deepwood is the only way in or out now.
- type: warp
  name: To the Deepwood
  at: [0, 16]
  link: DEEP_COCOON
  arrive: [1, 16, right]
- type: event
  name: Atmosphere
  at: [0, 0]
  pages:
  - trigger: parallel
    commands:
    - {comment: 'fog: prismfall_glass (see REQUESTS.md item 3)'}
    - raw:
      - 204
      - [1, prismfall_glass, 0, 90, 1, 200, 1, 1]
    - selfswitch: [A, true]
  - cond: {self: A}
- type: event
  name: Escort setup
  at: [0, 1]
  pages:
  - trigger: parallel
    commands:
    - if: $game_self_switches[[548, 0, 'ESCORT']] && !$game_switches[107]
      then:
      - {script: "%w[Juno Tamsin].each do |n|\n  ev = $game_map.events.values.find { |e| e.name == n.tr('_', ' ') }\n  $game_self_switches[[$game_map.map_id,\
          \ ev.id, 'A']] = true if ev\nend\n$game_map.need_refresh = true"}
      else: []
    - selfswitch: [A, true]
  - cond: {self: A}
- type: event
  name: Juno
  at: [4, 15]
  pages:
  - commands: []
  - cond: {self: A}
    graphic: {sprite: trainer_RIVAL2, dir: right}
    commands: ['\pf[JUNO,neutral]Juno: Shout if— no. You can''t hear through it, can you. Just come back.']
- type: event
  name: Tamsin
  at: [3, 18]
  pages:
  - commands: []
  - cond: {self: A}
    graphic: {sprite: trainer_LASS, dir: right}
    commands: ['\pf[TAMSIN,sad]Tamsin: I can''t cross it. Nobody can. ...Except you, apparently. Gran would have had words for that.']
- type: event
  name: Veil 2
  at: [4, 15]
  pages:
  - cond: {switch: CH2_MATRIARCH_DONE}
    trigger: touch
    through: true
    commands:
    - if: $game_self_switches[[548, 0, 'OUTRO']]
      then: []
      else:
      - &id001
        if: pf_choice(:ch2_matriarch) == :soothe
        then: ['\pf[TAMSIN,crying]Tamsin: Half the grove. ...Half. And the moths that are left are *singing*. I''ll take half. I''ll take it.', '\pf[JUNO,happy]Juno:
            You stayed all night! We could see you through the shimmer, just sitting there! Kestrel would''ve hated it!']
        else: ['\pf[TAMSIN,shocked]Tamsin: It just... stopped. All of it.', '(The Matriarch walks out through the Veil, past them, into the wood. It doesn''t
            react to anything.)', '\pf[TAMSIN,neutral]Tamsin: Oh. Oh, that''s — thank you. I think.', '\pf[JUNO,sad]Juno: ...It didn''t look at me. They
            always look at me.']
      - '\pf[TAMSIN,neutral]Tamsin: The next Warden''s Marisol Reyes, in Ebbmouth. North over Spinners'' Rise, through the Rimewood and over the border.
        She''ll swear at you. It''s a compliment.'
      - '\pf[TAMSIN,happy]Tamsin: Come back, will you? I''d like to show you the room when it isn''t tangled.'
      - '\pf[JUNO,neutral]Juno: I''ve got to take the eggs to Uncle Rowan in Verdance. Forty eggs, one hatbox, no running.'
      - '\pf[JUNO,sad]Juno: I''m going to tell him about the Pageant. About what the man said about Verdance. I want to see his face when I tell him.'
      - &id002 {script: "%w[Juno Tamsin].each do |n|\n  ev = $game_map.events.values.find { |e| e.name == n }\n  ev.erase if ev\nend"}
      - {script: '$game_self_switches[[548, 0, ''OUTRO'']] = true'}
