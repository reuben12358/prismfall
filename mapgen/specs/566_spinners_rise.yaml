# Spinners' Rise (566). WRITTEN BY layouts/wave13_routes_craft.py (Wave 13 Rejuv V14 Craft).
id: 566
name: Spinners' Rise
parent: 0
bgm: Route 3
metadata: {Outdoor: true, ShowArea: true, BattleBack: field}
rubric: true
yards_ok: true
biome: route
field: MEADOW
tone: [0, 0, 4, 6]
connections:
- {dir: S, offset: 38, to: 120, to_offset: 52}
- {dir: N, offset: 42, to: 577, to_offset: 30}
walk_from:
- [40, 118]
- [44, 1]
raw: data/raw/566.npy
tileset: 53
events:
- type: sign
  name: Road sign
  at: [42, 112]
  text: 'SPINNERS'' RISE -- The Hoar Road. v Briarwick (North Gate) - ^ Frostwick Pass. The drove road: sheep have right of way. Sheep know it.'
  post: false
- type: event
  name: The Fleece Cross
  at: [50, 34]
  pages:
  - trigger: action
    commands: ['THE FLEECE CROSS. A market cross from the old wool fairs, hung with yarn tied by every spinner who ever sold here.', The newest ribbon is
        dyed with all three of the Ford's colours. It is still wet.]
- type: event
  name: Ribbon-tier
  at: [52, 36]
  pages:
  - graphic: {sprite: NPC 27, dir: down}
    trigger: action
    move: fixed
    commands: ['Ribbon-tier: Tie one for the road. The cross remembers who passed. The tax-man does too, but the cross is kinder.']
- type: event
  name: Shepherd
  at: [60, 92]
  pages:
  - graphic: {sprite: NPC 20, dir: down}
    trigger: action
    move: fixed
    commands: ['Shepherd: The hamlet sleeps anyone the fell catches out. Third cottage, door''s never locked. Mind the dog. The dog is a Lillipup and it
        is in charge.']
- type: event
  name: Third cottage
  at: [71, 91]
  pages:
  - trigger: action
    commands:
    - The third cottage. The door is never locked. A fire is laid, a kettle on the hob, and a Lillipup asleep across the threshold, in charge.
    - (You rest a while. The Lillipup permits it.)
    - {heal: true}
- type: event
  name: Shepherd boy
  at: [56, 78]
  pages:
  - graphic: {sprite: NPC 05, dir: down}
    trigger: action
    commands:
    - if: $game_variables[603] == 2
      then: ['Shepherd boy: You beat a Skiddo up the Rise. Nobody beats a Skiddo up the Rise. ...Again sometime?']
      else:
      - 'Shepherd boy: Race you to the Fleece Cross! My Skiddo knows every rock!'
      - choices: [Race him!, Not now.]
        cancel: 2
        branches:
        - - {script: '$game_variables[603] = 1

              $game_variables[604] = $stats.distance_walked'}
          - (He is gone in a scatter of gravel. Up the drove road to the cross -- go!)
          - selfswitch: [A, true]
        - ['Shepherd boy: Scared of a Skiddo? Fair. He headbutts.']
  - cond: {self: A}
    commands: []
- type: event
  name: Skiddo
  at: [57, 78]
  pages:
  - graphic: {sprite: Followers/SKIDDO, dir: down}
    trigger: action
    move: random
    commands: ['(It bleats, very pleased with itself.)']
- type: event
  name: Shepherd boy at the cross
  at: [53, 35]
  pages:
  - commands: []
  - cond:
      var: [ROAD_RAMRACE, 2]
    graphic: {sprite: NPC 05, dir: down}
    trigger: action
    commands:
    - if: $game_variables[603] >= 3
      then:
      - 'Shepherd boy: Been here ages. Ages! ...Again? Meet me at the hamlet.'
      - {script: '$game_variables[603] = 0'}
      else: ['Shepherd boy: You got here first. On FOOT. Skiddo is very upset with me.']
- type: event
  name: Sheep-wash
  at: [20, 57]
  pages:
  - trigger: action
    commands: [A stone sheep-wash fed by a cold spring. The water comes out of the hill already freezing.]
- type: event
  name: Hill-fort ring
  at: [40, 6]
  pages:
  - trigger: action
    commands: ['A ring of old earthworks on the summit. From here the Gossamer is a grey-green sea, and beyond it, the real one.']
- type: event
  name: Road Stone III
  at: [40, 116]
  pages:
  - trigger: action
    commands: ['ROAD STONE III. THE HOAR ROAD. "Briarwick 0, Frostwick 2." The frost has started at the top of the stone.']
- type: event
  name: Waterfall at the sheep-wash
  at: [14, 58]
  pages:
  - trigger: action
    commands: ['Behind the little fall at the sheep-wash, the rock goes back further than it should. The shepherds say nothing. Shepherds never do.']
- type: item
  at: [15, 61]
  item: SOFTSAND
- type: event
  name: Wooloo (lost lamb)
  at: [13, 60]
  pages:
  - graphic: {sprite: Followers/WOOLOO, dir: down}
    trigger: action
    move: fixed
    commands: ['(A Wooloo lamb, hidden in the cave with the best fleece. It looks at you as if you might be its shepherd.)']
- type: item
  at: [60, 91]
  item: POTION
- type: item
  at: [24, 40]
  item: SUPERPOTION
- type: item
  at: [70, 20]
  item: REPEL
- type: item
  at: [36, 10]
  item: STARDUST
  hidden: true
  name: HiddenItem (hill fort)
- type: berry
  at: [64, 93]
  berry: ASPEARBERRY
- type: event
  name: Ram Race finish 1
  at: [47, 33]
  pages:
  - trigger: touch
    through: true
    commands:
    - {script: "if $game_variables[603] == 1\n  steps = $stats.distance_walked - $game_variables[604]\n  ev = $game_map.events.values.find { |e| e.name\
        \ == 'Shepherd boy' }\n  $game_self_switches[[566, ev.id, 'A']] = false if ev\n  if steps <= 73\n    $game_variables[603] = 2\n    pbMessage(_INTL('You\
        \ reach the Fleece Cross first! A moment later the Skiddo skids up in a spray of gravel, and the boy stares.'))\n    pbMessage(_INTL('Shepherd boy:\
        \ ...You took the drove road. Nobody takes the drove road. Here, you won it fair.'))\n    pbReceiveItem(:QUICKCLAW)\n    pfm_set(:ram_race_won)\
        \ rescue nil\n  else\n    $game_variables[603] = 3\n    pbMessage(_INTL('The boy is already at the cross, lying in the grass with his hands behind\
        \ his head, pretending he has been there for hours.'))\n  end\n  $game_map.need_refresh = true\nend"}
