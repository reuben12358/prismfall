- type: event
  name: Night Bulletin
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - {script: pfm_fade_out(0)}
    - move:
        who: player
        route:
        - {script: 'moveto(7, 7)'}
        - turn_up
        wait: true
    - {script: pfm_fade_in(20)}
    - {script: 'pbSEPlay("PC access", 70, 80)'}
    - {script: '3.times { pfm_tone(-20, -16, 24, 30, 3); pfm_tone(-44, -36, -6, 40, 3) }'}
    - 'Gazette Reader: ...unmasked as the Grass Warden, Rowan Ashby of Verdance, who is in Directorate custody.'
    - 'Gazette Reader: The Conclave has extended the Mandate to every Lattice in the realm.'
    - 'Gazette Reader: In Lumen, Chairman Voss said Meridian "will carry this responsibility with the seriousness it deserves".'
    - 'Gazette Reader: One unidentified member of the public was seen to enter the Bleed.'
    - 'Gazette Reader: Witnesses report they were unharmed.'
    - move:
        who: player
        route: [through_on, down, left, left, through_off, turn_down]
        wait: true
    - 'GAZETTE: MOURNER IS GRASS WARDEN'
    - if: pf_choice(:ch9_teo_sable) == :save_teo
      then: ['GAZETTE: EBBMOUTH BOY PULLED FROM GLASS']
      else:
      - if: pf_choice(:ch9_teo_sable) == :chase_sable
        then: ['GAZETTE: WARDEN''S BROTHER LOST IN IRONREACH GLASS']
    - 'GAZETTE: HAMMER BOMBER STILL AT LARGE'
    - move:
        who: player
        route: [through_on, up, right, right, right, up, up, through_off, turn_up]
        wait: true
    - 'Nurse: The one who walked in. That was you.'
    - 'Nurse: ...Here. Your Pokémon are fine.'
    - {script: 'pbSEPlay("Anim/HealBell", 80, 100)

        $player.heal_party'}
    - {wait: 20}
    - 'Nurse: I checked them twice. I don''t know why I checked them twice.'
    - {script: pfm_fade_out(40)}
    - {wait: 30}
    - selfswitch: [A, true]
    - if: pf_interlude_start(2)
      then:
      - {script: 'pfm_card(:PF_IL2_CARD, "Five days earlier. Verdance.")'}
      - transfer: {map: 294, x: 8, y: 7, dir: down}
      else:
      - {script: 'pfm_card(:PF_ACT2_END, "END OF ACT II")'}
      - var: [CH9_STEP, 12]
      - var: [STORY_ACT, 3]
      - var: [STORY_CHAPTER, 10]
      - {script: 'pf_chapter_card(10) if defined?(pf_chapter_card)'}
      - {script: pfm_fade_in(30)}
    trigger: autorun
    move: fixed
    cond:
      var: [CH9_STEP, 11]
  - commands: []
    trigger: action
    move: fixed
    cond: {self: A}
  - commands: []
    trigger: action
    move: fixed
    cond:
      var: [CH9_STEP, 12]
