- type: event
  name: Morning
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - {script: pfm_fade_out(0)}
    - move:
        who: player
        route:
        - {script: 'moveto(7, 6)'}
        - turn_down
        wait: true
    - {script: pfm_fade_in(30)}
    - {wait: 20}
    - {script: 'pfm_face("Nell (morning)", :player)'}
    - 'Nell: You''re awake.'
    - 'Nell: Mum said not to wake you. I didn''t. I just waited very loudly.'
    - 'Nell: The lady with the flowers. Juno.'
    - 'Nell: She went up with the Sovereign''s people in the night. In the Sovereign''s own cage.'
    - 'Nell: She didn''t want to go and she didn''t want to stay.'
    - 'Nell: She left you this.'
    - move:
        who: Nell (morning)
        route: [up, turn_up]
        wait: true
    - {script: 'pbSEPlay("GUI storage pick up", 70, 110)'}
    - '"\PN — They''re taking me to Verdance. The Sovereign says I have to be there when they open his letter. I don''t know what letter. I don''t know anything any
      more. Come the long way if you want. I''d understand. I''d come the long way. — J."'
    - {script: 'pf_act("Nell (morning)", :hop) rescue nil'}
    - 'Nell: She saved me.'
    - 'Nell: The roots came up and she had her arms round me and I couldn''t see anything but flowers.'
    - 'Nell: Tell her I''ve got the neatest S in Ironreach and she can have it.'
    - move:
        who: Nell (morning)
        route: [down, turn_up]
        wait: true
    - {script: 'pfm_quest(:eighteen_roads, "Eighteen Roads", "Go to Verdance. Up the Root Road: the Tailings, the Rootdeep''s Lift Road, then the Crown Road west.")'}
    - selfswitch: [A, true]
    trigger: autorun
    move: fixed
    cond:
      var: [CH9_STEP, 12]
