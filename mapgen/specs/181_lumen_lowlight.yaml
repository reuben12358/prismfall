- type: event
  name: Dex
  pages:
  - commands:
    - '\pf[DEX,happy]Dex: FIZZBOLT! Fizzbolt, ice-cold, colder than the Thane''s heart! You two! You''re new! You''ve got new faces!'
    - 'Dex: I''m Dex. That''s Spark. Spark makes them cold. Watch.'
    - (The Pichu lays a paw on a bottle. A tiny zap. Frost blooms up the glass.)
    - {se: Anim/Thunder1}
    - '\pf[JUNO,happy]Juno: That''s AMAZING.'
    - '\pf[DEX,happy]Dex: Fifty a bottle. Thirty for you, because you said "amazing". Nobody says "amazing" down here. They say "how much".'
    - {script: 'pfm_item(:FIZZBOLT, 2, "FIZZBOLT") rescue nil'}
    - {script: '$player.money = [$player.money - 60, 0].max'}
    - 'Dex: You want the best airship view in Lumen? Not the Skyport, everyone goes to the Skyport. The laundry roof, there. You get the Spire''s top and
      the Crownwall and the Dauntless coming in, all at once.'
    - '\pf[DEX,happy]Dex: My sister Marlo works the night lift down to Nadir, and she says one night the cage didn''t stop at the bottom, it went right
      on down past it, into the old—'
    - {se: Bell}
    - '\pf[DEX,shocked]Dex: That''s the hour! The crew''ll want their sodas! Rook''s filming down here today, did you know? ROOK CALDER. In the LOWLIGHT.'
    - '\pf[DEX,happy]Dex: Tell you the rest tomorrow!'
    - var: [CH5_STEP, 4]
    trigger: touch
    move: fixed
    graphic: {sprite: NPC 02, dir: down}
    cond:
      var: [CH5_STEP, 3]
  - commands: ['Dex: Fizzbolt! Ice-cold! Spark says hi! (The Pichu does not say hi.)']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 02, dir: down}
    cond:
      var: [CH5_STEP, 4]
  at: [4, 7]
