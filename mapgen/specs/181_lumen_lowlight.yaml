- type: event
  name: Rook
  pages:
  - commands: ['\pf[ROOK,happy]Rook: Chat, look at that! New faces in the Lowlight!']
    trigger: action
    move: fixed
    graphic: {sprite: trainer_ROCKER, dir: down}
  - commands:
    - '\pf[ROOK,happy]Rook: —and THIS is the Lowlight, chat! The REAL Lumen! Ten years of light, and tonight we''ve brought it all the way down here—'
    - 'Director: Rook. You''re blocking the noodle cart.'
    - '\pf[ROOK,happy]Rook: —brought it all the way down here AND we''re supporting local noodles! Hi, Benno! Chat loves Benno!'
    - 'Benno: I don''t know what that means!'
    - '\pf[DEX,happy]Dex: Rook! Your sodas! That''s eleven you owe me now. Chat owes me eleven.'
    - '\pf[ROOK,happy]Rook: Chat, pay the man! ...Chat says it''ll pay you in exposure. Chat is a terrible person, Dex.'
    - '\pf[ROOK,neutral]Rook: (He sees you.) Oh. Challengers. Hi. Gym''s shut, sorry. The Spire wanted a "community special", and when the Spire wants a
      thing, the thing happens.'
    - '\pf[ROOK,happy]Rook: Chat says you look tired. Chat says—'
    - {se: Anim/Thunder3}
    - tone: [80, 80, 80, 0, 6]
    - 'Director: Rook, we''re pulling too much off the—'
    - tone: [-120, -120, -90, 40, 20]
    - (The floodlights die. Then the street lamps. Then every window, block by block. The Lowlight goes black. Somewhere a Pidove panics.)
    - '\pf[ROOK,shocked]Rook: —CHAT? Chat, are you there? Rotom, are we live?'
    - 'Rotom Drone: (bzzt) ...signal lost.'
    - '\pf[ROOK,panic]Rook: We''re not live. We''re not LIVE. I haven''t been not-live since I was fourteen.'
    - (In the dark, the junction boxes on the street corners start to glow from the inside, one after another. Something in each of them is giggling.)
    - 'Hob Carrow: (from his ladder) Rotom! The floods pulled ''em out of the Spire feed! They''re in the boxes, they''ll drink the whole block!'
    - '\pf[ROOK,neutral]Rook: Okay. Okay. I can do this. This is fine. This is content.'
    - '\pf[ROOK,panic]Rook: I can''t do this, my drone''s dead. You. You''ve got Pokémon that aren''t plugged into anything, right? Boxes. Corners. GO.'
    - switch: [424, true]
    - selfswitch: [A, true]
    trigger: action
    move: fixed
    graphic: {sprite: trainer_ROCKER, dir: down}
    cond:
      var: [CH5_STEP, 4]
  - commands: ['\pf[ROOK,panic]Rook: Boxes! Corners! GO! I''ll hold the... I''ll hold the camera. It''s off. I''ll hold it anyway.']
