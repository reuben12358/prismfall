- type: event
  name: Blackout ends
  pages:
  - commands: []
    trigger: action
    move: fixed
  - commands:
    - {se: PC open}
    - tone: [0, 0, 0, 0, 20]
    - (The hum of a whole block coming back. The floodlights flicker up, then the lamps, then the windows. The Lowlight cheers.)
    - '\pf[ROOK,happy]Rook: We''re back. WE''RE BACK. Chat! Chat, are you— (bzzt) —chat is saying "WHAT HAPPENED". Chat, you would not BELIEVE what happened.'
    - '\pf[ROOK,neutral]Rook: (quieter, with the drone pointed away) Thanks. Really. I''m not good in the dark. Nobody up there''s good in the dark. That''s
      kind of the whole problem with up there.'
    - '\pf[ROOK,happy]Rook: Gym''s open! Circuit Gym, west side of the Concourse. Come and lose on camera. It''s the best way to lose!'
    - '\pf[JUNO,happy]Juno: He''s lovely! Is he always like that?'
    - '\pf[ROOK,deadpan]Rook: Chat says yes. Chat says I''m "a lot".'
