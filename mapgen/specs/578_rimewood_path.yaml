- type: sign
  name: Road sign
  at: [44, 84]
  text: 'RIMEWOOD PATH -- The Hoar Road. v Frostwick (North Gate) - ^ The Rimewood. Blazes: white is the path. Blue is not.'
  post: false
- type: event
  name: The Lantern Birch
  at: [41, 40]
  pages:
  - trigger: action
    commands:
    - THE LANTERN BIRCH. Trappers hang a light here for whoever is late. Tonight it is out.
    - if: PBDayNight.isNight? && !pfm?(:lantern_birch)
      then:
      - You relight the lantern. Somewhere down the path, someone laughs with relief.
      - {script: 'pbReceiveItem(:NEVERMELTICE)'}
      - {script: 'pfm_set(:lantern_birch)'}
- type: event
  name: Charcoal kiln
  at: [7, 52]
  pages:
  - trigger: action
    commands: ['The charcoal burners'' kiln, banked and smoking. Warm, for once.']
- type: event
  name: Charcoal burner
  at: [11, 55]
  pages:
  - graphic: {sprite: NPC 03, dir: down}
    trigger: action
    move: fixed
    commands: ['Charcoal burner: Elowen wood, Isenmar fire. Best charcoal in two kingdoms. Neither will admit it.', 'Charcoal burner: Came the long way
        round? The brook''s quicker. Step on the ice by the stair and let it take you.']
- type: event
  name: Trapper
  at: [63, 73]
  pages:
  - graphic: {sprite: NPC 22, dir: down}
    trigger: action
    move: fixed
    commands:
    - 'Trapper: Lean-to''s yours if you need it. The fire''s honest.'
    - {heal: true}
- type: event
  name: Snare line
  at: [19, 50]
  pages:
  - trigger: action
    commands:
    - A snare line along the brook. One snare has caught a very cross Teddiursa.
    - if: '!pfm?(:teddiursa_freed)'
      then:
      - You loosen the wire. The Teddiursa bolts, then stops, and looks back at you for a long moment.
      - {script: 'pfm_set(:teddiursa_freed)'}
- type: event
  name: Honey-stump hives
  at: [58, 80]
  pages:
  - trigger: action
    commands: ['Hives in old stumps, glazed with frost. The Combee inside are slow and very, very offended.']
- type: event
  name: Woodcutter
  at: [25, 79]
  pages:
  - graphic: {sprite: NPC 25, dir: down}
    trigger: action
    move: fixed
    commands: ['Woodcutter: Sledge of logs for Frostwick. Pulling it uphill builds character. Pulling it downhill builds speed.']
- type: event
  name: The Long Ice
  at: [37, 48]
  pages:
  - trigger: action
    commands: [THE LONG ICE. The Hoar Brook froze straight as a rule under the crag. Trappers ride it to the burners on their boot soles.]
- type: event
  name: Frozen fall
  at: [4, 48]
  pages:
  - trigger: action
    commands: ['(The Hoar Brook comes over the crag here, frozen mid-fall into a column of blue glass.)']
- type: event
  name: Blue blaze
  at: [45, 15]
  pages:
  - trigger: action
    commands: [A blue blaze on a birch. The path is the white ones. This one points off into the trees., 'Faint Stantler tracks lead off the path. Follow
        them, and only them.']
- type: event
  name: Stantler tracks
  at: [57, 17]
  pages:
  - trigger: action
    commands: ['Hoofprints in the crust, heading east. The other ways out of the glade are clean snow.']
- type: event
  name: 'Stantler tracks '
  at: [69, 16]
  pages:
  - trigger: action
    commands: ['Hoofprints in the crust, heading north now.']
- type: event
  name: The Unblazed
  at: [63, 2]
  pages:
  - trigger: action
    commands: ['(A clearing where the Stantler herd sleeps standing up. The tracks end here, in a hundred others.)']
- type: event
  name: Stantler stag
  at: [67, 3]
  pages:
  - graphic: {sprite: Followers/STANTLER, dir: down}
    trigger: action
    commands:
    - '(The stag lowers its antlers. The herd does not move: this is between you and him.)'
    - {script: 'WildBattle.start(:STANTLER, 19)'}
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: Followers/STANTLER, dir: left}
    trigger: action
    commands: ['(The stag watches you, unblinking. The herd lets you pass.)']
- type: event
  name: Stantler
  at: [64, 5]
  pages:
  - graphic: {sprite: Followers/STANTLER, dir: left}
    trigger: action
    move: fixed
    commands: [(It is asleep standing up. One ear follows you.)]
- type: event
  name: Silk-fall
  at: [67, 32]
  pages:
  - trigger: action
    commands: [THE SILK-FALL. Silk drifted off the Gossamer for a hundred years and froze where it landed. It rings when the wind moves it.]
