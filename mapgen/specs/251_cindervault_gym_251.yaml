- type: event
  name: Apprentice Hessa
  at: [18, 22]
  pages:
  - graphic: {sprite: NPC 13, dir: left}
    trigger: action
    move: fixed
    commands:
    - {script: "st_fn = proc do |v|\n  x = $game_variables[v].to_i\n  x == 0 ? \"Empty\" : (x == 1 ? \"MOLTEN\" : \"IRON BRIDGE\")\nend\nm_fn = proc { |s|\
        \ $game_switches[s] ? \"CAST IRON\" : \"Empty pit\" }\ncmds = [_INTL(\"Check foundry status\"), _INTL(\"Reset the foundry\"), _INTL(\"Ask for a\
        \ hint\")]\ncan_skip = ($game_switches[301] == true)\ncmds.push(_INTL(\"Skip puzzle (puzzleskip)\")) if can_skip\ncmds.push(_INTL(\"Never mind\"\
        ))\nc = pbMessage(_INTL(\"Apprentice Hessa: Brann says pour where it hurts, not where it's easy. Need a hand on the Pour Floor?\"), cmds, cmds.length)\n\
        if c == 0\n  q = ($game_variables[338].to_i == 0) ? \"1 charge ready\" : \"DRY (0 left)\"\n  k1 = $game_switches[335] ? \"Spent\" : ($game_variables[335].to_i\
        \ == 0 ? \"aimed X1\" : \"aimed X2\")\n  k2 = $game_switches[336] ? \"Spent\" : ($game_variables[336].to_i == 0 ? \"aimed X2\" : \"aimed X3\")\n\
        \  k3 = $game_switches[337] ? \"Spent\" : ($game_variables[337].to_i == 0 ? \"aimed X1\" : \"aimed X3\")\n  pbMessage(_INTL(\"Crucibles: K1={1},\
        \ K2={2}, K3={3}. Quench cistern: {4}.\", k1, k2, k3, q))\n  pbMessage(_INTL(\"Upstairs channels: X1={1}, X2={2}, X3={3}.\\nMoulds below: M1={4},\
        \ M2={5}, M3={6}.\",\n                  st_fn.call(435), st_fn.call(436), st_fn.call(437),\n                  m_fn.call(435), m_fn.call(436), m_fn.call(437)))\n\
        elsif c == 1\n  if pbConfirmMessage(_INTL(\"Reset all crucibles, channels, moulds, and refill the quench cistern?\"))\n    pbSEPlay(\"Anim/Water2\"\
        , 85, 95)\n    pbFadeOutIn do\n      [335, 336, 337, 338, 435, 436, 437].each { |v| $game_variables[v] = 0 }\n      [335, 336, 337, 435, 436, 437].each\
        \ { |s| $game_switches[s] = false }\n      $game_player.moveto(14, 23)\n      $game_player.turn_up\n      $game_map.need_refresh = true\n    end\n\
        \    pbMessage(_INTL(\"Crucibles refilled, moulds cleared, and the quench cistern topped up to 1 charge!\"))\n  end\nelsif c == 2\n  h = (pfm_get(:g7_hint).to_i\
        \ rescue 0)\n  if h == 0\n    pbMessage(_INTL(\"Hessa (Hint 1): Brann never wastes a pour. Whatever channel is still MOLTEN when you drop down a\
        \ chute drains down and casts the matching mould below!\"))\n  elsif h == 1\n    pbMessage(_INTL(\"Hessa (Hint 2): You only get ONE quench upstairs.\
        \ Look at the floor below: M1 and M3 can carry you across, but M2 only leads to Brann's side vault — NOT to the second chute! So which single channel\
        \ MUST be quenched upstairs?\"))\n  else\n    pbMessage(_INTL(\"Hessa (Full Solution): 1) Aim K1->X2, K2->X3, K3->X1 and pour all three. 2) Pull\
        \ Quench Valve Q2 ONLY (X2 becomes iron). 3) Drop down Chute C1 (X1 and X3 drain to cast M1 and M3 below!). 4) Cross M1 -> climb Ladder H -> cross\
        \ X2 -> drop Chute C2 -> cross M3 -> climb North Ladder to Brann!\"))\n  end\n  (pfm_set(:g7_hint, [h + 1, 2].min) rescue nil)\nelsif can_skip &&\
        \ c == 3\n  pbSEPlay(\"Anim/metal\", 90, 90)\n  $game_variables[435] = 0\n  $game_variables[436] = 2\n  $game_variables[437] = 0\n  $game_variables[338]\
        \ = 1\n  $game_switches[335] = true\n  $game_switches[336] = true\n  $game_switches[337] = true\n  $game_switches[435] = true\n  $game_switches[437]\
        \ = true\n  $game_map.need_refresh = true\n  pbMessage(_INTL(\"Hessa throws the master bypass! M1 and M3 are cast below, and X2 is quenched upstairs\
        \ — head down Chute C1!\"))\nend"}
