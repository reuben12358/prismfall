        \ straight into mould(s): {1}!\", drained.join(\", \")))\n  end\n  pbSEPlay(\"Door exit\", 85, 100)\n  pbFadeOutIn do\n    $game_temp.player_new_map_id\
        \ = 252\n    $game_temp.player_new_x = 14\n    $game_temp.player_new_y = 23\n    $game_temp.player_new_direction = 2\n    $scene.transfer_player\n\
        \  end\nelse\n  pbMoveRoute($game_player, [PBMoveRoute::BACKWARD], true)\nend"}
