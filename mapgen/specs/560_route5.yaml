- type: event
  name: Customs chain 1
  at: [34, 11]
  pages:
  - graphic: {tile: 18119}
    trigger: action
    commands:
    - if: $game_player.x < 34
      then:
      - An Isenmar customs chain across the causeway, hooked on this side.
      - You unhook it. The chain clanks into the snow.
      - {script: "for i in 1..4\n  ev = $game_map.events.values.find { |e| e.name == \"Customs chain #{i}\" }\n  $game_self_switches[[560, ev.id, 'A']]\
          \ = true if ev\nend\n$game_map.need_refresh = true"}
      else: ['An Isenmar customs chain across the causeway. ISENMAR CUSTOMS: CLOSED. It is hooked from the far side.']
  - cond: {self: A}
    through: true
    commands: []
