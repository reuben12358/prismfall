events:
- type: sign
  name: Border Stones
  at: [29, 10]
  text: 'Two old stones. One bears Elowen''s briar crown, the other Isenmar''s whale and axe.

    A brass Meridian sunburst has been bolted across both of them. The bolts are new.'
  post: false
- type: sign
  name: Route sign
  at: [60, 11]
  text: 'FROSTFLAT CAUSEWAY

    N (at the west end): Frostwick   E: Saltmere'
  post: false
- type: sign
  name: Old salt road
  at: [32, 25]
  text: The old salt road dips toward a drowned pier village. Something replays there, over and over.
  post: false
- type: event
  name: Royal forester
  at: [33, 10]
  pages:
  - graphic: {sprite: NPC 14, dir: down}
    trigger: action
    move: fixed
    commands:
    - Past the stones the trees wear coats. Ice ones. You'll see.
    - Elowen ends here, officially. Unofficially it ends wherever the honey runs out.
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: NPC 14, dir: down}
    trigger: action
    move: fixed
    commands: [Mind the frost-pans west of here. They're slick as a courtier.]
- type: event
  name: Fur-trader
  at: [22, 13]
  pages:
  - graphic: {sprite: NPC 22, dir: down}
    trigger: action
    move: fixed
    commands:
    - My Spheal pulls the sled. Lovely creature. Round.
    - '...The problem is the sled is on a SLOPE, and Spheal is ALSO round.'
    - If you see a sled rolling toward Saltmere with a Spheal on it, wave. It likes that.
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: NPC 22, dir: down}
    trigger: action
    move: fixed
    commands: [Still no sled. Still no Spheal. Still a lovely day.]
- type: event
  name: Meridian surveyor
  at: [20, 6]
  pages:
  - graphic: {sprite: NPC 16, dir: left}
    trigger: action
    move: fixed
    commands: ['*tink* *tink* Survey peg. Lattice line. Don''t touch.', 'Who authorised it? The Meridian. Who authorised the Meridian? ...Move along, please.']
- type: trainer
  at: [48, 10]
  sight: 4
  dir: down
  sprite: trainer_PICNICKER
  trainer: [PICNICKER, Sela]
  intro: Salt-flat picnic! Bring your own shade!
  after: Isenmar's colder than I thought.
- type: trainer
  at: [41, 20]
  sight: 4
  dir: up
  sprite: trainer_HIKER
  trainer: [HIKER, Halvor]
  intro: Thirty years I've carted salt down this road! Show me something new!
  after: Salt in my boots, frost in my beard. Good trade.
- type: trainer
  at: [9, 21]
  sight: 4
  dir: right
  sprite: trainer_LASS
  trainer: [LASS, Tilde]
  intro: Did you slide here too? Everyone slides here.
  after: My Swinub slid farther than me.
- type: trainer
  at: [18, 10]
  sight: 4
  dir: down
  sprite: trainer_SAILOR
  trainer: [SAILOR, Haakon]
  intro: Sealer out of Ebbmouth! The sea's too thick to row, so I walk!
  after: Ice'll break by summer. Probably.
- type: trainer
  at: [26, 21]
  sight: 4
  dir: up
  sprite: trainer_BIRDKEEPER
  trainer: [BIRDKEEPER, Ailsa]
  intro: The gulls change colour past the stones. Watch!
  after: Frostwick's gulls wear little ice hats. Not really.
