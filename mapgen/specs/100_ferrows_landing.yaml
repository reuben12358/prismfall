      - '\pf[LARCH,neutral,,Larch (sendoff)]Larch: Eighteen gyms. Briarwick''s first, up through the Gossamer Wood. The Warden''s a girl called Tamsin Loom.
        Go easy on her, she inherited the seat in spring and hasn''t slept since.'
      - '\pf[LARCH,neutral,,Larch (sendoff)]Larch: Write to me. I mean it. Gale Post, every town. If I don''t hear from you in a week I start Lecture Two
        by post.'
      - '\pf[JUNO,happy,,Juno (sendoff)]Juno: I''m coming as far as Briarwick! Uncle Rowan wants silk-moth eggs, and I want to see a gym!'
      - {script: 'pfm_item(:TOWNMAP, 1)'}
