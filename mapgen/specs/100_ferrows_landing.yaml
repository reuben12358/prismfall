events:
- type: sign
  at: [33, 4]
  text: FERROW'S LANDING — Elowen's Door on the Sea. Pop. 212 and one lighthouse.
- type: sign
  at: [30, 29]
  post: false
  name: Accord plaque
  text: 'An old bronze Accord plaque: "Eighteen in Concord, One in Keeping."'
- type: event
  name: Customs scan
  at: [33, 44]
  pages: &id001
  - cond: {switch: PRO_FERRY_DONE}
    trigger: touch
    commands:
    - 'Calla Wren: Next! Meridian customs. Hold still for the Imprint scan.'
    - {se: Battle ball shake}
    - 'Every passenger before you got a colored tint bar. Yours reads blank: NULL.'
    - 'Calla Wren: ...That''s not right. Again.'
    - {se: Battle ball shake}
    - NULL.
    - 'Aurelian Voss: Faulty unit. These things hate sea air. Let them through, Calla.'
    - He glances back at you, once.
    - switch: [PRO_SCANNED_NULL, true]
    - var: [STORY_ACT, 1]
    - var: [STORY_CHAPTER, 1]
  - cond: {switch: PRO_SCANNED_NULL}
- type: event
  name: Customs scan 2
  at: [34, 44]
  pages: *id001
- type: event
  name: Customs scan 3
  at: [35, 44]
  pages: *id001
- type: event
  name: Calla Wren
  at: [32, 43]
  pages:
  - graphic: {sprite: trainer_SCIENTIST, dir: right}
    commands: ['Calla Wren: Meridian customs. Everyone gets scanned. Everyone.']
  - cond: {switch: PRO_SCANNED_NULL}
    graphic: {sprite: trainer_SCIENTIST, dir: right}
    commands: ['Calla Wren: Faulty unit, he says. Sure.', (She's looking at something on her screen.)]
- type: event
  name: Captain Edda
  at: [35, 56]
  pages:
  - cond: {switch: PRO_FERRY_DONE}
    graphic: {sprite: trainer_SAILOR, dir: left}
    commands:
    - 'Captain Edda Morrow: That''s the last of you. The Dovetail sails back at dusk, empty.'
    - choices: ['Good luck, Captain', Take me back with you]
      cancel: 1
      branches:
      - ['Captain Edda Morrow: Luck''s for people who don''t check their knots. Off with you, sprog.']
      - - 'Captain Edda Morrow: Last chance, sprog. Once I cast off, that''s it.'
        - choices: ['...Never mind', Take me home]
          cancel: 1
          branches:
          - ['Captain Edda Morrow: Thought so.']
          - - {script: 'Prismfall.game_over(:GO_HOMEWARD)'}
- type: event
  name: Fisherman
  at: [33, 51]
  pages:
  - graphic: {sprite: trainer_FISHERMAN, dir: left}
    commands:
    - 'Fisherman: The ferry won''t sail again. Fish don''t care, though. Here - every coast kid needs one.'
    - {script: 'pbReceiveItem(:OLDROD)'}
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: trainer_FISHERMAN, dir: left}
    commands: ['Fisherman: Cast off the end of the pier. Tentacool bite at dusk.']
- type: event
  name: Coll Hale
  at: [38, 19]
  pages:
  - graphic: {sprite: NPC 03, dir: down}
    commands: ['Coll Hale: You''re the Larch kid? Eat this. You''re too thin.', He hands you a bramble tart. It's still warm.]
- type: event
  name: Wenna Hale
  at: [40, 19]
  pages:
  - graphic: {sprite: NPC 11, dir: down}
    commands:
    - 'Wenna Hale: Juno''s at the Station with the Professor. Tell her to come home for supper. She won''t.'
    - 'Wenna Hale: Here - Juno''s old Pokégear. She upgraded. You''ll want a map and a phone in this place.'
    - {script: $player.has_pokegear = true}
    - \PN received a Pokégear!
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: {sprite: NPC 11, dir: down}
    commands: ['Wenna Hale: Juno''s at the Station with the Professor. Tell her to come home for supper. She won''t.']
- type: event
  name: Kestrel K1
  at: [16, 27]
  pages:
  - cond: {switch: CH1_STARTER_GOT}
    trigger: autorun
    graphic: {sprite: trainer_RIVAL1, dir: up}
    commands:
    - 'Kestrel: Hey. Tourist. Let''s see if you can actually use that thing.'
    - if: 'Prismfall.rival_battle(:RIVAL_KESTREL, "Kestrel", 1, can_lose: true)'
      then: ['Kestrel: ...Tch. Beginner''s luck.']
      else: ['Kestrel: Figures.']
    - {heal: true}
    - 'Kestrel: You came in on the last ferry? Great. Velmora''s sinking and they''re still letting tourists on.'
    - switch: [CH1_K1_DONE, true]
  - cond: {switch: CH1_K1_DONE}
- type: item
  at: [5, 34]
  item: POTION
- type: item
  at: [52, 38]
  item: POKEBALL
  hidden: true
- type: event
  name: Crier
  at: [28, 30]
  pages:
  - graphic: {sprite: NPC 14, dir: down}
    move: random
    commands: ['Crier: Hear ye! The Strait is closed! The Festival of Champions proceeds as planned, in the autumn, by grace of the Sovereign!', 'Crier:
        ...I don''t know how both of those are true either. I just read the card.']
- type: event
  name: Rope-skipping Girl 1
  at: [36, 30]
  pages:
  - graphic: &id002 {sprite: NPC 29, dir: down}
    move: fixed
    commands:
    - 'Rope-skipping Girl 1: One for the weaver, two for the stage,'
    - 'Rope-skipping Girl 2: three for the river that won''t turn its page!'
    - 'Rope-skipping Girl 1: Four for the lantern, five for the dune,'
    - 'Rope-skipping Girl 2: six for the fen and its poison-blue moon!'
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: *id002
    move: fixed
    commands: ['Rope-skipping Girl 1: ...and none for the cage, and none for the king! You''re out!', 'Rope-skipping Girl 2: I''m NOT out, you said "king"
        too fast!']
- type: event
  name: Kelp-drier
  at: [33, 22]
  pages:
  - graphic: {sprite: NPC 22, dir: down}
    move: fixed
    commands: ['Kelp-drier: Kelp for the Professor''s tea. I''ve offered to stop. She says no. I''ve offered to pay HER.']
- type: event
  name: Old Sailor
  at: [45, 29]
  pages:
  - graphic: {sprite: trainer_SAILOR, dir: down}
    move: random
    commands: ['Old Sailor: That chain across the harbor? My grandfather forged the links. He''d be proud and furious.']
- type: event
  name: Meridian Linesman
  at: [20, 28]
  pages:
  - graphic: &id003 {sprite: trainer_SCIENTIST, dir: down}
    move: fixed
    commands:
    - 'Meridian Linesman: Don''t mind the gate, it''s just for counting. We''re putting lamps along the quay next month. Free light. You''ll like it.'
    - selfswitch: [A, true]
  - cond: {self: A}
    graphic: *id003
    move: fixed
    commands: ['Meridian Linesman: The old lamplighter? He''s got a pension. ...I think he''s got a pension.']
- type: event
  name: Lamplighter
  at: [34, 37]
  pages:
  - graphic: {sprite: NPC 26, dir: down}
    move: fixed
