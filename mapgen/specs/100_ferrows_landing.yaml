      - [It hops onto your arm. It keeps the bottle cap.]
      - [It bites you. Then it hops onto your arm anyway.]
      cancel: 0
    - {script: 'pfm_set(:wingull_found)'}
    - selfswitch: [B, true]
    trigger: action
    move: fixed
    graphic: {sprite: Followers/WINGULL, dir: down}
    cond: {self: A}
    step_anime: true
  - commands: []
    trigger: action
    move: fixed
