- type: event
  name: Wenna Hale
  pages:
  - commands:
    - if: '!pfm?(:wenna_tart)'
      then: &id001
      - '\pf[WENNA,happy]Wenna: Tarts! Bramble tarts! Last of the— oh. You came off the ferry.'
      - '\pf[WENNA,shocked]Wenna: You''re the one Imelda''s been pacing about. Look at you. You''re a coat hanger with a bag.'
      - '\pf[WENNA,happy]Wenna: Eat this. No, don''t pay me. Eat it where I can see you.'
      - {script: 'pfm_item(:BRAMBLETART, 1, "Bramble Tart")'}
      - Restores 30 HP. Still warm. Tastes like somebody's kitchen.
      - '\pf[WENNA,neutral]Wenna: My Juno works up at the station. Talks like a kettle. You''ll like her. Everyone does, it''s exhausting.'
      - '\pf[WENNA,neutral]Wenna: And take Juno''s old Pokégear. She''s upgraded. You''ll want a map and a phone in this place.'
      - {script: $player.has_pokegear = true}
      - \PN received a Pokégear!
      - {script: 'pfm_set(:wenna_tart)'}
      else: ['\pf[WENNA,neutral]Wenna: My Juno works up at the station. Talks like a kettle. You''ll like her. Everyone does, it''s exhausting.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 19, dir: down}
  - commands:
    - if: '!pfm?(:wenna_tart)'
      then: *id001
      else: ['\pf[WENNA,happy]Wenna: She named your little group? Of course she did. She named the kettle.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 19, dir: down}
    cond: {switch: CH1_STARTER_GOT}
  - commands:
    - if: '!pfm?(:wenna_tart)'
      then: *id001
    - if: '!$game_self_switches[[523, 0, ''BISCUIT'']]'
      then:
      - (Biscuit hops off your head and into Wenna's apron pocket. He rattles.)
      - '\pf[WENNA,happy]Wenna: Oh, you wretched animal. Thank you. Both of you. Here. And another tart, for the nerves. Mine.'
      - {script: 'pfm_item(:ORANBERRY, 3)'}
      - {script: 'pfm_quest_done(:biscuit)'}
      - {script: '$game_self_switches[[523, 0, ''BISCUIT'']] = true'}
      - '\pf[WENNA,neutral]Wenna: Now. It''s getting dark, you''ve glass in your hair, and the inn''s full of people with nowhere to be.'
      - 'Wenna: You''re sleeping here tonight. That wasn''t a question. I don''t do questions after sundown.'
      - '\pf[JUNO,happy]Juno: You can have my bed! I''ll take the hayloft. I always take the hayloft when we have guests.'
      - 'Juno: We''ve never had guests. I''m very excited about the hayloft.'
      - '\pf[COLL,deadpan,,Coll Hale]Coll: Hayloft''s got a Skiddo in it.'
      - 'Juno: I''m excited about the Skiddo.'
      - '\pf[WENNA,happy]Wenna: Supper''s whenever you come in. Coll made the bed, so it''s made badly. But it''s made.'
      - 'OBJECTIVE: Sleep at the Hale Farmhouse. (Nobody takes the Strand Road west after dark.)'
      - {script: 'pfm_set(:biscuit_reward)'}
      else:
      - if: $game_variables[102] < 2
        then: ['\pf[WENNA,neutral]Wenna: Going up to the lighthouse? Give Hesper my love, and don''t let her give you any back. Bed''s yours whenever.']
        else: ['\pf[WENNA,sad]Wenna: She told me about the orchard. That was the Pruetts'' place. They had apples when I was a girl.']
    trigger: action
    move: fixed
    graphic: {sprite: NPC 19, dir: down}
    cond: {switch: CH1_ORCHARD_DONE}
  at: [39, 44]
- type: event
  name: Coll Hale
  pages:
  - commands: ['\pf[COLL,neutral]Coll: Mm. Ferry child.', '\pf[COLL,neutral]Coll: Farm''s up the lane if you need a bed. Wenna''ll say the same but with
        more words.', '\pf[COLL,deadpan]Coll: ...Did she give you a tart? Then you''re family. That''s how it works. I didn''t make the rules.']
