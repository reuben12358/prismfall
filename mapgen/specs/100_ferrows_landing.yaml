- type: event
  name: Girl with Wingull
  pages:
  - commands:
    - if: pfm?(:wingull_back)
      then: ['Girl: Captain Edda''s grounded. She doesn''t know what that means. Neither do I.']
      else:
      - if: pfm?(:wingull_found)
        then:
        - 'Girl: CAPTAIN! You''re in so much trouble. Here, ferry person, she wants you to have this.'
        - The Wingull drops the bottle cap at your feet, then changes its mind and takes it back.
        - {script: 'pfm_item(:SHARPBEAK, 1)'}
        - A Wingull's idea of a fair trade.
        - '\pf[EDDA,deadpan,,Captain Edda]Edda: ...What did she call that bird?'
        - {script: 'pfm_set(:wingull_back)'}
        - {script: 'pfm_quest_done(:wingull)'}
        - {script: 'pbSetSelfSwitch(%EV[Wingull (with girl)]%, "A", true)'}
        else:
        - if: pfm_quest?(:wingull)
          then: ['Girl: She''s on the lighthouse rocks! I''m not allowed there! You''re allowed everywhere, you''re a ferry person!']
          else:
          - if: $game_switches[@@PRO_SCANNED_NULL] && pfm?(:wingull_talked)
            then:
            - 'Girl: Captain Edda flew off! The gate went BING and she got scared! She''s on the lighthouse rocks and I''m not allowed there!'
            - {script: 'pfm_quest(:wingull, "Captain Edda", "Find the Wingull on the lighthouse rocks.")'}
            - {script: 'pbSetSelfSwitch(%EV[Wingull (rocks)]%, "A", true)'}
            else:
            - 'Girl: She''s called Captain Edda. The real Captain Edda doesn''t know. Don''t tell her.'
            - {script: 'pfm_set(:wingull_talked)'}
    trigger: action
    move: fixed
    graphic: {sprite: NPC 16, dir: down}
