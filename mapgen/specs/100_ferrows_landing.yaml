events:
  - {type: sign, at: [18, 2], text: "FERROW'S LANDING\nLast harbour of the Evergreen Crown."}
  - {type: sign, at: [11, 15], post: false, name: Accord plaque,
     text: "An old bronze Accord plaque: \"Eighteen in Concord, One in Keeping.\""}
  # --- Prologue scene 2: the customs scan at the land end of the pier (STORY 2 -> 3)
  - &scan
    type: event
    name: Customs scan
    at: [19, 23]
    pages:
      - cond: {var: [STORY, 2]}
        trigger: touch
        commands:
          - "Calla Wren: Next! Meridian customs. Hold still for the Imprint scan."
          - {se: Battle ball shake}
          - "Every passenger before you got a colored tint bar. Yours reads blank: NULL."
          - "Calla Wren: ...That's not right. Again."
          - {se: Battle ball shake}
          - "NULL."
          - "Aurelian Voss: Faulty unit. These things hate sea air. Let them through, Calla."
          - "He glances back at you, once."
          - {var: [STORY, 3]}
      - cond: {var: [STORY, 3]}
  - {<<: *scan, name: Customs scan 2, at: [20, 23]}
  - {<<: *scan, name: Customs scan 3, at: [21, 23]}
  - type: event
    name: Calla Wren
    at: [16, 23]
    pages:
      - graphic: {sprite: trainer_SCIENTIST, dir: right}
        commands: ["Calla Wren: Meridian customs. Everyone gets scanned. Everyone."]
      - cond: {var: [STORY, 3]}
        graphic: {sprite: trainer_SCIENTIST, dir: right}
        commands: ["Calla Wren: Faulty unit, he says. Sure.", "(She's looking at something on her screen.)"]
  # --- GO-01: ask Captain Edda to take you back
  - type: event
    name: Captain Edda
    at: [21, 29]
    pages:
      - cond: {var: [STORY, 2]}
        graphic: {sprite: trainer_SAILOR, dir: left}
        commands:
          - "Captain Edda Morrow: That's the last of you. The Dovetail sails back at dusk, empty."
          - choices: ["Good luck, Captain", "Take me back with you"]
            cancel: 1
            branches:
              - ["Captain Edda Morrow: Luck's for people who don't check their knots. Off with you, sprog."]
              - - "Captain Edda Morrow: Last chance, sprog. Once I cast off, that's it."
                - choices: ["...Never mind", "Take me home"]
                  cancel: 1
                  branches:
                    - ["Captain Edda Morrow: Thought so."]
                    - [{script: "Prismfall.game_over(:GO_LAST_FERRY)"}]
  # --- Chapter 1 flavour
  - type: event
    name: Coll Hale
    at: [24, 11]
    pages:
      - graphic: {sprite: NPC 03, dir: down}
        commands:
          - "Coll Hale: You're the Larch kid? Eat this. You're too thin."
          - "He hands you a bramble tart. It's still warm."
  - {type: npc, name: Wenna Hale, at: [25, 11], sprite: NPC 11, dir: down,
     text: "Wenna Hale: Juno's at the Station with the Professor. Tell her to come home for supper. She won't."}
  - {type: npc, name: Skipping children, at: [13, 13], sprite: NPC 07, move: random,
     text: "One for the weaver, two for the stage,\nthree for the river that won't turn its page,\nfour for the lantern, five for the dune...!"}
  - type: event
    name: Fisherman
    at: [21, 27]
    pages:
      - graphic: {sprite: trainer_FISHERMAN, dir: left}
        commands:
          - "Fisherman: The ferry won't sail again. Fish don't care, though. Here - every coast kid needs one."
          - {script: "pbReceiveItem(:OLDROD)"}
          - {selfswitch: [A, true]}
      - cond: {self: A}
        graphic: {sprite: trainer_FISHERMAN, dir: left}
        commands: ["Fisherman: Cast off the end of the pier. Tentacool bite at dusk."]
  # --- K1: Kestrel at the Sanctuary gate after the starter (STORY 4 -> 5)
  - type: event
    name: Kestrel K1
    at: [19, 10]
    pages:
      - cond: {var: [STORY, 4]}
        trigger: autorun
        graphic: {sprite: trainer_RIVAL1, dir: up}
        commands:
          - "Kestrel: Hey. Tourist. Let's see if you can actually use that thing."
          - if: 'Prismfall.rival_battle(:RIVAL_KESTREL, "Kestrel", 1, can_lose: true)'
            then: ["Kestrel: ...Tch. Beginner's luck."]
            else: ["Kestrel: Figures."]
          - {heal: true}
          - "Kestrel: You came in on the last ferry? Great. Velmora's sinking and they're still letting tourists on."
          - {var: [STORY, 5]}
      - cond: {var: [STORY, 5]}
  - {type: item, at: [3, 12], item: POTION}
  - {type: item, at: [37, 10], item: POKEBALL, hidden: true}
