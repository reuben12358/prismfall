events:
- type: event
  name: Customs gate 1
  pages:
  - commands:
    - '\pf[CALLA,neutral,,Calla]Calla: Next, please. Hold still.'
    - {se: Pkmn exp full}
    - {wait: 20}
    - The bar stays dark.
    - {wait: 40}
    - '\pf[CALLA,neutral,,Calla]Calla: One moment.'
    - {se: GUI sel buzzer}
    - 'The bar flickers, and a word scrolls across it: NULL.'
    - '\pf[CALLA,shocked,question,Calla]Calla: ...That''s not a tint.'
    - '\pf[CALLA,neutral,,Calla]Calla: I''m sorry, could you step out and in again?'
    - move:
        who: player
        route: [backward, forward]
        wait: true
    - {se: GUI sel buzzer}
    - NULL.
    - 'Boy: Mum, that one''s got no color!'
    - 'Boy''s Mother: Don''t point.'
    - The queue behind you murmurs.
    - move:
        who: Aurelian Voss (dock)
        route: [through_on, up, up, up, turn_up, through_off]
        wait: true
    - '\pf[VOSS,happy,,Aurelian Voss (dock)]Voss: Faulty unit. These things hate sea air.'
    - '\pf[VOSS,neutral,,Aurelian Voss (dock)]Voss: Let them through, Calla.'
    - '\pf[CALLA,neutral,,Calla]Calla: Sir, the protocol says—'
    - '\pf[VOSS,neutral,,Aurelian Voss (dock)]Voss: The protocol was written by me, on a train. Let them through.'
    - '\pf[CALLA,neutral,,Calla]Calla: ...Yes, sir. Welcome to Velmora.'
    - move:
        who: player
        route: [up]
        wait: true
    - move:
        who: Aurelian Voss (dock)
        route: [through_on, up, turn_left]
        wait: true
    - '\pf[VOSS,happy,,Aurelian Voss (dock)]Voss: There. Ordinary as anyone. Enjoy the Landing. Try the bramble tarts.'
    - move:
        who: Aurelian Voss (dock)
        route:
        - up
        - up
        - turn_down
        - wait 30
        - up
        - up
        - up
        - up
        - up
        - {opacity: 0}
        wait: true
    - move:
        who: Calla
        route: [turn_right, wait 10]
        wait: true
    - {se: Voltorb Flip tile}
    - {wait: 20}
    - switch: [PRO_SCANNED_NULL, true]
    - The ship's horn sounds, long. Behind you the Dovetail pulls back from the pier and stops. A chain is drawn across the harbor mouth.
    - 'Harbor Crier: By order of the Concert of Regions, the Hallow Strait is closed! The Hallow Strait is closed!'
    - var: [STORY_ACT, 1]
    - var: [STORY_CHAPTER, 1]
    - {script: 'pfm_card(:PF_ACT1_TITLE, "ACT I — THE LAST FERRY")'}
    - {script: 'pfm_quest(:mums_letter, "Mum''s Letter", "Find Imelda Larch at the research station on the headland.")'}
    trigger: touch
    move: fixed
    cond: {switch: PRO_FERRY_DONE}
  - commands: []
    trigger: action
    move: fixed
    cond: {switch: PRO_SCANNED_NULL}
  at: [33, 47]
