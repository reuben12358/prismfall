- type: event
  name: Docking
  pages:
  - commands:
    - The gangway is down. Passengers queue toward a brass-and-glass gate bolted to the old stone pier. Beside it stands a green bronze plaque.
    - '\pf[CALLA,neutral,,Calla]Calla: Welcome to Velmora. Step through one at a time, please. Hold still. It doesn''t hurt.'
    - move:
        who: Boy (pier)
        route: [up, up]
        wait: true
    - {se: Pkmn exp full}
    - A bar on the gate glows green.
    - '\pf[CALLA,neutral,,Calla]Calla: Insect tint. Briarwick. Thank you.'
    - move:
        who: Boy (pier)
        route: [up, turn_down]
        wait: false
    - 'Boy: MUM. I''M GREEN.'
    - 'Boy''s Mother: I know, love.'
    - move:
        who: Boy's Mother (pier)
        route: [up, up, up]
        wait: true
    - move:
        who: Woman with crate (pier)
        route: [up, up]
        wait: true
    - {se: Pkmn exp full}
    - The bar glows white.
    - '\pf[CALLA,neutral,,Calla]Calla: Blank tint. Saltmere. Welcome home.'
    - move:
        who: Woman with crate (pier)
        route: [up, up, up]
        wait: true
    - selfswitch: [A, true]
    trigger: autorun
    move: fixed
    cond: {switch: PRO_FERRY_DONE}
  - commands: []
    trigger: action
    move: fixed
    cond: {self: A}
