        - - '\pf[EDDA,neutral,,Captain Edda]Edda: ...You sure? I''ll ask once more, because nobody asked her. Once I cast off, that''s it.'
          - choices: [I'm staying., Take me back.]
            branches:
            - ['\pf[EDDA,happy,,Captain Edda]Edda: Good. Stars. Don''t frighten an old woman.']
            - - '\pf[EDDA,sad,,Captain Edda]Edda: Right. Get aboard, then.'
              - tone: [-255, -255, -255, 0, 30]
              - The horn. The eighteen lights recede.
              - {script: 'Prismfall.game_over(:GO_HOMEWARD)'}
            cancel: 0
        cancel: 0
      - {script: 'pfm_set(:edda_lastcall)'}
