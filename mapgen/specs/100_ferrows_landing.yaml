- type: event
  name: Kestrel K1
  pages:
  - commands:
    - move:
        who: Kestrel K1
        route: [face_player]
        wait: true
    - '\pf[KESTREL,neutral,,Kestrel K1]Kestrel: You came in on the last ferry? Great. Velmora''s sinking and they''re still letting tourists on.'
    - choices: [I was born here., I'm not a tourist., '...']
      branches:
      - ['\pf[KESTREL,shocked,question,Kestrel K1]Kestrel: ...Then you left, and came BACK? That''s worse.']
      - ['\pf[KESTREL,smug,,Kestrel K1]Kestrel: Prove it.']
      - ['\pf[KESTREL,angry,anger,Kestrel K1]Kestrel: Say something! Gran does that. The staring. I hate the staring.']
      cancel: 3
    - if: 'Prismfall.rival_battle(:RIVAL_KESTREL, "Kestrel", 1, can_lose: true)'
      then:
      - '\pf[KESTREL,shocked,shock,Kestrel K1]Kestrel: ...With the type disadvantage.'
      - '\pf[KESTREL,angry,,Kestrel K1]Kestrel: Fine. You''re not a tourist. You''re a problem.'
      - {script: 'pf_bond_add(:KESTREL, 1)'}
      else: ['\pf[KESTREL,smug,,Kestrel K1]Kestrel: Boat fare: wasted.', '\pf[KESTREL,neutral,,Kestrel K1]Kestrel: ...Your partner didn''t quit, though.
          Mine would''ve bitten me. Huh.']
    - {heal: true}
    - move:
        who: Juno (lab yard)
        route:
        - graphic: [JUNO, 0, 2, 0]
        - {opacity: 255}
        - through_on
        - down
        - down
        - through_off
        - face_player
        wait: true
    - '\pf[JUNO,happy,sparkle,Juno (lab yard)]Juno: That was amazing! Both of you! We should have a team name!'
    - '\pf[KESTREL,deadpan,,Kestrel K1]Kestrel: There''s no team.'
    - '\pf[JUNO,happy,,Juno (lab yard)]Juno: Team Compost! Because we break things down and make them better!'
    - '\pf[KESTREL,deadpan,,Kestrel K1]Kestrel: I''m not in it.'
    - '\pf[JUNO,happy,,Juno (lab yard)]Juno: He''s in it.'
    - anim: [Kestrel K1, 3]
    - move:
        who: Kestrel K1
        route:
        - through_on
        - left
        - left
        - left
        - left
        - left
        - left
        - {opacity: 0}
        wait: true
    - switch: [CH1_K1_DONE, true]
    trigger: autorun
    move: fixed
    graphic: {sprite: trainer_RIVAL1, dir: up}
    cond: {switch: CH1_STARTER_GOT}
  - commands: []
    trigger: action
    move: fixed
    cond: {switch: CH1_K1_DONE}
  at: [51, 13]
- type: event
