    graphic: {sprite: NPC 14, dir: left}
    cond: {switch: PRO_FERRY_DONE}
  - commands: ['\pf[EDDA,angry,anger]Edda: Impounded! Thirty-one years and they chain her up like a stray Growlithe!', '\pf[EDDA,deadpan]Edda: I''m told
        I may apply for compensation. In writing. To the people who did it.', '\pf[EDDA,neutral]Edda: ...You''ve somewhere to go, sprog? Larch? Good. Up
        the headland. She''ll feed you something terrible.', '\pf[EDDA,sad]Edda: You stand at the rail like somebody I used to know. That''s all. Go on.']
    trigger: action
