- type: event
  name: Sendoff 1
  pages:
  - commands:
    - if: '!pfm?(:ch2_sendoff)'
      then:
      - '\pf[LARCH,neutral,,Larch (sendoff)]Larch: Eighteen gyms. Saltmere''s first. The forest road to Briarwick''s corded off -- the Glasswood''s walked
        across it -- so you go round by the coast.'
