stamps:
  - {stamp: lab,        at: [16, 4],  link: FL_LAB,     name: Lab door}
  - {stamp: pokecenter, at: [6, 11],  link: FL_PC,      name: Poke Center door}
  - {stamp: mart,       at: [26, 12], link: FL_MART,    name: Mart door}
  - {stamp: house_red,  at: [5, 18],  link: FL_INN,     name: Inn door}
  - {stamp: institute,  at: [12, 18], link: FL_CUSTOMS, name: Customs door}
  - {stamp: house_red2, at: [26, 18], link: FL_DOCK,    name: Dockmaster door}
  - {stamp: condo,      at: [33, 15], link: FL_LIGHT,   name: Lighthouse door}
