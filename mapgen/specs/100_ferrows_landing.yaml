    trigger: action
    move: fixed
    cond: {switch: CH1_STARTER_GOT}
    through: true
  - commands:
    - if: '!pfm?(:juno_errand)'
      then:
      - '\pf[JUNO,panic,,Juno (lab yard)]Juno: \PN! Mum''s Skwovet''s got out again. Biscuit. He''s gone to the Pruett orchard and I''m not— nobody''s supposed
        to go in there.'
