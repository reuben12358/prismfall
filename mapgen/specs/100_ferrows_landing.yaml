- type: event
  name: Edda's last call 1
  pages:
  - commands:
    - if: '!pfm?(:edda_lastcall)'
      then:
      - '\pf[EDDA,neutral,,Captain Edda]Edda: That''s it, then. Once I cast off the Concert''s cutters won''t let me back across.'
      - '\pf[EDDA,neutral,,Captain Edda]Edda: Last chance, sprog. Anyone who wants off this rock rides with me now.'
      - choices: [I'm staying., I want to go back.]
        branches:
        - ['\pf[EDDA,happy,,Captain Edda]Edda: Thought so. Go on. Mind the gap.']
        - - '\pf[EDDA,neutral,,Captain Edda]Edda: ...You sure? I''ll ask once more, because nobody asked her. Once I cast off, that''s it.'
          - choices: [I'm staying., Take me back.]
            branches:
            - ['\pf[EDDA,happy,,Captain Edda]Edda: Good. Stars. Don''t frighten an old woman.']
            - - '\pf[EDDA,sad,,Captain Edda]Edda: Right. Get aboard, then.'
              - tone: [-255, -255, -255, 0, 30]
              - The horn. The eighteen lights recede.
              - {script: 'Prismfall.game_over(:GO_HOMEWARD)'}
            cancel: 0
        cancel: 0
      - {script: 'pfm_set(:edda_lastcall)'}
    trigger: touch
    move: fixed
    cond: {switch: PRO_FERRY_DONE}
  at: [33, 51]
