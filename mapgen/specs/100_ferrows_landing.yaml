- type: event
  name: Lamplighter
  pages:
  - commands:
    - if: pfm?(:lamps_done)
      then: ['Lamplighter: Forty years. And the gulls came to mine. That''ll do.']
      else:
      - if: pfm_count(:lamps) >= 6
        then:
        - {script: pfm_dusk(30)}
        - Dusk. Above the six small yellow flames, the Meridian lamps switch on, white and humming.
        - 'Lamplighter: There. Look at that. You can hardly see mine under theirs.'
        - 'Lamplighter: ...But the gulls came to mine. Did you see? Here. I won''t need it.'
        - {script: 'pfm_item(:CHARCOAL, 1)'}
        - It kept a harbor lit for forty years.
        - {script: pfm_day(30)}
        - {script: 'pfm_set(:lamps_done)'}
        - {script: 'pfm_quest_done(:last_round)'}
        else:
        - if: pfm_quest?(:last_round)
          then:
          - 'Lamplighter: Six lamps on the quay. The proper way. Off you go.'
          - {script: 'pbMessage(_INTL("({1} of 6 lit.)", pfm_count(:lamps)))'}
          else:
          - if: pfm?(:lamp_talked)
            then:
            - 'Lamplighter: The pole lights itself tonight. Do an old man a kindness? Light the six quay lamps by hand, the proper way. Last time anyone
              will.'
            - {script: 'pfm_item(:LAMPTAPER, 1, "Lamplighter''s Taper")'}
            - {script: 'pfm_quest(:last_round, "The Last Round", "Light the six old lamps along the quay (0/6).")'}
            else:
            - 'Lamplighter: Forty years I''ve lit this quay. Now a pole does it. The pole doesn''t know the fishwives'' names.'
            - {script: 'pfm_set(:lamp_talked)'}
    trigger: action
    move: fixed
    graphic: {sprite: NPC 10, dir: down}
  at: [30, 43]
