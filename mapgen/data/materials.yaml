    - [1760, 1807, modern]       # Goldenleaf: train
    - [2304, 2359, modern]       # Goldenleaf: Poke Center / Mart
    - [11496, 14431, modern]     # Aevium Past: city blocks, cars, signage
    - [14560, 17743, modern]     # Aevium Past: city blocks
