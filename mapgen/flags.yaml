# Gym puzzle Switch / Variable IDs (block 301-400, gym n = 300+5n ... 300+5n+4; GYM_PUZZLES.md).
# Story IDs (101-300) are read straight from design/FLAGS.md by build.py - write their NAMES in specs.
variables:
  # SPINE Rev 14 swapped Gyms 1 and 2. The 305-309 / 310-314 blocks stay with their buildings: 305-309 = the Loomhouse
  # (Tamsin, now Gym 2, maps 130-134), 310-314 = the Pell Playhouse (Dorian, now Gym 1, maps 150-154).
  CANOPY_WEB_A: 305   # Gym 2 Canopy (SPINE Rev 19): Joltik web A zapped (0/1); webs flip taut <-> sticky
  CANOPY_WEB_B: 306
  CANOPY_WEB_C: 307
  LOOM_BRIDGE: 309    # Upper Lofts bridge swung by the brass wire (0 none, 1 P5-P6, 2 P4-P6)
  STAGE_SCENE: 310    # Playhouse Backstage revolving stage set (0 work lights, 1 Shipwreck, 2 Forest, 3 Throne)
  STAGE_CURTAIN: 311  # Gym 1 auditorium: house curtain raised (0/1)
  STAGE_TURNTABLE: 312 # Backstage Trap Room revolve, quarter turns (0-3)
  STAGE_AUDIENCE: 313 # Gym 1: the Saltmere audience (townsfolk met + Trial-board quests); sets the house and the Grand Stage start
  D1_CHIME: 501       # Glassed Orchard chime rows: notes rung in order (0-3)
  # Road mechanics 601-650 (map builder 10): the crafted roads' moving parts
  ROAD_GUST: 601      # Frostwick Pass wind gap: 0 calm / 1 gusting (pfp_metronome from the gap's parallel event)
  ROAD_SLUICE: 602    # the Dyers' Ford vat-yard sluice: colour stones stepped in order (0-3; 4 = open)
  ROAD_RAMRACE: 603   # Spinners' Rise Ram Race: 0 not raced, 1 running, 2 won, 3 lost (rematch allowed)
  ROAD_RAMSTEPS: 604  # the Ram Race's start: $stats.distance_walked when the boy said go
  D8_FRAME: 536       # The Rehearsal (568): the replay's frame 0-4, one per step (pfp_step_clock from the map's parallel event)
switches:
  PUZZLE_SKIP: 301    # mirror of the `puzzleskip` password (Core 020_Passwords.rb): apprentices offer "Skip this room"
  PUZZLE_ASSIST: 302  # reserved: hints on
  LOOM_ALPHA: 305     # Upper Lofts cords
  LOOM_BRASS: 306     # the brass Meridian wire
  LOOM_GAMMA: 307
  LOOM_KNOT: 308      # Granny's Knot solved (134)
  STAGE_FLAT_A: 310   # Backstage loft flats: ON = flown (hangs in the Fly Loft, off the stage)
  STAGE_FLAT_B: 311
  STAGE_FLAT_C: 312   # the rostrum
  STAGE_TRAP_DONE: 314 # Backstage Trap Room chest taken
  GYM3_BELL: 315      # Tidelock tide bell: ON = currents run inland (north)
# Dungeons 501-600, 5 per dungeon (DUNGEON_PUZZLES.md section 0)
  D2_COCOON1: 506     # Deepwood lantern cocoons lit
  D2_COCOON2: 507
  D2_COCOON3: 508
  D7_CURTAIN_1: 531   # the Rimewood's Frost Loom: icicle curtains broken
  D7_CURTAIN_2: 532
  D7_CURTAIN_3: 533
  D3_BRIDGE_A: 511    # Cocoonfall Hollow crystal-silk bridges taut
  D3_BRIDGE_B: 512
  D3_BRIDGE_C: 513
