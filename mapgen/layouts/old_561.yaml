events:
  - {type: warp, name: Gullcry north mouth, at: [3, 22], link: R6_CAVE_N, arrive: [4, 22, right], se: Door exit}
  - {type: warp, name: Gullcry south mouth, at: [3, 37], link: R6_CAVE_S, arrive: [4, 37, right], se: Door exit}
  - {type: sign, at: [12, 32], text: "LANDSLIDE - ROAD CLOSED\nDetour through Gullcry Caves."}
  - type: event
    name: Trainer(4)
    at: [11, 5]
    pages:
      - graphic: {sprite: trainer_RIVAL1, dir: down}
        trigger: event_touch
        commands:
          - "Kestrel: You. Of course it's you. I'm tracking a Hollow cell from Saltmere - stay out of my way."
          - "He draws a Poké Ball. An Honedge hums at his hip. \"Gran's. My mother's blade's child. Don't you dare lose it,\" she'd said."
          - if: 'Prismfall.rival_battle(:RIVAL_KESTREL, "Kestrel", 2)'
            then:
              - "Kestrel: ...Tch."
              - choices: ["(Kind) Do you think the Mourner is your mother?", "(Blunt) The Mourner sounds just like her, doesn't she?", "(Say nothing)"]
                cancel: 0
                branches:
                  - [{script: "pf_choose(:ch4_kestrel_mourner, :kind)"}, "Kestrel: Don't. Just - don't. ...Thanks for asking quiet, I guess."]
                  - [{script: "pf_choose(:ch4_kestrel_mourner, :blunt)"}, "He shoves past you without a word."]
                  - [{script: "pf_choose(:ch4_kestrel_mourner, :silent)"}, "Kestrel: ...She'd never wear a mask. She hated masks."]
              - {switch: [CH4_K2_DONE, true]}
              - {var: [KESTREL_STAGE, 1]}
              - {selfswitch: [A, true]}
      - cond: {self: A}
  - {type: trainer, at: [12, 48], sight: 4, dir: up, sprite: trainer_BIRDKEEPER, trainer: [BIRDKEEPER, Wren],
     intro: "The gulls here are huge!", after: "Gullcry Caves are full of them."}
  - {type: trainer, at: [10, 40], sight: 4, dir: down, sprite: trainer_SAILOR, trainer: [SAILOR, Haldor],
     intro: "Cliff path's shut! Battle while you wait!", after: "The caves are slippery. Mind the tide pools."}
  - {type: trainer, at: [14, 14], sight: 4, dir: left, sprite: trainer_COOLTRAINER_F, trainer: [COOLTRAINER_F, Astrid],
     intro: "Isenmar breeds tough trainers. Let me show you.", after: "Ebbmouth's just north. Smell the eel?"}
  - {type: trainer, at: [20, 16], sight: 4, dir: left, sprite: trainer_FISHERMAN, trainer: [FISHERMAN, Kjell],
     intro: "Sea-cliff fishing is an art!", after: "The sea's restless lately."}
  - {type: item, at: [5, 46], item: GREATBALL}
  - {type: item, at: [20, 4], item: MYSTICWATER}
