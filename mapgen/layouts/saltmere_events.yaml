- type: event
  name: Kestrel
  at:
  - 53
  - 18
  pages:
  - cond:
      switch: CH3_PAGEANT_DONE
    graphic:
      sprite: trainer_RIVAL1
      dir: left
    commands:
    - Kestrel is outside the Hall, white-faced.
    - 'Kestrel: That voice. The way she talks... no. NO.'
    - He runs.
    - selfswitch:
      - A
      - true
  - cond:
      self: A
- type: event
  name: Royal notice
  at:
  - 47
  - 18
