# Map music and ambience: the single source for every built map's BGM / BGS (Audio v4.3,
# gemini_recommends/2026-11-21_audio-mastering-and-soundscape/WIRING_SPEC.md section 3).
# mapgen/map_audio.py turns this into maps_out/Plugins/Prismfall Maps/013_MapAudio.rb (build.py runs it; or run
# `python3 -I mapgen/map_audio.py` alone). The plugin applies an entry when the map loads, and ONLY for files
# that are installed: a missing track leaves the map's own (spec `bgm:`) music in place, so a project without
# audio/install_audio.py still plays the stock placeholders instead of silence.
#
#   bgm:         Audio/BGM name (audio/manifest.tsv final_name). Leave it out to keep the spec's bgm
#                (Poke Center / Poke Mart stay stock).
#   bgm_volume:  default 100
#   bgs:         Audio/BGS loop. "" = silence: the map stops the ambience of the map before it (interiors).
#                Leave the key out to keep whatever the spec baked in.
#   bgs_volume:  default 80
#   rain:        true/false - swap the BGS for Audio/BGS/Rain while it rains on this map (weather is rolled from
#                the map's metadata). Default: true when the map has a non-empty bgs and is not listed false.
#
# A spec can override any of these for its own map with a `map_audio: {bgm: ..., bgs: ...}` block (the spec wins).
# Finer slots (Town - Saltmere, Town - Briarwick ...) get their own names here once those tracks are installed.
