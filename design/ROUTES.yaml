notes:
- 'Owner: world cartographer. Generated by tools/worldmap/gen_docs.py from tools/worldmap/world_data.py.'
- One road joins two gym towns; each road is two or more maps (legs), each with its own name, landmark, field, wild flavour,
  fill list and at least one secret.
- size = target map size in tiles [w, h]; size_was = the current built/planned size. The map builder grows built maps toward
  the target when it next rebuilds them.
- 'fill = what occupies the space (density list): build every item, then decorate between them.'
- 'role: main (on the road), branch (dead-end side road off it), side (an alternative road).'
- 'segment = badges held on arrival (drives level caps). Revision 14 order: Saltmere is Gym 1, Briarwick Gym 2.'
- 'town_map: squares on the Velmora town map (region 0); first square = MapPosition.'
- 'paths: the order of stops as drawn on the maps (style road / side / under / sea / inset; ints are map ids, P:<id> a dungeon
  square, G:<letter> an Antumbra gate, pts:<name> a polyline in world_geo.py).'
- connections for the Revision 14 early chain are in design/maps.json (rev14_connections).
