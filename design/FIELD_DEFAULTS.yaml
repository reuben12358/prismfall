# FIELD_DEFAULTS.yaml - the default battle field of every map (Prismfall Field Effects v1.1).
# Owner: field-effects workstream. Consumers: mapgen (writes FieldEffects::MAP_FIELDS /
# MAP_WILD_FIELDS into Plugins/Prismfall Maps/002_MapFields.rb) and
# tools/field_defaults_to_rb.rb (interim fallback tables in the field plugin).
# Regenerate the maps: section after editing design/maps.json; hand edits to a map entry
# should set source: hand so they are kept.
#
# Field IDs are FieldEffects IDs (design/FIELDS.md). NONE = deliberately no field.
# stage: starting stage (1 if omitted). wild: field for wild battles on this map if it
# differs from field (surfing / fishing / diving still apply on top, see below).
# borrow: optional list of field IDs. An open borrowing field (the Bleed) on this map
# borrows only from these (FieldEffects::MAP_BORROW_POOLS; read by the field plugin only).

schema: 1
field_plugin_version: "1.1.0"

# How the engine picks a battle's field (FieldEffects.default_field_for_battle).
# The first rule that gives an answer wins.
resolution:
  - "setBattleRule(\"field\", X) in the event (gyms, bosses, set pieces; \"none\" = no field)"
  - "diving -> movement.diving"
  - "trainer battles: exceptions.trainers (tutorial and special fights, matched by trainer type + version)"
  - "wild battles: encounter_overrides for the encounter type (surf, rods, contest) unless the map's field is in that type's keep list"
  - "wild battles: maps.<id>.wild"
  - "wild battles on maps with no field: encounter_fallbacks (cave encounters -> CAVE)"
  - "surfing (trainer battle on the water) -> movement.surfing unless the map field is in encounter_overrides.water.keep"
  - "maps.<id>.field (+ stage)"
  - "environment_fallbacks[battle environment] (map metadata BattleEnvironment) for maps missing from maps:"
  - "NONE"

movement:
  diving: UNDERWATER
  surfing: WATER_SURFACE

# Wild battles, keyed by GameData::EncounterType#type (Land/Cave/Water/OldRod... map to land/cave/water/fishing).
encounter_overrides:
  water:     # surfing encounters
    field: WATER_SURFACE
    keep: [WATER_SURFACE, UNDERWATER, CORROSIVE_MIRE, BLEED, PRISM_ARENA, RAINBOW]
  fishing:   # Old/Good/Super Rod
    field: WATER_SURFACE
    keep: [WATER_SURFACE, UNDERWATER, CORROSIVE_MIRE, FROZEN_LAKE, BEACH, BLEED, RAINBOW]
  contest:   # bug-catching style contests
    field: MEADOW
    keep: []
encounter_fallbacks:   # only on maps whose own field is missing or NONE
  cave: CAVE

# Battle environment (map metadata BattleEnvironment) -> field, for maps not listed below.
environment_fallbacks:
  Grass: MEADOW
  TallGrass: MEADOW
  Puddle: MEADOW
  Forest: SILKWOOD
  ForestGrass: SILKWOOD
  MovingWater: WATER_SURFACE
  StillWater: WATER_SURFACE
  Underwater: UNDERWATER
  Cave: CAVE
  Rock: MOUNTAIN
  Sand: BEACH
  Snow: SNOWY_MOUNTAIN
  Ice: FROZEN_LAKE
  Volcano: VOLCANIC
  Graveyard: HOLLOW_CATHEDRAL
  Sky: STORMFRONT
  Space: MINDSCAPE
  UltraSpace: INVERSE
  None: NONE

# Biome fallbacks for NEW maps the pipeline adds before this file lists them:
# 1) kind bleed_zone -> BLEED; 2) name_rules (first match; per-kingdom variants);
# 3) kind interior -> NONE; 4) borderland_fallbacks; 5) kingdom_fallbacks[kingdom][kind];
# 6) at sea -> WATER_SURFACE; 7) gym -> GRAND_STAGE; 8) MEADOW.
kingdom_fallbacks:
  "Elowen": {town: MEADOW, route: MEADOW, dungeon: SILKWOOD}
  "Isenmar": {town: BEACH, route: SNOWY_MOUNTAIN, dungeon: CAVE}
  "Zenith": {town: NEON_GRID, route: MOUNTAIN, dungeon: FACTORY}
  "Nadir": {town: [NEW_MOON, 3], route: CORROSIVE_MIRE, dungeon: SCRAPYARD}
  "Ashkaar": {town: ASHEN_WASTE, route: MOUNTAIN, dungeon: VOLCANIC}
  "Ossaria": {town: DESERT, route: DESERT, dungeon: CAVE}
  "Antumbra": {town: MINDSCAPE, route: INVERSE, dungeon: INVERSE}
  "Crownhaven": {town: GRAND_STAGE, route: MEADOW, dungeon: CAVE}
  "Ruin Route": {town: BLEED, route: BLEED, dungeon: BLEED}
borderland_fallbacks:   # "Borderland (A/B)" -> blended field
  "Elowen/Isenmar": SNOWY_MOUNTAIN
  "Isenmar/Zenith": SNOWY_MOUNTAIN
  "Zenith/Ossaria": DESERT
  "Ossaria/Zenith": DESERT
  "Ossaria/Nadir": WASTELAND
  "Nadir/Ashkaar": ASHEN_WASTE
  "Ashkaar/Nadir": ASHEN_WASTE
  "Ashkaar/Ossaria": ASHEN_WASTE
  "Nadir/Elowen": CAVE
  "Zenith/Elowen": SILKWOOD
  "Elowen/Antumbra": MINDSCAPE
  "Antumbra/Ossaria": HOLLOW_CATHEDRAL
  "Zenith/Nadir": SCRAPYARD
  "Elowen/Ashkaar": MOUNTAIN
  "Ashkaar/Crownhaven": MOUNTAIN
  "Elowen/Ossaria": BEACH
  "islands": BEACH
  "sea": WATER_SURFACE
name_rules:   # regex on the map name (case-insensitive) -> field; by_kingdom overrides
  - {match: "Pok[eé]mon Center|\\bMart\\b|Rest House|\\bInn\\b|Cabin|Hut\\b|\\bHouse\\b|\\bHome\\b|Office|Shop\\b|Boutique|Bakery|Tavern|Bedroom|Dorm|Infirmary|Hospice|Customs|Lobby|Apartment|Dept\\. Store", field: NONE}
  - {match: "Theat(re|er)|Opera|Playhouse|Stage|Concert|Ballroom", field: GRAND_STAGE}
  - {match: "Cathedral|Chapel|Church|Abbey|Shrine|Temple|Sanctum|Sanctuary", field: [HOLLOW_CATHEDRAL, 2], by_kingdom: {"Antumbra": HOLLOW_CATHEDRAL}}
  - {match: "Manor|Crypt|Graveyard|Cemetery|Catacomb|Tomb|Necropolis|Barrow|Ossuary|Mausoleum", field: HOLLOW_CATHEDRAL}
  - {match: "Arena|Pit\\b|Ring\\b|Colosseum|Fight", field: COLOSSEUM, by_kingdom: {"Crownhaven": GRAND_STAGE}}
  - {match: "Throne|Great Hall|Palace|Castle|Keep\\b|Court\\b|Briar Hall", field: FAIRY_TALE, by_kingdom: {"Antumbra": INVERSE, "Ashkaar": DRAGONS_DEN, "Isenmar": FROZEN_LAKE, "Zenith": NEON_GRID, "Crownhaven": GRAND_STAGE, "Ossaria": DESERT, "Nadir": [NEW_MOON, 3]}}
  - {match: "Library|Archive|Observatory|Academy|Athenaeum|Stacks", field: MINDSCAPE}
  - {match: "Factory|Foundry|Works\\b|Forge|Mill|Plant|Refinery|Sluice|Turbine|Engine", field: FACTORY, by_kingdom: {"Ashkaar": VOLCANIC}}
  - {match: "Scrap|Junk|Dump|Salvage|Slag", field: SCRAPYARD}
  - {match: "Lab\\b|Laboratory|Research", field: NONE}
  - {match: "Sewer|Sump|Marsh|Bog|Swamp|Mire|Fen\\b|Drain", field: CORROSIVE_MIRE, by_kingdom: {"Elowen": BEACH}}
  - {match: "Airship|Sky|Deck|Cloud|Aerie|Gantr", field: STORMFRONT, by_kingdom: {"Elowen": NONE}}
  - {match: "Volcano|Caldera|Magma|Lava|Cinder|Ember", field: VOLCANIC}
  - {match: "Glacier|Icefall|Frost|Rime|Snow", field: SNOWY_MOUNTAIN}
  - {match: "Lake|Mere|Pond|Lagoon|Loch", field: WATER_SURFACE, by_kingdom: {"Isenmar": FROZEN_LAKE}}
  - {match: "Beach|Shore|Coast|Harbou?r|Pier|Dock|Port\\b|Quay|Strand|Cove|Breakwater|Promenade", field: BEACH}
  - {match: "Sea\\b|Strait|Ocean|Bay\\b|Channel|Reef", field: WATER_SURFACE}
  - {match: "Crystal|Geode|Gem|Amethyst|Quartz", field: CRYSTAL_CAVERN}
  - {match: "Darkglass|Lightless|Obsidian", field: DARK_CRYSTAL}
  - {match: "Cave|Caves|Cavern|Mine\\b|Tunnel|Grotto|Burrow|Depths|Undercroft|Cellar|Vault", field: CAVE}
  - {match: "Desert|Dune|Sands|Mesa|Canyon|Badlands", field: DESERT, by_kingdom: {"Nadir": WASTELAND}}
  - {match: "Peak|Mount\\b|Mt\\.|Summit|Ridge|Pass\\b|Cliffs?|Crag|Highlands?|Stair", field: MOUNTAIN, by_kingdom: {"Isenmar": SNOWY_MOUNTAIN}}
  - {match: "Garden|Glasshouse|Greenhouse|Orchard|Meadow|Heath|Farm|Field", field: MEADOW, by_kingdom: {"Ossaria": DESERT}}
  - {match: "Forest|Wood|Grove|Thicket|Wilds", field: SILKWOOD, by_kingdom: {"Isenmar": SNOWY_MOUNTAIN, "Antumbra": MINDSCAPE}}

