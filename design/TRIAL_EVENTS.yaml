    - {name: Empty stage (silence), key: SILENCE_STAGE, near: "the front row of the empty stalls", trigger: action,
       condition: "quest_step(:EL_SOUND_OF_SALTMERE) == :ask && !quest_flag(:EL_SOUND_OF_SALTMERE, :stage)"}
    - {name: Marguerite Fane, key: FANE, near: "the paint loft, under the torn backdrop", sprite: "scene-painter in a smock, Smeargle beside her",
