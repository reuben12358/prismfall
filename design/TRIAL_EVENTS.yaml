# TRIAL_EVENTS.yaml - map events for the wired Trial quests and event Pokemon (Chapters 1-4)
# Owner: Prismfall Trials (design/TRIALS.md). Consumer: the map builder (design/MAPGEN.md section 4 event DSL).
# No map file was edited; place these where `near:` says and fill `at:`.
#
# How every event works
#   * Commands are ONE call: {script: 'pf_trial_talk(:KEY)'}. The plugin's TALK table (150_Trials_Talk.rb) picks the
#     quest scene; all dialogue lives in the plugin (printed in design/TRIALS_QUESTS.md), so maps never need re-pouring
#     when lines change.
#   * Objects that come and go (the Nickit, lanterns, a Ralts...) carry their visibility as the FIRST command, a comment:
#     {comment: 'Condition: <Prismfall::Conditions string>'} (010_Trials_PageConditions.rb). Give such an event a second,
#     empty page FIRST in the list (no graphic, no commands) so it is "nothing" while the condition is false.
#   * Existing story NPCs get a branch, not a new event (`patch:`):
#       {if: 'pf_trial_ready?(:KEY)', then: [{script: 'pf_trial_talk(:KEY)'}], else: [<their existing lines>]}
#   * Trial halls/boards: a keeper NPC whose TALK entry has a board falls through to pf_trial_board(:TRIAL) when no quest
#     scene is due. A separate board object can just call pf_trial_board(:TRIAL).
#   * Story switches used in page conds: CH1_STARTER_GOT (S103), PRO_FERRY_DONE (S101), CH3_PAGEANT_DONE (S108).
#   * Sprites are descriptions; use whatever the cast/NPC sheets provide.
maps:
  100:
    name: Ferrow's Landing
    events:
    - {name: Brother Teasel, key: TEASEL, near: "the wayshrine beside the Accord plaque; a rope of paper lanterns strung over it",
       sprite: "young monk, grey robe", trigger: action, cond: {switch: CH1_STARTER_GOT},
       note: "Keeper of the Ferrow's wayshrine (Elowen, the Quiet Way). Falls through to the Elowen board."}
    - {name: Lantern rope, key: WAYSHRINE_ROPE, near: "over the wayshrine", sprite: "tile: paper lanterns on a rope", trigger: action,
       cond: {switch: CH1_STARTER_GOT}, commands: ["{script: 'pf_trial_board(:ELOWEN)'}"]}
    - {name: Wenna Hale, key: WENNA, patch: "existing event 'Wenna Hale' (tart stall)"}
    - {name: Tart stall (thief), key: TART_STALL, near: "under Wenna's tart stall", sprite: "Nickit, half hidden",
       trigger: player_touch, condition: "quest_step(:EL_TART_THIEF) == :ask",
       move_after: "jump away toward the kelp racks, then erase"}
    - {name: Nickit (kelp racks), key: NICKIT_SIGHTING, near: "the kelp racks", sprite: Nickit, trigger: player_touch,
       condition: "quest_step(:EL_TART_THIEF) == :chase && chase(:EL_TART_THIEF) == 1", move_after: "dash under the pier, erase"}
    - {name: Nickit (under the pier), key: NICKIT_SIGHTING, near: "under the pier at the low-tide steps", sprite: Nickit, trigger: player_touch,
       condition: "quest_step(:EL_TART_THIEF) == :chase && chase(:EL_TART_THIEF) == 2", move_after: "run for the lighthouse, erase"}
    - {name: Nickit (lighthouse steps), key: NICKIT_SIGHTING, near: "the lighthouse steps; Hesper's geraniums", sprite: Nickit, trigger: player_touch,
       condition: "quest_step(:EL_TART_THIEF) == :chase && chase(:EL_TART_THIEF) == 3", move_after: "leap the wall toward Tidewatch Station, erase"}
    - {name: Washing line, key: DEED_WASHING, near: "beside the 'Woman hanging washing'; a shirt wrapped round a kelp rack", trigger: action,
       condition: "!deed(:fl_washing)"}
    - {name: Rope-skipping Girl 1, key: DEED_ROPE, patch: "existing event 'Rope-skipping Girl 1': add the branch; it offers the loose rope end"}
    - {name: Old Sailor, key: DEED_SAILOR, patch: "existing event 'Old Sailor' (faces the empty berth)"}
    - {name: Tipped kelp basket, key: DEED_KELP, near: "the far end of the kelp racks, away from the Kelp-drier", trigger: action,
       condition: "!deed(:fl_kelp)"}
    - {name: Timburr (berth), key: BERTH_TIMBURR, near: "the empty ferry berth", sprite: "Timburr carrying a plank", trigger: action,
       condition: "!quest_done(:EL_LAST_PLANK)", cond: {switch: CH1_STARTER_GOT}}
    - {name: Loose plank 1, key: BOATYARD_PLANK, near: "the boatyard by the Dockmaster's House", sprite: "tile: plank", trigger: action,
       condition: "quest_step(:EL_LAST_PLANK) == :planks", after: "{selfswitch: [A, true]} with an empty page 2 on self switch A"}
    - {name: Loose plank 2, key: BOATYARD_PLANK, near: "the boatyard, against the slipway", same_as: "Loose plank 1"}
    - {name: Loose plank 3, key: BOATYARD_PLANK, near: "the boatyard, under the upturned skiff", same_as: "Loose plank 1"}
  103:
    name: Larch Research Station (Tidewatch Station)
    events:
    - {name: Nickit (loft), key: LOFT_NICKIT, near: "the Sanctuary loft, beside 'Kestrel (loft)'", sprite: "Nickit on a hay bale",
       trigger: action, condition: "quest_step(:EL_TART_THIEF) == :loft",
       note: "Kestrel's loft event should not also talk while this runs; it can stay as is (the scene speaks for him)."}
    - {name: Professor Larch, key: LARCH, patch: "existing event 'Professor Larch': the Form 7-C research stamp"}
  106:
    name: Ferrow Lighthouse Lamp Room
    events:
    - {name: Hesper Vane, key: HESPER, patch: "existing event 'Hesper Vane': the crate by the lamp (ZE_FORM_7B :warm)"}
  107:
    name: Dockmaster's House
    events:
    - {name: Dockmaster, key: DOCKMASTER, patch: "existing event 'Dockmaster' (Master of Nothing; Form 7-C livestock stamp)"}
  108:
    name: Quarantine Customs Hall
    events:
    - {name: Grant Kiosk P-3NNY, key: KIOSK_PENNY, near: "by the scanner gates", sprite: "tile: brass ticket kiosk with a Rotom face in the glass",
