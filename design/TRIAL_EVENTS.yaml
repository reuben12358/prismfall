    - {name: Farmer Hale (Coll), key: COLL, patch: "existing event 'Farmer Hale'"}
  522:
    name: The Glassed Orchard
    events:
    - {name: Glass hoofprints 1, key: ORCHARD_HOOFPRINT, near: "just past the Bleed Veil", sprite: "tile: glinting hoofprints", trigger: player_touch,
       condition: "quest_active(:EL_GLASS_FOAL) && chase(:EL_GLASS_FOAL) == 0"}
    - {name: Glass hoofprints 2, key: ORCHARD_HOOFPRINT, near: "the glass hedge maze", trigger: player_touch,
       condition: "quest_active(:EL_GLASS_FOAL) && chase(:EL_GLASS_FOAL) == 1", note: "show a pale foal sprite trotting off through the hedge"}
    - {name: Glass hoofprints 3, key: ORCHARD_HOOFPRINT, near: "the ring of prints round the oldest tree", trigger: player_touch,
       condition: "quest_active(:EL_GLASS_FOAL) && chase(:EL_GLASS_FOAL) == 2"}
    - {name: Glass foal, key: GLASS_FOAL, near: "under the oldest glassed tree", sprite: "Galarian Ponyta", trigger: action,
