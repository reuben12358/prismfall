  # ---- Early side content, Chapters 0-5 (116_Quests_Early.rb, talk rows 153_Talk_Early.rb; 2026-11-21) -------------------
  # 528/548/579 are built: mapgen/trial_overlay.py lays these events. 580/588/180/185 are map builder 15's (mapgen/REQUESTS.md).
  528:
    name: Marram Down
    events:
    - {name: Sand-sculptor, key: SCULPTOR, patch: "existing event 'Sand-sculptor' (The Crown in the Sand, Ch2: offer after S108 and Badge 1; report)"}
    - {name: Sand Crown, key: SAND_CROWN, near: "beside the Sand-sculptor: her sand Crown", trigger: action,
       note: "page 1 always (a sand crown; idle line); page 2 'Condition: quest_step(:EL_SAND_CROWN) == :ask && night' shows Followers/SANDYGAST. The scene itself checks night"}
  548:
    name: Cocoonfall Hollow
    events:
    - {name: Humming cocoon, key: GLASS_COCOON, near: "among the Matriarch's glass cocoons, south of the ravine (by 'Glass cocoons')", sprite: "Followers/JOLTIK (a small glass cocoon)", trigger: action,
       condition: "quest_active(:EL_MATRIARCH_HUM)", note: "The Note Under the Glass (Ch3, after S107): hatches with Badge 3"}
  579:
    name: The Wolfsrime
    events:
    - {name: Old drover, key: DROVER, patch: "existing event 'Old drover' by the cold kiln (Bracken Comes In, Ch4)"}
    - {name: Bracken (the den), key: WOLF_DEN, near: "in the hollow under the fallen giant, by 'The old den'", sprite: "Followers/GREAVARD", trigger: action,
       condition: "quest_step(:EL_DROVERS_BELL) == :ask", note: "the drover's dog; 'The hanging bell' (42,34) keeps its own lines: its 'something answers' is the hint"}
  580:
    name: The Reedholms
    events:
    - {name: Fisher at the Veil, key: VEIL_FISHER, patch: "the script's 'Fisher at the Veil' beside the Bleed Veil warp to 588 (24_SCRIPT_CH5 580 item 6): {if: pf_trial_ready?(:VEIL_FISHER), then: talk, else: his own lines}",
       note: "The Names in Holmsby (Ch5, Badge 3)"}
  588:
    name: Ebb Hollow (Holmsby)
    events:
    - {name: Boundary stone 1, key: HOLLOW_STONE, near: "a boundary stone at the edge of the lane, under a hanging drop of river", sprite: "tile: carved stone", trigger: action,
       condition: "quest_step(:IS_EBB_HOLLOW) == :ask", after: "{selfswitch: [A, true]} with an empty page 2 on self switch A"}
    - {name: Boundary stone 2, key: HOLLOW_STONE, near: "a boundary stone by house number 9", same_as: "Boundary stone 1"}
