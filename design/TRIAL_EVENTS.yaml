       condition: "quest_step(:EL_LANTERNS) == :search && !quest_flag(:EL_LANTERNS, :ropewalk)"}
    - {name: Empty ropewalk (silence), key: SILENCE_ROPEWALK, near: "the far end of the ropewalk", trigger: action,
